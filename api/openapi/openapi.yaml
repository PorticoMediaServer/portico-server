      type: object
      additionalProperties: false
      required: [id, container, playable, parentKinds, childKinds, childOrder, defaultDestination, primaryArtworkRole]
      properties:
        id: { type: string }
        container: { type: boolean }
        playable: { type: boolean }
        parentKinds: { type: array, items: { type: string } }
        childKinds: { type: array, items: { type: string } }
        childOrder: { type: array, items: { type: string } }
        defaultDestination: { type: string, enum: [detail, children, series-detail] }
        primaryArtworkRole: { type: string }
    ArtworkRoleSemantic:
      type: object
      additionalProperties: false
