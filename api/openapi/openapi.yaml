            ETag:
              schema: { type: string }
            X-Portico-Settings-Revision:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
    patch:
      operationId: patchSettings
      summary: Atomically patch typed server settings using optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdateRequest"
      responses:
        "200":
          description: Updated settings document and apply impact
          headers:
            ETag:
              schema: { type: string }
            X-Portico-Settings-Revision:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsDocument"
        "409":
          description: expectedRevision no longer matches current settings
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }
  /settings/summary:
    get:
      summary: Get server settings summary
      description: Returns Settings section metadata and lightweight status cards without loading every settings subsystem.
      responses:
        "200":
          description: Settings summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsSummaryResponse"
  /settings/registry:
    get:
      operationId: getSettingsRegistry
      summary: Get the authoritative server settings field registry
      description: Returns owner scope, validation, runtime consumer, application, capability, secret, audit, retention, and outcome-test metadata for every writable server field.
      responses:
        "200":
          description: Settings field registry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsRegistryResponse"
  /events:
    get:
      summary: Stream application data-change events with Server-Sent Events
      description: Authenticated clients subscribe once at the shell level and use event tags to invalidate relevant UI data. Durable replay is not supported; sending Last-Event-ID produces a stream-reset event and the X-Portico-Stream-Resume response header is none. A subscriber that loses backpressure continuity also receives stream-reset before disconnect.
      parameters:
        - { name: Last-Event-ID, in: header, description: Unsupported replay cursor; any non-empty value requests an authoritative reset., schema: { type: string } }
      responses:
        "200":
          description: Server-sent application events
          headers:
            X-Portico-Stream-Resume: { schema: { type: string, const: none } }
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/AppEvent"
  /events/poll:
    get:
      operationId: pollApplicationEvents
      summary: Long-poll application data-change events
      description: Authenticated shell clients use the same event tags and invalidation semantics as the SSE route. A successful timeout returns 200 with an empty events array.
      x-portico-permission: authenticated
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-rate-policy: long-poll
      x-portico-audit-event: none
      parameters:
        - { name: cursor, in: query, description: Opaque cursor previously returned by this application-event route., schema: { type: string } }
        - { name: waitSeconds, in: query, description: Maximum time to wait for an event. Zero performs an immediate cursor check., schema: { type: integer, minimum: 0, maximum: 25, default: 20 } }
      responses:
        "200":
          description: Application events, or an empty successful timeout envelope
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationEventLongPollEnvelope" }
        "429":
          description: Long-poll concurrency or request-rate limit reached
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
        "503":
          description: Server shutdown interrupted the wait; retry shortly
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /logs:
    get:
      summary: List recent application log events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Log events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogEventListResponse"
  /logs/stream:
    get:
      summary: Stream live application log events with Server-Sent Events
      description: Durable replay is not supported. Last-Event-ID and subscriber gaps produce an explicit stream-reset event before disconnect.
      parameters:
        - { name: Last-Event-ID, in: header, description: Unsupported replay cursor; any non-empty value requests an authoritative reset., schema: { type: string } }
      responses:
        "200":
          description: text/event-stream
          headers:
            X-Portico-Stream-Resume: { schema: { type: string, const: none } }
          content:
            text/event-stream:
              schema:
                type: string
  /client-logs:
    post:
      summary: Upload bounded client diagnostic logs
      description: Disabled by default. When enabled in Troubleshooting settings, authenticated clients can upload bounded, redacted diagnostic events into an isolated client-diagnostics lane. Accepted counts may be lower than submitted counts when queue or per-account rate limits are reached; uploads never enter the server admin log stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientLogUploadRequest"
      responses:
        "201":
          description: Accepted client log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientLogUploadResponse"
        "400": { description: Invalid diagnostic envelope or field bounds }
        "403": { description: Client diagnostic uploads are disabled }
        "413": { description: Request body exceeds the bounded upload limit }
  /users:
    get:
      summary: List server users
      description: Requires an interactive server-owner session. API keys cannot enumerate accounts.
      x-portico-role: owner
