          type: array
          items:
            type: string
            enum: [exact_tuple, container_change, audio_conversion, audio_layout_reduced, gapless_packet_timing_preserved, gapless_output_unverified, gapless_source_facts_unknown, object_audio_not_preserved, video_conversion, video_constraint_exceeded, audio_constraint_exceeded, exact_seek_evidence_unavailable, subtitle_external, subtitle_burn_in, hdr_preserved, hdr_tone_mapped_to_sdr, hdr_tone_mapping_disabled, hdr10plus_downgraded_to_hdr10, dolby_vision_preserved, dolby_vision_verified_base_used, no_compatible_delivery_tuple, dolby_vision_conversion_unsupported, hardware_route_unverified, invalid_input]
