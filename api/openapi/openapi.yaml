        directPlayPolicy: { type: string, enum: [allow, prefer, never] }
        directStreamPolicy: { type: string, enum: [allow, prefer, never] }
        transcodePolicy: { type: string, enum: [allow, prefer, require, never] }
        allowHdr: { type: boolean }
        preferredAudioLanguage: { type: string, maxLength: 32 }
        preferredAudioLanguages: { type: array, maxItems: 16, uniqueItems: true, items: { type: string, maxLength: 32 } }
        preferredSubtitleLanguage: { type: string, maxLength: 32 }
        preferredSubtitleLanguages: { type: array, maxItems: 16, uniqueItems: true, items: { type: string, maxLength: 32 } }
        preferredSubtitleMode: { type: string, enum: [off, text, burn_in] }
        subtitlesEnabled: { type: boolean }
        burnInSubtitles: { type: boolean }
