        preferredAudioLanguages:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, maxLength: 32 }
          description: Ordered BCP-47 audio language policy. The server selects the first authorized matching stream before applying fallback.
        preferredSubtitleLanguage: { type: string, maxLength: 32, description: Preferred BCP-47 subtitle language resolved by the server before resource selection. }
        preferredSubtitleLanguages:
          type: array
          maxItems: 16
          uniqueItems: true
          items: { type: string, maxLength: 32 }
          description: Ordered BCP-47 subtitle language policy. The server selects the first authorized matching text stream before applying fallback.
        preferredSubtitleMode: { type: string, enum: [off, text, burn_in], description: Portable subtitle presentation intent; the server returns concrete subtitle resources or a validated burn-in resource. }
        subtitlesEnabled: { type: boolean, description: Explicit subtitle enablement. When false, the authoritative mode is off. }
