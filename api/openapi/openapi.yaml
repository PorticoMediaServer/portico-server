  /watch-with-friends/groups/{groupId}/events:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Stream Watch With Friends group updates as server-sent events
      responses:
        "200":
          description: Server-sent Watch With Friends group events
          content:
