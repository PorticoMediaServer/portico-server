                type: string
  /watch-with-friends/groups/{groupId}/events/poll:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: pollWatchWithFriendsGroupEvents
      summary: Long-poll Watch With Friends group snapshots
      description: Returns authoritative group snapshots only while the current profile remains an authorized group member with Watch With Friends permission. A successful timeout returns 200 with an empty events array.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-rate-policy: long-poll
      x-portico-audit-event: none
      parameters:
        - { name: cursor, in: query, description: Opaque cursor previously returned for this group and profile., schema: { type: string } }
        - { name: waitSeconds, in: query, description: Maximum time to wait for an event. Zero performs an immediate cursor check., schema: { type: integer, minimum: 0, maximum: 25, default: 20 } }
      responses:
        "200":
          description: Watch With Friends snapshots, or an empty successful timeout envelope
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WatchWithFriendsLongPollEnvelope" }
        "429":
          description: Long-poll concurrency or request-rate limit reached
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /watch-with-friends/groups/{groupId}/member/state:
    parameters:
      - name: groupId
