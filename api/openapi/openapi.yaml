          type: object
          additionalProperties:
            type: string
    PlaybackCapabilityVideo:
      type: object
      additionalProperties: false
      required: [codec, bitDepth, maxWidth, maxHeight, maxFrameRate]
      properties:
        codec: { type: string, minLength: 1 }
        profile: { type: string }
        level: { type: string }
        tag: { type: string }
        pixelFormat: { type: string }
        chroma: { type: string }
        dynamicRange:
          type: string
          enum: [sdr, pq, hlg, hdr10plus, dolby_vision]
