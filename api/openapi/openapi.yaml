      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [nextCursor, hasMore]
      properties:
        nextCursor:
          type: [string, "null"]
          description: Opaque encrypted continuation bound to the principal and normalized query. Collection continuations encode a stable sort tuple with an ID tie-breaker rather than a row offset.
        hasMore: { type: boolean }
        total: { type: integer, minimum: 0 }
