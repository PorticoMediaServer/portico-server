          schema:
            type: string
        - name: profile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Optimized version deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "403":
          description: User cannot manage libraries
  /media/{id}/subtitles:
    post:
      summary: Upload a text subtitle file for a media item
      description: Accepts WebVTT, SubRip, ASS/SSA, SBV, MicroDVD/SubViewer, TTML, and DFXP text subtitles. Uploaded files are normalized to WebVTT for browser playback.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .vtt, .srt, .ass, .ssa, .sbv, .sub, .ttml, or .dfxp text subtitle file under 2 MB.
                language:
                  type: string
                label:
                  type: string
      responses:
        "201":
          description: Updated media item with uploaded subtitle stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/subtitles/{streamId}:
    get:
      summary: Stream a managed subtitle file as WebVTT
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: WebVTT subtitle text
          content:
            text/vtt:
              schema:
                type: string
    head:
      summary: Inspect managed subtitle headers
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: streamId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: WebVTT subtitle headers
          content:
            text/vtt:
              schema: { $ref: "#/components/schemas/TextPayload" }
    patch:
      summary: Update managed subtitle timing
      description: Stores a bounded timing offset in milliseconds for managed external subtitles. The offset is applied when streaming WebVTT and when preparing burn-in subtitle files.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubtitleUpdateRequest"
      responses:
        "200":
          description: Updated media item with adjusted subtitle timing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    delete:
      summary: Delete an uploaded subtitle stream
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: streamId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subtitle deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /media/{id}/attachments/{attachmentId}:
    get:
      summary: Download an extracted embedded attachment
      description: Serves managed embedded media attachments such as fonts extracted from analyzed local files. Requires normal media access and never exposes arbitrary local paths.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attachment file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /media/{id}/segments:
    post:
      summary: Add a manual playback segment
      description: Adds an editor-defined intro, recap, commercial, outro, or credits marker for the media item and returns the updated media detail response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaSegmentRequest"
      responses:
        "201":
          description: Updated media item with the new segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/segments/{segmentId}:
    delete:
      summary: Delete a playback segment
      description: Removes an editor or provider segment marker for the media item and returns the updated media detail response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: segmentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated media item after segment deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/trickplay:
    get:
      summary: List generated trickplay sets
      description: Returns generated trickplay preview-set metadata for a media item without exposing local storage paths. Tile image serving is a separate authenticated media route once generation is implemented.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Trickplay sets for the media item
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/MediaTrickplaySet"
                  total:
                    type: integer
  /media/{id}/trickplay/{setId}/tiles/{tileIndex}.jpg:
    get:
      summary: Download a trickplay preview tile
      description: Serves a generated JPEG trickplay tile from managed app-data storage. Requires normal media access and never exposes arbitrary local paths.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: setId
          in: path
          required: true
          schema:
            type: string
        - name: tileIndex
          in: path
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: JPEG trickplay tile
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
  /media/{id}/trickplay/{setId}/tiles.m3u8:
    get:
      summary: Download a trickplay tile playlist
      description: Serves an authenticated HLS image playlist for generated trickplay tiles. The playlist references Portico tile routes only and never exposes local storage paths.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: setId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: HLS image playlist for trickplay tiles
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
  /media/{id}/lyrics:
    post:
      summary: Upload a lyric file for a music track
      description: Accepts synced LRC or plain TXT lyrics under 512 KB. Uploaded lyrics are stored as manual metadata and do not modify scanned sidecar files.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .lrc or .txt lyric file under 512 KB.
                language:
                  type: string
      responses:
        "201":
          description: Updated media item with uploaded lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/lyrics/{lyricId}:
    delete:
      summary: Delete uploaded manual lyrics
      description: Deletes lyrics uploaded through the manual lyric endpoint or fetched from supported remote lyric providers. Scanned local sidecar lyrics are left intact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lyricId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lyrics deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /media/{id}/lyrics/fetch:
    post:
      summary: Fetch lyrics from a remote provider
      description: Fetches track lyrics from LRCLIB using typed track artist, album title, track title, and duration metadata, then stores the result as provider lyric metadata.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Updated media item with fetched provider lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/lyrics/search:
    get:
      summary: Search remote lyrics
      description: Searches LRCLIB for lyric candidates for a music track. Results include provider IDs, track/artist/album labels, duration, and lyric format so an editor can choose the intended result.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Lyric candidates
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LyricSearchCandidate"
                  total:
                    type: integer
  /media/{id}/lyrics/apply:
    post:
      summary: Apply a remote lyric candidate
      description: Downloads the selected LRCLIB lyric candidate by provider ID and stores it as provider lyric metadata for the track.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, externalId]
              properties:
                provider:
                  type: string
                externalId:
                  type: string
      responses:
        "201":
          description: Updated media item with applied provider lyrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/images:
    post:
      summary: Upload artwork for a media item
      description: Accepts JPEG, PNG, or GIF artwork under 5 MB and stores it as a preferred manual media image record for the selected artwork type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .jpg, .jpeg, .png, or .gif artwork file under 5 MB.
                type:
                  type: string
                  description: Artwork type such as poster, backdrop, thumb, logo, banner, disc, or clearart.
      responses:
        "201":
          description: Updated media item with uploaded artwork
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/images/{imageId}:
    get:
      summary: Get stored artwork information
      description: Returns the typed media image record, including source, provider, preferred status, dimensions, and storage/remote location.
