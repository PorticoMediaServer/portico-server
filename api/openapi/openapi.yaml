openapi: 3.1.0
info:
  title: Portico Media Server API
  version: 0.1.0
  summary: Local-first media server API for web, mobile, TV, and embedded player clients.
servers:
  - url: /api
security:
  - cookieAuth: []
  - bearerAuth: []
x-portico-complete-handler-families:
  - /api/libraries/
  - /api/playback/receivers/
  - /api/playback-sessions/
  - /api/account/profiles/
  - /api/preferences/
  - /api/notifications/
  - /api/admin/viewer-feedback/
x-portico-audience-contract:
  version: 1
  scope: live-dvr-operational-boundary
  audienceRequiredRoutePrefixes: [/live-tv, /dvr, /admin/dvr, /library-channels, /admin/library-channels]
  managementRoutePrefixes: [/admin, /users, /settings, /auth/api-keys, /backups, /scheduled-tasks]
  clientCoreMethods:
    adminDvrOperationalStatus: getAdminDVRStatus
    adminLibraryChannel: getAdminLibraryChannel
    adminLibraryChannelHealth: getLibraryChannelHealth
    adminLibraryChannels: listAdminLibraryChannels
    adminLibraryChannelTemplateApplicability: evaluateLibraryChannelTemplateApplicability
    adminLibraryChannelTemplates: listLibraryChannelTemplates
    adminLiveTvSources: getLiveTvSources
    adminLiveTvSource: getLiveTvSourcesSourceId
    closeLiveTvStream: postLiveTvStreamsChannelIdClose
    createAdminLibraryChannel: createLibraryChannel
    createDvrRecording: postDvrRecordings
    createDvrRule: postDvrRules
    createLiveTvSource: postLiveTvSources
    deleteAdminLibraryChannel: deleteLibraryChannel
    deleteAdminLibraryChannelLogo: deleteLibraryChannelLogo
    deleteDvrRecording: deleteDvrRecordingsId
    deleteDvrRule: deleteDvrRulesId
    deleteLiveTvSource: deleteLiveTvSourcesSourceId
    discoverHDHomeRunSources: postLiveTvSourcesHdhomerunDiscover
    dvrRecording: getDvrRecordingsId
    dvrRecordingGroups: getDvrRecordingGroups
    dvrRecordingHlsUrl: getDvrRecordingsIdHlsResource
    dvrRecordings: getDvrRecordings
    dvrRecordingStreamUrl: getDvrRecordingsIdStream
    dvrRule: getDvrRulesId
    dvrRules: getDvrRules
    dvrSchedule: getDvrSchedule
    dvrStatus: getDVRStatus
    inspectDvrRecordingHlsUrl: headDvrRecordingsIdHlsResource
    inspectDvrRecordingStreamUrl: headDvrRecordingsIdStream
    inspectLibraryChannelHlsUrl: inspectLibraryChannelHLSResource
    libraryChannelGuide: getLibraryChannelGuide
    libraryChannelHlsUrl: getLibraryChannelHLSResource
    libraryChannelLogoUrl: getLibraryChannelLogo
    libraryChannels: listLibraryChannels
    libraryChannelsGuide: getLibraryChannelsGuide
    liveTv: getLiveTv
    liveTvChannels: getLiveTvSourcesSourceIdChannels
    liveTvChannel: getLiveTvChannelsChannelId
    liveTvGuide: getLiveTvSourcesSourceIdGuide
    liveTvHlsItemUrl: getLiveTvHlsChannelIdItem
    liveTvHlsPlaylistUrl: getLiveTvHlsChannelIdPlaylistM3u8
    liveTvHlsSegmentUrl: getLiveTvHlsChannelIdSegment
    liveTvLogoUrl: getLiveTvLogosChannelId
    liveTvStreams: getLiveTvStreams
    liveTvStreamUrl: getLiveTvStreamsChannelId
    openLiveTvStream: postLiveTvStreamsChannelIdOpen
    playDvrRecording: postDvrRecordingsIdPlayback
    refreshLiveTvSource: postLiveTvSourcesSourceIdRefresh
    regenerateAdminLibraryChannel: regenerateLibraryChannel
    reorderAdminLibraryChannels: reorderLibraryChannels
    replaceAdminLibraryChannel: replaceLibraryChannel
    restoreAdminLibraryChannelDefaults: restoreLibraryChannelDefaults
    startLiveTvPlayback: postLiveTvPlay
    testAddLiveTvSource: postLiveTvSourcesTestAdd
    tuneLibraryChannel: tuneLibraryChannel
    createCastBootstrap: postPlaybackCastBootstrap
    redeemCastBootstrap: postPlaybackCastRedeem
    reconnectCast: postPlaybackCastReconnect
    castTransferStatus: postPlaybackCastTransferStatus
    renegotiatePlayback: renegotiatePlaybackSession
    getPlaybackContinuationState: getPlaybackContinuationState
    touchPlaybackContinuation: patchPlaybackContinuationProgress
    rotatePlaybackContinuation: rotatePlaybackContinuation
    revokePlaybackContinuation: revokePlaybackContinuation
    updateDvrRecording: patchDvrRecordingsId
    updateDvrRule: patchDvrRulesId
    updateLiveTvChannel: patchLiveTvChannelsChannelId
    updateLiveTvSource: patchLiveTvSourcesSourceId
    uploadAdminLibraryChannelLogo: uploadLibraryChannelLogo
  schemaAudiences:
    viewer:
      - CastBootstrapResponse
      - CastReceiverSessionResponse
      - CastReceiverSessionState
      - CastRenewResponse
      - CastStopResponse
      - CastOperationResponse
      - CastTransferStatusResponse
      - CastAdvanceResponse
      - AudioNormalization
      - BinaryPayload
      - Chapter
      - CursorListResponse
      - CursorPageInfo
      - DVRConflict
      - DVRConsumerStatus
      - DVROperationalCapabilities
      - DVRRecording
      - DVRRecordingGroup
      - DVRRecordingRule
      - DVRStorageOperationalStatus
      - DeleteDvrRecordingsIdResponse
      - DeleteDvrRulesIdResponse
      - GetDvrRecordingGroupsResponse
      - GetDvrRecordingsIdStreamResponse
      - GetDvrRecordingsResponse
      - GetDvrRulesResponse
      - GetDvrScheduleResponse
      - GetLibraryChannelHLSResourceResponse
      - GetLibraryChannelLogoResponse
      - LibraryChannelGuide
      - LibraryChannelGuideEntry
      - LibraryChannelListResponse
      - LibraryChannelPlayoutSource
      - LibraryChannelSummary
      - LibraryChannelTuneResponse
      - LibraryChannelVideoOverlay
      - LibraryChannelsGuide
      - ListResponse
      - LiveHLSPlaybackPolicy
      - LiveTVActionID
      - LiveTVChannel
      - LiveTVChannelListResponse
      - LiveTVGuide
      - LiveTVGuideCapabilities
      - LiveTVProgram
      - LiveTVSourceSummary
      - LiveTVSourceSummaryListResponse
      - MediaGrant
      - MediaActionID
      - MediaAttachment
      - MediaHierarchyCounts
      - DisplayImageSet
      - MediaMetadataEvidence
      - MediaMetadataValue
      - MediaMetadataRelationship
      - MediaProviderID
      - MediaExtraRelationship
      - MediaFileVersion
      - MediaImage
      - MediaItem
      - MediaLyric
      - MediaPerson
      - MediaSegment
      - MediaState
      - ImageSet
      - OptimizedVersion
      - PlaybackDecision
      - PlaybackDeliveryPolicy
      - PlaybackContinuationCredential
      - PlaybackContinuationState
      - PlaybackProgressAcknowledgement
      - PlaybackSessionTerminalAcknowledgement
      - PlaybackRepeatMode
      - PlaybackResource
      - PlaybackResponse
      - PlaybackSourceContext
      - PlaybackTimeline
      - ResolvedPlaybackPolicy
      - RecommendationRow
      - Stream
      - SuccessResponse
      - TextPayload
    management:
      - AdminLibraryChannelListResponse
      - DVROperationalStatus
      - LibraryChannelAggregate
      - LibraryChannelApplicabilityResponse
      - LibraryChannelGeneration
      - LibraryChannelHealthResponse
      - LibraryChannelLogoAsset
      - LibraryChannelRestoreDefaultsResponse
      - LibraryChannelTemplatesResponse
      - LiveTVSource
      - LiveTVSourceListResponse
      - GetLiveTvStreamsResponse
      - PlaybackSession
      - PostLiveTvSourcesHdhomerunDiscoverResponse
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: portico_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Short-lived local native access credential returned by `/auth/sessions`, a Hosted-issued server-scoped credential, or a scoped API key created under `/auth/api-keys`. Account credentials are never accepted in URLs.
    mediaGrantAuth:
      type: apiKey
      in: cookie
      name: portico_media_grant
      description: "Opaque, hashed-at-rest, short-lived playback-session grant delivered as an HttpOnly cookie. Native adapters may use Authorization: PorticoMedia <grant>; credentials are never accepted in URLs."
    downloadGrantAuth:
      type: apiKey
      in: cookie
      name: portico_download_grant
      description: "Opaque, hashed-at-rest, 15-minute download grant. Browsers use an HttpOnly cookie and native adapters use Authorization: PorticoDownload <grant>; credentials are never accepted in URLs."
    castReceiverAuth:
      type: http
      scheme: PorticoReceiver
      description: Receiver-scoped credential returned only by Cast bootstrap redemption. Account/session credentials are never accepted on receiver mutation routes.
  schemas:
    Error:
      type: object
      required: [type, title, status, code, detail, messageId, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
        messageId:
          type: string
          description: Stable Product Language message identifier for first-party clients.
        details:
          type: object
          additionalProperties: true
    ListResponse:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items: {}
        total:
          type: integer
        sort:
          type: string
        filter:
          type: string
        limit:
          type: integer
        offset:
          type: integer
        hasMore:
          type: boolean
        nextCursor:
          type: string
    CursorListResponse:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: {}
        pageInfo:
          $ref: "#/components/schemas/CursorPageInfo"
    Permissions:
      type: object
      additionalProperties:
        type: boolean
    UserPreferences:
      type: object
      required: [locale, timeZone, dateFormat, hourCycle, audioLanguage, subtitleLanguage, sidebarOrder, musicPlayback, playbackProgress, privacy]
      properties:
        locale:
          type: string
          examples: ["en-US"]
        timeZone:
          type: string
          description: IANA time zone used by clients for display formatting.
          examples: ["America/Halifax"]
        dateFormat:
          type: string
          enum: [short, medium, long]
        hourCycle:
          type: string
          enum: [auto, h12, h23]
        audioLanguage:
          type: string
          examples: ["en"]
        subtitleLanguage:
          type: string
          examples: ["en"]
        sidebarOrder:
          type: array
          items:
            type: string
        musicPlayback:
          $ref: "#/components/schemas/MusicPlaybackPreferences"
        playbackProgress:
          $ref: "#/components/schemas/PlaybackProgressPreferences"
        privacy:
          $ref: "#/components/schemas/UserPrivacyPreferences"
    LibraryNavigationPreferences:
      type: object
      additionalProperties: false
      required: [pinnedLibraryIds]
      properties:
        pinnedLibraryIds:
          type: array
          description: Ordered stable library IDs shown in the current account's primary navigation. Omitted accessible libraries are unpinned.
          maxItems: 160
          items:
            type: string
    LibraryNavigationPreferencesRequest:
      type: object
      additionalProperties: false
      required: [pinnedLibraryIds]
      properties:
        pinnedLibraryIds:
          type: array
          description: Complete ordered set of accessible libraries to pin. Duplicate IDs are ignored and inaccessible IDs are rejected.
          maxItems: 160
          items:
            type: string
    MusicPlaybackPreferences:
      type: object
      required: [shuffleDefault, repeatDefault, autoplayDefault, normalizationMode, crossfadeSeconds, gapless]
      properties:
        shuffleDefault:
          type: boolean
        repeatDefault:
          type: string
          enum: [none, one, all]
        autoplayDefault:
          type: boolean
        normalizationMode:
          type: string
          enum: [off, attenuate]
        crossfadeSeconds:
          type: integer
          minimum: 0
          maximum: 12
        gapless:
          type: boolean
    PlaybackProgressPreferences:
      type: object
      required: [startedThresholdPercent, playedThresholdPercent]
      properties:
        startedThresholdPercent:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        playedThresholdPercent:
          type: integer
          minimum: 51
          maximum: 100
          default: 95
    UserPrivacyPreferences:
      type: object
      required: [pauseWatchHistory, showActivityToMembers, includeInWatchWithFriends]
      properties:
        pauseWatchHistory:
          type: boolean
          default: false
          description: When true, playback-generated plays and resume points are not recorded for this account on this server.
        showActivityToMembers:
          type: boolean
          default: true
          description: When false, this account is excluded from member-facing activity surfaces and shared-session member presence.
        includeInWatchWithFriends:
          type: boolean
          default: true
          description: When false, this account is not included in ambient Watch With Friends discovery or joining.
    UserAccessSchedule:
      type: object
      properties:
        enabled:
          type: boolean
          description: True when this account can only sign in or keep sessions during the configured UTC window.
        days:
          type: array
          description: Allowed UTC days, where 0 is Sunday and 6 is Saturday. Empty means every day.
          items:
            type: integer
            minimum: 0
            maximum: 6
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Start minute of the allowed UTC day.
        endMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: End minute of the allowed UTC day. Matching start/end means all day.
    UserTagPolicy:
      type: object
      properties:
        allowedTags:
          type: array
          description: Exact media tag names this user is allowed to see. Empty means all tags are allowed unless blocked.
          items:
            type: string
        blockedTags:
          type: array
          description: Exact media tag names hidden from this user.
          items:
            type: string
        allowedLabels:
          type: array
          description: Exact media labels this user is allowed to see. Empty means all labels are allowed unless blocked.
          items:
            type: string
        blockedLabels:
          type: array
          description: Exact media labels hidden from this user.
          items:
            type: string
    UserDevicePolicy:
      type: object
      properties:
        mode:
          type: string
          enum: [any, trusted, allowlist]
          description: Per-user device restriction mode. `trusted` requires a trusted device; `allowlist` requires a selected device ID.
        allowedDeviceIds:
          type: array
          description: Device IDs allowed when mode is `allowlist`.
          items:
            type: string
    UserChannelPolicy:
      type: object
      properties:
        allowedChannelIds:
          type: array
          description: Live TV channel IDs this user can access. Empty means all channels are allowed unless blocked.
          items:
            type: string
        blockedChannelIds:
          type: array
          description: Live TV channel IDs hidden from this user.
          items:
            type: string
    DisplayPreference:
      type: object
      required: [client, view, preferences, updatedAt]
      properties:
        client:
          type: string
          description: Client family, such as web, ios, android, roku, or tv.
        view:
          type: string
          description: Stable view key within the client, such as library:lib_movies.
        preferences:
          type: object
          additionalProperties: true
        updatedAt:
          type: string
          format: date-time
    DisplayPreferenceRequest:
      type: object
      required: [preferences]
      properties:
        preferences:
          type: object
          additionalProperties: true
    AccountProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName, email, currentPassword]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 80
          description: Current user's local profile display name.
        email:
          type: string
          format: email
          maxLength: 254
          description: Current user's local profile email address.
        currentPassword:
          type: string
          format: password
          minLength: 1
          maxLength: 72
          description: Current This Server password used to reauthenticate this identity mutation.
    AccountPasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          description: Current This Server password used to authorize the change.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Replacement password requiring an uppercase letter, a lowercase letter, and either a number or special character. The server additionally enforces a maximum of 72 UTF-8 bytes.
    User:
      type: object
      required: [id, username, email, displayName, role, authOrigin, hasLocalPassword, permissions, libraryIds, preferences]
      properties:
        id:
          type: string
        profileId:
          type: string
          description: Stable server-local profile ID.
        profileIdentityId:
          type: string
          description: Identity binding used for the current session or default sign-in context.
        authProvider:
          type: string
          enum: [local, portico, api_key]
          description: Identity provider used for the current session or default sign-in context.
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        profileImageUrl:
          type: string
        role:
          type: string
          enum: [owner, user]
        authOrigin:
          type: string
          enum: [local, portico]
          description: Source of identity for this server-local profile.
        porticoUserId:
          type: string
          description: Portico account user ID when this local profile is linked to Portico identity.
        porticoMembershipId:
          type: string
          description: Portico server membership ID when this local profile is linked to Portico identity.
        hasLocalPassword:
          type: boolean
          description: True when the server-local profile has a usable This Server password for local-only or recovery sign-in.
        permissions:
          $ref: "#/components/schemas/Permissions"
        libraryIds:
          type: array
          items:
            type: string
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        accessSchedule:
          $ref: "#/components/schemas/UserAccessSchedule"
        tagPolicy:
          $ref: "#/components/schemas/UserTagPolicy"
        devicePolicy:
          $ref: "#/components/schemas/UserDevicePolicy"
        channelPolicy:
          $ref: "#/components/schemas/UserChannelPolicy"
        maxContentRating:
          type: string
          enum: ["", G, PG, PG-13, R, NC-17, TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA, C, C8, 14A, 18A, A, U, 12, 12A, 15, 18]
        maxActiveSessions:
          type: integer
          minimum: 0
          description: Maximum concurrent active sessions for this user. Zero means unlimited.
        remoteBitrateLimitMbps:
          type: integer
          minimum: 0
          description: Maximum remote playback bitrate in Mbps for this user. Zero means unlimited.
        signInMethods:
          type: array
          items:
            $ref: "#/components/schemas/SignInMethod"
    SignInMethod:
      type: object
      required: [provider, label]
      properties:
        provider:
          type: string
          enum: [local, portico]
        label:
          type: string
    QuickConnectStart:
      type: object
      properties:
        installationId:
          type: string
          minLength: 16
          maxLength: 128
          pattern: '^[A-Za-z0-9._:-]+$'
          description: Optional, non-secret app-installation metadata used for continuity and diagnostics. It is never authentication proof.
        deviceName:
          type: string
        app:
          type: string
        platform:
          type: string
    QuickConnectStartResponse:
      type: object
      required: [code, protocolVersion, secret, expiresAt]
      properties:
        code:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$'
          description: Protocol-v1 XXXX-XXXX code.
        protocolVersion:
          type: integer
          enum: [1]
        secret:
          type: string
        expiresAt:
          type: string
          format: date-time
        approvalUrl:
          type: string
          format: uri
          description: Authenticated approval surface. The human code is deliberately excluded from the URL.
        deepLinkUrl:
          type: string
          description: Optional app deep link containing server context only. The human code is deliberately excluded from the URL.
    QuickConnectStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, denied, expired, consumed]
        device:
          type: string
        app:
          type: string
        platform:
          type: string
        expiresAt:
          type: string
          format: date-time
    QuickConnectRequest:
      type: object
      required: [id, code, protocolVersion, device, app, platform, expiresAt, createdAt]
      properties:
        id:
          type: string
        code:
          type: string
          minLength: 9
          maxLength: 9
          pattern: '^[A-HJKMNP-Z2-9]{4}-[A-HJKMNP-Z2-9]{4}$'
          description: Protocol-v1 XXXX-XXXX code.
        protocolVersion:
          type: integer
          enum: [1]
        device:
          type: string
        app:
          type: string
        platform:
          type: string
        clientIp:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      additionalProperties: false
      required: [username, email, displayName, password, permissions, libraryIds]
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: New password requiring an uppercase letter, a lowercase letter, and either a number or special character; at most 72 UTF-8 bytes.
        permissions:
          $ref: "#/components/schemas/Permissions"
        libraryIds:
          type: array
          items:
            type: string
        accessSchedule:
          $ref: "#/components/schemas/UserAccessSchedule"
        tagPolicy:
          $ref: "#/components/schemas/UserTagPolicy"
        devicePolicy:
          $ref: "#/components/schemas/UserDevicePolicy"
        channelPolicy:
          $ref: "#/components/schemas/UserChannelPolicy"
        maxContentRating:
          type: string
          enum: ["", G, PG, PG-13, R, NC-17, TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA, C, C8, 14A, 18A, A, U, 12, 12A, 15, 18]
        maxActiveSessions:
          type: integer
          minimum: 0
        maxActiveStreams:
          type: integer
          minimum: 0
        remoteBitrateLimitMbps:
          type: integer
          minimum: 0
    UserPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Partial update for an ordinary server user. Omitted fields are preserved and explicit null values are rejected.
      properties:
        username: { type: string }
        email: { type: string, format: email }
        displayName: { type: string }
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: Replacement password requiring an uppercase letter, a lowercase letter, and either a number or special character; at most 72 UTF-8 bytes.
        permissions: { $ref: "#/components/schemas/Permissions" }
        libraryIds:
          type: array
          items:
            type: string
        accessSchedule: { $ref: "#/components/schemas/UserAccessSchedule" }
        tagPolicy: { $ref: "#/components/schemas/UserTagPolicy" }
        devicePolicy: { $ref: "#/components/schemas/UserDevicePolicy" }
        channelPolicy: { $ref: "#/components/schemas/UserChannelPolicy" }
        maxContentRating:
          type: string
          enum: ["", G, PG, PG-13, R, NC-17, TV-Y, TV-Y7, TV-G, TV-PG, TV-14, TV-MA, C, C8, 14A, 18A, A, U, 12, 12A, 15, 18]
        maxActiveSessions: { type: integer, minimum: 0 }
        maxActiveStreams: { type: integer, minimum: 0 }
        remoteBitrateLimitMbps: { type: integer, minimum: 0 }
    AuthMe:
      type: object
      required: [authenticated, setupRequired]
      properties:
        authenticated:
          type: boolean
        setupRequired:
          type: boolean
        user:
          $ref: "#/components/schemas/User"
        serverId:
          type: string
          description: Stable local server identity for browser account/session storage.
        serverFriendlyName:
          type: string
        accountMode:
          type: string
          enum: [this_server, portico]
        authProvider:
          type: string
          enum: [local, portico]
        authority:
          type: string
          enum: [local, hosted]
          description: Canonical viewer-scope authority. Portico Account sessions are hosted; Local Auth sessions are local.
        accountId:
          type: string
          description: Stable account identity for the active viewing scope.
        profileId:
          type: string
        profileIdentityId:
          type: string
        authorizationRevision:
          type: string
          description: Changes whenever membership, profile policy, PIN trust, or revocation state changes.
        signInMethods:
          type: array
          items:
            $ref: "#/components/schemas/SignInMethod"
    BrowserAccountSummary:
      type: object
      additionalProperties: false
      required: [id, displayName, authOrigin, authProvider, lastUsedAt]
      properties:
        id:
          type: string
          description: Stable server-local account ID.
        displayName:
          type: string
        profileImageUrl:
          type: string
          description: Vault-authorized same-server image route. It is not a reusable credential.
        authOrigin:
          type: string
          enum: [local, portico]
        authProvider:
          type: string
          enum: [local, portico]
          description: Identity provider used when this remembered grant is switched.
        lastUsedAt:
          type: string
          format: date-time
    BrowserAccountsResponse:
      type: object
      additionalProperties: false
      required: [accounts, automaticSignIn, selectionRequired, canAddAccount]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BrowserAccountSummary"
        activeAccountId:
          type: string
          description: Present only when the ordinary session belongs to this browser vault.
        automaticSignIn:
          type: boolean
        selectionRequired:
          type: boolean
        canAddAccount:
          type: boolean
    BrowserAccountSwitchRequest:
      type: object
      additionalProperties: false
      required: [accountId, deviceName, app, platform]
      properties:
        accountId:
          type: string
        installationId:
          type: string
          minLength: 16
          maxLength: 128
          description: Optional, non-secret app-installation metadata used for continuity and diagnostics. It is never authentication proof.
        deviceName:
          type: string
          minLength: 1
          maxLength: 120
        app:
          type: string
          minLength: 1
          maxLength: 120
        platform:
          type: string
          minLength: 1
          maxLength: 120
    BrowserAccountPreferencesRequest:
      type: object
      additionalProperties: false
      required: [automaticSignIn]
      properties:
        automaticSignIn:
          type: boolean
    BrowserAccountPreferencesResponse:
