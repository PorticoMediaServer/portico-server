        maxHeight: { type: integer, minimum: 0 }
        maxFrameRate: { type: number, minimum: 0 }
    PlaybackCapabilityAudio:
      type: object
      additionalProperties: false
      required: [codec, maxChannels]
      properties:
        codec: { type: string, minLength: 1 }
        profile: { type: string }
        layout: { type: string }
        route: { type: string }
        maxChannels: { type: integer, minimum: 1, maximum: 32 }
        objectPassthrough: { type: boolean }
    PlaybackCapabilitySubtitle:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        codec: { type: string }
        kind: { type: string, enum: [text, bitmap] }
        mode: { type: string, enum: [none, native, convert, burn] }
    PlaybackCapabilityTuple:
      type: object
      additionalProperties: false
      # Audiovisual tuples may omit audio to assert exact silent-video
      # compatibility. Audio remains required by the mediaKind=audio semantic
      # validation performed at the application boundary.
      required: [mediaKind, protocol, container, subtitle]
      properties:
        mediaKind: { type: string, enum: [audio, audiovisual] }
        protocol: { type: string, enum: [http, hls] }
        container: { type: string, minLength: 1 }
        video: { $ref: "#/components/schemas/PlaybackCapabilityVideo" }
        audio: { $ref: "#/components/schemas/PlaybackCapabilityAudio" }
        subtitle: { $ref: "#/components/schemas/PlaybackCapabilitySubtitle" }
      allOf:
        - if:
            properties: { mediaKind: { const: audiovisual } }
            required: [mediaKind]
          then:
            required: [video]
        - if:
            properties: { mediaKind: { const: audio } }
            required: [mediaKind]
          then:
            required: [audio]
            not: { required: [video] }
    PlaybackCapabilityEvidence:
      type: object
      additionalProperties: false
      required: [id, source, confidence, producer, reviewedAt, tuples]
      properties:
        id: { type: string, minLength: 1, maxLength: 256 }
        source:
          type: string
          enum: [native_runtime, authenticated_runtime, unauthenticated_probe]
          description: Native or authenticated runtime provenance is accepted only when the server binds this request to an eligible verified session and device; otherwise request claims cannot authorize delivery.
        confidence: { type: string, enum: [low, medium, high] }
        producer:
          type: string
          minLength: 1
          maxLength: 256
          description: Reporter label only. The server replaces it with verified producer identity for authoritative evidence.
        producerVersion:
          type: string
          description: Reporter version. Authoritative evidence uses the server-bound capability schema and client version.
        reviewedAt:
          type: string
          format: date-time
          description: Probe observation time. Runtime evidence expires under source-specific server freshness limits.
        minVersion: { type: string }
        maxVersion: { type: string }
        tuples:
          type: array
          minItems: 1
          maxItems: 256
          items: { $ref: "#/components/schemas/PlaybackCapabilityTuple" }
    PlaybackClientProfile:
      type: object
      additionalProperties: false
      properties:
        capabilitySchemaVersion:
          type: string
          enum: [playback-capability-v2]
        clientFamily:
          type: string
          enum: [chromium, edge, safari, firefox, avkit, media3, fire-tv, roku, cast, tizen, webos, dlna]
        clientVersion: { type: string }
        capabilityEvidence:
          type: array
          maxItems: 8
          items: { $ref: "#/components/schemas/PlaybackCapabilityEvidence" }
        device:
          type: string
        platform:
          type: string
        supportsHls:
          type: boolean
        supportsMse:
          type: boolean
        supportsMpegTs:
          type: boolean
        supportedContainers:
          type: array
          items:
            type: string
        supportedVideoCodecs:
          type: array
          items:
            type: string
        supportedAudioCodecs:
          type: array
          items:
            type: string
        maxWidth:
          type: integer
        maxHeight:
          type: integer
        maxAudioChannels:
          type: integer
        maxAudioBitrateKbps:
          type: integer
          minimum: 0
        maxBitrate:
          type: integer
        maxVideoBitDepth:
          type: integer
        supportsHevc:
          type: boolean
        supportsHdr:
          type: boolean
        supportsEac3:
          type: boolean
        supportsAc3:
          type: boolean
        supportedVideoProfiles:
          type: array
          items:
            type: string
        supportedPixelFormats:
          type: array
          items:
            type: string
        supportedHdrFormats:
          type: array
          items:
            type: string
        supportedDolbyVisionProfiles:
          type: array
          items:
            type: string
        prefersServerProxy:
          type: boolean
        requiresServerProxy:
          type: boolean
    PlaybackQualitySelection:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, const: automatic }
        - type: object
          additionalProperties: false
          required: [mode, selectionId, qualityOfferRevision]
          properties:
            mode: { type: string, const: explicit }
            selectionId: { type: string, minLength: 1 }
            qualityOfferRevision: { type: string, minLength: 1 }
    PlaybackQualityOffer:
      type: object
      additionalProperties: false
      required: [selectionId, label, kind]
      properties:
        selectionId: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        kind: { type: string, enum: [automatic, original, fixed] }
        maxVideoBitrateBps: { type: integer, format: int64, minimum: 1 }
        maxAudioBitrateBps: { type: integer, format: int64, minimum: 1 }
        targetDisplayHeight: { type: integer, enum: [144, 240, 360, 480, 720, 1080, 1440, 2160, 4320] }
      allOf:
        - if:
            required: [kind]
            properties: { kind: { enum: [automatic, original] } }
          then:
            not:
              anyOf:
                - required: [maxVideoBitrateBps]
                - required: [maxAudioBitrateBps]
                - required: [targetDisplayHeight]
        - if:
            required: [kind]
            properties: { kind: { const: fixed } }
          then:
            anyOf:
              - required: [maxVideoBitrateBps]
              - required: [maxAudioBitrateBps]
              - required: [targetDisplayHeight]
    PlaybackQualityOfferSet:
      type: object
      additionalProperties: false
      required: [contractId, schemaVersion, mediaId, versionId, sourceRevision, offerRevision, offers]
      properties:
        contractId: { type: string, const: PC-PLAYBACK }
        schemaVersion: { type: string, const: quality-offers.v1 }
        mediaId: { type: string, minLength: 1 }
        versionId: { type: string, minLength: 1 }
        sourceRevision: { type: string, minLength: 1 }
        offerRevision: { type: string, minLength: 1 }
        offers:
          type: array
          minItems: 2
          uniqueItems: true
          contains:
            type: object
            required: [kind]
            properties: { kind: { const: automatic } }
          minContains: 1
          maxContains: 1
          items: { $ref: "#/components/schemas/PlaybackQualityOffer" }
    PlaybackIntent:
      type: object
      additionalProperties: false
      description: Portable viewing intent resolved by the server against media facts, capabilities, membership limits, and server clamps.
      required: [quality]
      properties:
        transportClass:
          type: string
          description: Non-authoritative client transport context, independent of route address and server locality.
          enum: [wifi, cellular, wired, unknown]
