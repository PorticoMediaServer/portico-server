      x-portico-audience: viewer
      type: object
      additionalProperties: false
      description: Exact catalog totals for the hierarchy rooted at this entity. Omitted fields do not apply to the entity kind; present zeroes are authoritative.
      properties:
        seasonCount: { type: integer, minimum: 0 }
        episodeCount: { type: integer, minimum: 0 }
        releaseCount: { type: integer, minimum: 0 }
        trackCount: { type: integer, minimum: 0 }
        bookCount: { type: integer, minimum: 0 }
        chapterCount: { type: integer, minimum: 0 }
        itemCount: { type: integer, minimum: 0 }
    MediaCard:
      type: object
      additionalProperties: false
      required: [id, libraryId, entityKind, title, artwork, userState, availability, actions]
      properties:
        id: { type: string }
        libraryId: { type: string }
        libraryName: { type: string }
        counts: { $ref: "#/components/schemas/MediaHierarchyCounts" }
        entityKind: { type: string }
        title: { type: string }
        subtitle: { type: string }
        summary: { type: string }
        year: { type: integer }
        durationSeconds: { type: integer, minimum: 0 }
