  /search:
    post:
      summary: Search accessible media using grouped previews or an independent group cursor
      description: Results default to relevance desc. Title, releaseYear, and dateAdded support asc or desc for media results. Live TV is relevance-desc only; a non-relevance request whose scope includes Live TV is rejected rather than silently reordered or omitted. Continuation cursors are encrypted and bound to the normalized query, group, library scope, sort, direction, and principal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SearchRequest" }
      responses:
        "200":
          description: Permission-filtered grouped search results
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400":
          description: Unsupported sort, direction, Live TV combination, or invalid continuation cursor
