        apiVersion:
          type: string
          enum: [v1]
        library: { $ref: "#/components/schemas/LibraryBrowseScope" }
        pivots:
          type: array
          items: { $ref: "#/components/schemas/BrowsePivotCapability" }
        resolvedPivot: { $ref: "#/components/schemas/BrowsePivotCapability" }
        fields:
          type: array
          items: { $ref: "#/components/schemas/BrowseFieldCapability" }
        sorts:
          type: array
          items: { $ref: "#/components/schemas/BrowseSortCapability" }
        presentationFields:
          type: array
          items: { type: string }
        actions:
          type: array
          items: { type: string }
        queryLimits: { $ref: "#/components/schemas/BrowseQueryLimits" }
