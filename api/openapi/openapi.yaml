        title: { type: string }
        entityKind: { type: string, enum: [movie, show, episode, person, track, book, live-channel] }
        status:
          type: string
          enum: [success, error]
          description: Per-group outcome. A failed group never discards successful sibling groups.
        errorCode:
          type: string
          enum: [search_group_unavailable, search_group_timeout]
          description: Stable machine-readable failure code present when status is error.
        messageId:
          type: string
          enum: [search.group-unavailable, search.group-timeout]
