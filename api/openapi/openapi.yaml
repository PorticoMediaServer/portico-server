        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stored artwork information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaImage"
    delete:
      summary: Delete uploaded manual artwork
      description: Deletes only artwork uploaded through the manual image endpoint. Scanned local images and provider images are left intact.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artwork deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /media/{id}/images/order:
    post:
      summary: Reorder stored artwork records
      description: Updates sort order for stored image records. Preferred artwork selection is not changed by this endpoint.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [imageIds]
              properties:
                imageIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated media item with reordered artwork
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/images/{imageId}/preferred:
    post:
      summary: Mark artwork as preferred
      description: Marks a stored media image as preferred for its artwork type and clears the preferred flag from sibling images of the same type.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: imageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated media item with preferred artwork
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /artwork/{id}/{kind}:
    get:
      summary: Stream media artwork
      description: Streams the preferred local/provider/generated artwork for a media item. Optional JPEG resize requests are normalized to a bounded set of square, poster, and widescreen variants so clients cannot create unbounded cache cardinality.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Artwork kind filename, such as poster.svg, backdrop.svg, thumb.svg, or poster.jpg.
        - name: width
          in: query
          schema:
            type: integer
            minimum: 32
            maximum: 2000
        - name: height
          in: query
          schema:
            type: integer
            minimum: 32
            maximum: 2000
      responses:
        "200":
          description: Artwork image
          content:
            image/*:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
  /playback/cast/bootstrap:
    post:
      operationId: postPlaybackCastBootstrap
      x-portico-client-core-method: createCastBootstrap
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-auth: session
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.postPlaybackCastBootstrap
      summary: Create a one-use receiver-bound Google Cast bootstrap
      description: Creates a short-lived encrypted envelope bound to the receiver's ephemeral public key. The envelope contains no bearer credential until the receiver decrypts it locally and redeems the secret directly with this server.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastBootstrapRequest" }
      responses:
        "201":
          description: Receiver-bound bootstrap envelope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastBootstrapResponse" }
  /playback/cast/redeem:
    post:
      operationId: postPlaybackCastRedeem
      x-portico-client-core-method: redeemCastBootstrap
      security: []
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-auth: public
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.postPlaybackCastRedeem
      summary: Redeem a receiver-bound Google Cast bootstrap
      description: Redeems the decrypted one-use secret from the configured receiver origin and returns a separate receiver-scoped API credential plus playback media authorization.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastRedeemRequest" }
      responses:
        "200":
          description: Receiver session and playback authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastReceiverSessionResponse" }
  /playback/cast/reconnect:
    post:
      operationId: postPlaybackCastReconnect
      x-portico-client-core-method: reconnectCast
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-auth: session
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.postPlaybackCastReconnect
      summary: Reconnect to an existing Cast receiver session
      description: Restores control of the existing receiver session for the client instance and generation; it never creates a second playback session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastReconnectRequest" }
      responses:
        "200":
          description: Existing receiver session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastReceiverSessionState" }
  /playback/cast/transfer-status:
    post:
      operationId: postPlaybackCastTransferStatus
      x-portico-client-core-method: castTransferStatus
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-auth: session
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.postPlaybackCastTransferStatus
      summary: Reconcile one exact Cast bootstrap or authority transfer
      description: Returns only durable no-credential outcome evidence for the exact account/profile/client request identity.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CastTransferStatusRequest" }
      responses:
        "200":
          description: Exact pending or final Cast transfer outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastTransferStatusResponse" }
  /playback/cast/sessions/{sessionId}/{operation}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
      - name: operation
        in: path
        required: true
        schema:
          type: string
          enum: [state, control, progress, renew, stop, advance, advance-cancel, segment-skip]
    get:
      operationId: getPlaybackCastSessionState
      security:
        - castReceiverAuth: []
      x-portico-runtime-path: /api/playback/cast/sessions/{sessionId}/state
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-auth: public
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.getPlaybackCastSessionState
      summary: Read Cast receiver session state
      responses:
        "200":
          description: Cast receiver session state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastReceiverSessionState" }
    post:
      operationId: postPlaybackCastSessionOperation
      security:
        - castReceiverAuth: []
      x-portico-runtime-path: /api/playback/cast/sessions/{sessionId}/{operation}
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-auth: public
      x-portico-permission: play-media
      x-portico-rate-policy: playback-control
      x-portico-audit-event: api.postPlaybackCastSessionOperation
      summary: Control, report progress, renew, or stop Cast playback
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - { $ref: "#/components/schemas/CastControlRequest" }
                - { $ref: "#/components/schemas/CastProgressRequest" }
                - { $ref: "#/components/schemas/CastRenewRequest" }
                - { $ref: "#/components/schemas/CastStopRequest" }
                - { $ref: "#/components/schemas/CastAdvanceRequest" }
                - { $ref: "#/components/schemas/CastAdvanceCancelRequest" }
                - { $ref: "#/components/schemas/CastSegmentSkipRequest" }
      responses:
        "200":
          description: Cast operation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CastOperationResponse" }
  /playback/bitrate-test:
    get:
      summary: Download a bounded binary payload for client bitrate testing
      description: Authenticated utility endpoint for estimating browser-to-server throughput. The response is no-store and capped server-side.
      parameters:
        - name: bytes
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 67108864
            default: 8388608
      responses:
        "200":
          description: Binary bitrate-test payload
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /instant-mix/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Build an instant music mix from an artist, album, track, playlist, or genre seed
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Permission-filtered instant mix tracks
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
  /playback/history:
    get:
      summary: List playback history
      description: Returns recorded playback sessions for the server owner, with filters used by the Status Activity tab.
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: libraryId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
          description: Literal text search across session titles, users, devices, and player apps.
        - name: period
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
        - name: cursor
          in: query
          schema:
            type: string
        - name: count
          in: query
          schema:
            type: string
            enum: [none, exact]
      responses:
        "200":
          description: Playback history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/PlaybackSession"
  /playback/history/export.csv:
    get:
      summary: Export playback history CSV
      description: Downloads a bounded CSV export of playback sessions matching the same Status Activity filters as /playback/history.
      parameters:
        - name: userId
          in: query
          schema:
            type: string
        - name: libraryId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: query
          in: query
          schema:
            type: string
          description: Literal text search across session titles, users, devices, and player apps.
        - name: period
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d, 90d, all]
      responses:
        "200":
          description: Playback history CSV attachment
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Portico-Export-Limit:
              schema:
                type: string
            X-Portico-Export-Truncated:
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
                format: binary
  /playback-sessions:
    post:
      summary: Create a library media playback session
      description: Creates the canonical playback session and returns the server-owned playback decision. Clients send ordered progress events to PATCH /playback-sessions/{sessionId} and close it with DELETE /playback-sessions/{sessionId}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionCreateRequest"
      responses:
        "200":
          description: Playback source decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackResponse"
  /playback/active:
    post:
      summary: Restore the current active playback session
      description: Returns the current user's most recent still-active playback session as a fresh playback response so first-party web clients can restore the player after reload without creating a duplicate session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clientInstanceId:
                  type: string
                clientProfile:
                  $ref: "#/components/schemas/PlaybackClientProfile"
      responses:
        "200":
          description: Active playback restore state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackRestoreResponse"
  /playback-sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    patch:
      summary: Apply an ordered playback progress event
      description: Applies only a sequence newer than the highest accepted event. Duplicate and stale events are acknowledged without changing progress; a newer event may intentionally move position backward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackProgressEvent"
      responses:
        "200":
          description: Playback progress acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackProgressAcknowledgement"
    delete:
      summary: End a playback session
      description: Atomically records the final playback position and terminal disposition, then ends the session and revokes its playback authority. The caller persists and reuses the exact request after an ambiguous response; an exact retry returns the committed receipt. Authentication and not-found failures are never treated as inferred success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionStopRequest"
      responses:
        "200":
          description: Durable terminal receipt for the ended playback session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionTerminalAcknowledgement"
  /playback-sessions/{sessionId}/continuation:
    security: []
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getPlaybackContinuationState
      security: []
      x-portico-auth: public
      summary: Read native playback continuation state
      description: Reads current playback state with a short-lived PorticoPlayback continuation credential. The credential is accepted only in the Authorization header and is never a URL credential.
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-client-core-method: getPlaybackContinuationState
      responses:
        "200":
          description: Current continuation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackContinuationState" }
    patch:
      operationId: patchPlaybackContinuationProgress
      security: []
      x-portico-auth: public
      summary: Acknowledge native playback progress through continuation
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-client-core-method: touchPlaybackContinuation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackProgressEvent" }
      responses:
        "200":
          description: Durable progress acknowledgement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackProgressAcknowledgement" }
    post:
      operationId: rotatePlaybackContinuation
      security: []
      x-portico-auth: public
      summary: Rotate a native playback continuation credential
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-client-core-method: rotatePlaybackContinuation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackContinuationRotateRequest" }
      responses:
        "200":
          description: Replacement continuation credential
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackContinuationCredential" }
    delete:
      operationId: revokePlaybackContinuation
      security: []
      x-portico-auth: public
      summary: Atomically stop native playback and revoke its continuation authority
      description: Commits the requestId-bound terminal event and revokes continuation authority in one operation. An exact retry returns the durable receipt even after the credential was revoked by the first commit; a different request, an invalid credential, or an unknown session fails closed.
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-client-core-method: revokePlaybackContinuation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackSessionStopRequest" }
      responses:
        "200":
          description: Durable terminal receipt for the revoked continuation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackSessionTerminalAcknowledgement" }
  /playback-sessions/{sessionId}/media-grant:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Rotate a playback session media grant
      description: Revokes the current opaque grant and returns a new short-lived grant bound to the authenticated principal, playback session, and session media. Ordinary heartbeats extend an active grant without placing account credentials in resource URLs.
      responses:
        "200":
          description: Replacement media grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaGrant"
        "404":
          description: Playback session was not found for this principal
  /playback-sessions/{sessionId}/renegotiate:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: renegotiatePlaybackSession
      summary: Idempotently renegotiate an active playback source
      description: Applies a revision-checked quality, version, audio, or subtitle selection to the existing playback session and returns a fresh validated resource/grant without replacing queue, progress, generation, or source ownership.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-client-core-method: renegotiatePlayback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackRenegotiationRequest" }
      responses:
        "200":
          description: Updated playback response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackResponse" }
        "409":
          description: Expected selection revision is stale
  /playback-sessions/{sessionId}/command:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Poll the latest remote playback command for a session
      responses:
        "200":
          description: Latest playback command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackCommand"
    post:
      summary: Issue a remote playback command to a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackCommandRequest"
      responses:
        "200":
          description: Playback command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackCommand"
  /playback-sessions/{sessionId}/command/events:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Stream authorized playback commands
      description: Emits session-scoped playback commands as server-sent events. The stream closes when the session ends or authorization changes.
      responses:
        "200":
          description: Playback command event stream
          content:
            text/event-stream:
              schema:
                type: string
  /playback-sessions/{sessionId}/command/events/poll:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: pollPlaybackSessionCommands
      summary: Long-poll authorized playback commands
      description: Returns commands for the exact authorized playback session. A successful timeout returns 200 with an empty events array; authorization and session ownership are rechecked while waiting.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-rate-policy: long-poll
      x-portico-audit-event: none
      parameters:
        - { name: cursor, in: query, description: Opaque cursor previously returned for this playback session., schema: { type: string } }
        - { name: waitSeconds, in: query, description: Maximum time to wait for an event. Zero performs an immediate cursor check., schema: { type: integer, minimum: 0, maximum: 25, default: 20 } }
      responses:
        "200":
          description: Playback commands, or an empty successful timeout envelope
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackCommandLongPollEnvelope" }
        "429":
          description: Long-poll concurrency or request-rate limit reached
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /playback-sessions/{sessionId}/queue:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Read the server-owned playback session queue
      description: Returns the current item, upcoming queue, history, repeat mode, and optimistic-concurrency revision for a playback session. This queue model is independent from Watch With Friends and is intended for web, mobile, and TV players.
      responses:
        "200":
          description: Playback session queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionQueueResponse"
    put:
      summary: Replace the server-owned playback session queue
      description: Atomically replaces the upcoming queue and repeat mode when expectedRevision matches the current state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionQueueReplaceRequest"
      responses:
        "200":
          description: Updated playback session queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionQueueResponse"
        "409":
          description: expectedRevision no longer matches the authoritative playback queue state
    patch:
      summary: Mutate the server-owned playback session queue
      description: Applies one append, play_next, remove, reorder, shuffle, clear, or set_repeat command when expectedRevision matches the authoritative state. Shuffle atomically materializes one occurrence order from the idempotency key without moving the current item.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackSessionQueueRequest"
      responses:
        "200":
          description: Updated playback session queue state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackSessionQueueResponse"
        "409":
          description: expectedRevision no longer matches the authoritative playback queue state
  /playback-sessions/{sessionId}/prepare-next:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Prepare the next playback item without stopping the current session
      description: Returns a short-lived prepared playback descriptor so clients can preload the next audio item for gapless or crossfade handoff. Preparation never records or closes the source session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackPrepareNextRequest"
      responses:
        "200":
          description: Prepared playback descriptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackPreparedResponse"
  /playback-sessions/{sessionId}/handoff:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Commit a playback handoff
      description: Atomically accepts the source actor's ordered previousTerminal event, closes the source session, and starts the prepared or directly selected replacement under the same client instance. Until a response is accepted, the source actor retains terminal authority. Stale generation or sequence evidence fails closed without activating the replacement; an exact retry returns the committed result.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackHandoffRequest"
      responses:
        "200":
          description: Active playback response for the new item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackResponse"
  /playback/receivers:
    get:
      operationId: getPlaybackReceivers
      summary: List active key-bound Portico playback receivers
      description: Returns only current receivers owned by the exact ViewerScope. Discovery remains a presence hint; a controller must obtain a Server-issued authorization before sending a LAN command.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-rate-policy: interactive-read
      x-portico-audit-event: none
      responses:
        "200":
          description: Active receivers
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaybackReceiver"
                  total:
                    type: integer
    post:
      operationId: registerPlaybackReceiver
      summary: Register or refresh a key-bound Portico playback receiver
      description: Binds the receiver ID, exact ViewerScope, selected Server identity, X25519 public key, and capabilities. Rotating the receiver key revokes every prior controller authorization.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: playback.receiver.registered
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaybackReceiverRequest"
      responses:
        "201":
          description: Registered receiver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackReceiver"
  /playback/targets:
    get:
      summary: List active playback handoff targets
      responses:
        "200":
          description: Active playback targets
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlaybackTarget"
                  total:
                    type: integer
  /playback/receivers/{receiverId}:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema:
          type: string
    patch:
      operationId: heartbeatPlaybackReceiver
      summary: Heartbeat a key-bound Portico playback receiver
      description: Refreshes receiver presence only when the supplied key fingerprint matches and returns the complete current authorization set. Replacing that set is the receiver's revocation boundary.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackReceiverHeartbeatRequest" }
      responses:
        "200":
          description: Receiver heartbeat and current key-bound authorizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaybackReceiverHeartbeatResponse"
  /playback/receivers/{receiverId}/authorizations:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getPlaybackReceiverAuthorizations
      summary: List current authorizations for an exact receiver key
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-rate-policy: interactive-read
      x-portico-audit-event: none
      parameters:
        - name: receiverPublicKeyFingerprint
          in: query
          required: true
          schema: { type: string, minLength: 43, maxLength: 43 }
      responses:
        "200":
          description: Current receiver authorization records
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ReceiverAuthorizationRecord" }
                  total: { type: integer }
    post:
      operationId: authorizePlaybackReceiver
      summary: Authorize one controller for a key-bound playback receiver
      description: Atomically issues a controller grant and stores the paired receiver authorization under one request identity. Exact retries return the same grant; conflicting retries fail closed.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: playback.receiver.authorized
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiverAuthorizationRequest" }
      responses:
        "201":
          description: Key-bound controller grant
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiverControllerGrant" }
        "409": { description: Request identity was already used with different authorization material }
  /playback/receivers/{receiverId}/authorizations/{authorizationId}:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema:
          type: string
      - name: authorizationId
        in: path
        required: true
        schema:
          type: string
    delete:
      operationId: revokePlaybackReceiverAuthorization
      summary: Revoke one playback receiver controller authorization
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: playback.receiver.authorization-revoked
      responses:
        "204": { description: Receiver authorization revoked }
  /playback/receivers/{receiverId}/handoff:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: handoffPlaybackToReceiver
      summary: Prepare controller playback on a registered Portico receiver
      description: The authenticated receiver redeems an encrypted controller instruction. The Server creates a handoff_pending successor from the authoritative source occurrence, forward queue, and history, but retains the source until the receiver separately reports exact first-playing evidence.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: playback.receiver.handoff
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackReceiverHandoffRequest" }
      responses:
        "200":
          description: Receiver playback prepared but not yet authoritative
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackResponse" }
        "403": { description: Receiver authorization is expired, revoked, or mismatched }
        "409": { description: Source playback authority changed before the transfer committed }
  /playback/receivers/{receiverId}/handoffs/{requestId}/commit:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema: { type: string }
      - name: requestId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: commitPlaybackReceiverHandoff
      summary: Commit a prepared receiver handoff after player readiness
      description: Atomically accepts the exact terminal captured during preparation and activates the exact prepared receiver session only after first-playing evidence. Exact retries return the committed playback; mismatched receiver, source, request, authorization, or session identities fail closed.
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: playback.receiver.handoff-committed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackReceiverHandoffCommitRequest" }
      responses:
        "200":
          description: Receiver-owned active playback; also returned for an exact committed retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackResponse" }
        "403": { description: Receiver authorization is expired, revoked, or mismatched }
        "404": { description: Prepared handoff not found }
        "409": { description: Source, request, or prepared receiver session mismatch }
        "410": { description: Prepared handoff expired and was rolled back }
  /playback/receivers/{receiverId}/handoffs/{requestId}:
    parameters:
      - name: receiverId
        in: path
        required: true
        schema: { type: string }
      - name: requestId
        in: path
        required: true
        schema: { type: string }
      - name: authorizationId
        in: query
        required: true
        schema: { type: string }
      - name: receiverPublicKeyFingerprint
        in: query
        required: true
        schema: { type: string, minLength: 43, maxLength: 43 }
      - name: sourceSessionId
        in: query
        required: true
        schema: { type: string }
    get:
      operationId: getPlaybackReceiverHandoffStatus
      summary: Reconcile a receiver handoff from the authorized controller
      x-portico-permission: play-media
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-rate-policy: playback-control
      x-portico-audit-event: none
      responses:
        "200":
          description: Authoritative receiver handoff state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackReceiverHandoffStatusResponse" }
