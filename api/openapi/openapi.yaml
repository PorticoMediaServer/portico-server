  /backups/{name}/restore:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Validate and enqueue a supervised backup restore
      operationId: restoreDatabaseBackup
      x-portico-permission: manageServer
      x-portico-audience: management
      x-portico-surfaces: [web-admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreBackupRequest"
      responses:
        "202":
          description: Restore durably enqueued; the selected database is not yet restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreBackupResponse"
  /backups/restore-authorization-context:
    get:
      summary: Read the current Server restore security epoch
      operationId: getRestoreAuthorizationContext
      x-portico-permission: manageServer
      x-portico-audience: management
      x-portico-surfaces: [web-admin]
      responses:
        "200":
          description: Current exact epoch for a Hosted owner restore authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreAuthorizationContext"
  /backups/restore/upload:
    post:
      summary: Verify and enqueue a manually uploaded database import
      operationId: restoreUploadedDatabase
      x-portico-permission: manageServer
      x-portico-audience: management
      x-portico-surfaces: [web-admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [confirmation, databaseBytes, database]
              additionalProperties: false
              oneOf:
                - required: [password]
                - required: [hostedAuthorization]
              properties:
                password:
                  type: string
                  format: password
                hostedAuthorization:
                  type: string
                  description: Exact JSON serialization of the signed Hosted restore authorization document.
                confirmation:
                  type: string
                databaseBytes:
                  type: integer
                  format: int64
                  minimum: 1
                  description: Authenticated client declaration of the database part size; the server compares it with the streamed byte count.
                database:
                  type: string
                  format: binary
                manifest:
                  type: string
                  description: Optional strict V2 backup manifest for a catalogued backup import.
      responses:
        "202":
          description: Database import durably enqueued; the active database is unchanged until supervised replacement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreBackupResponse"
  /backups/restore/{operationId}:
    parameters:
      - name: operationId
        in: path
        required: true
        schema:
          type: string
      - name: X-Portico-Restore-Status
        in: header
        required: true
        description: Opaque status capability returned by the enqueue response.
        schema:
          type: string
    get:
      summary: Read the capability-bound supervised restore status
      operationId: getRestoreStatus
      security: []
      x-portico-permission: public
      x-portico-audience: management
      x-portico-surfaces: [web-admin]
      responses:
        "200":
          description: Current durable restore state and phase. The capability is accepted in the header and is not echoed.
