    PlaybackHandoffRequest:
      type: object
      additionalProperties: false
      required: [requestId, entryId, previousTerminal]
      properties:
        preparedSessionId:
          type: string
        requestId: { type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9._:-]+$', description: Stable idempotency identity for this handoff. Exact retries reuse this value and a byte-equivalent request body to return the committed result. }
