    post:
      operationId: postLiveTvStreamsChannelIdClose
      x-portico-audience: viewer
      x-portico-client-core-method: closeLiveTvStream
      summary: Close a Live TV stream session
      description: Accepts the owning playback actor's exact ordered terminal event and closes the Live TV session exactly once.
      parameters:
        - name: channelId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
