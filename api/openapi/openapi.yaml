          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchWithFriendsGroup"
        "409": { description: Expected group revision is stale }
  /watch-with-friends/groups/{groupId}/queue/{entryId}:
    parameters:
      - name: groupId
        in: path
        required: true
        schema:
          type: string
      - name: entryId
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Remove one exact queued occurrence from a Watch With Friends group
      parameters:
        - name: expectedRevision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: idempotencyKey
          in: query
          required: true
          description: Nonempty key of at most 120 characters. Exact replays return the current materialized group snapshot.
          schema: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Watch With Friends group with updated queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchWithFriendsGroup"
        "409": { description: Expected group revision is stale }
