      required: [sourceType, items, pageInfo]
      properties:
        sourceType: { type: string, const: library-channel }
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryChannelSummary" }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    AdminLibraryChannelListResponse:
      type: object
      required: [sourceType, items, pageInfo]
      properties:
        sourceType: { type: string, const: library-channel }
        items: { type: array, items: { $ref: "#/components/schemas/LibraryChannel" } }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    LibraryChannelRule:
      type: object
      required: [id, name, enabled, sortOrder, query, selectionMode, episodeMode, exhaustionMode, dedupeWindow, maxConsecutive, config]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        sortOrder: { type: integer }
        query:
          oneOf:
            - type: object
              maxProperties: 0
            - $ref: "#/components/schemas/BrowseExpression"
        selectionMode: { type: string, enum: [sequential, shuffle_bag, weighted_random] }
        episodeMode: { type: string, enum: [none, in_order, marathon, randomized] }
        exhaustionMode: { type: string, enum: [loop, slate] }
        dedupeWindow: { type: integer, minimum: 0, maximum: 1000 }
        maxConsecutive: { type: integer, minimum: 0, maximum: 1000 }
        config: { type: object, additionalProperties: true }
        templateKey: { type: string }
        templateVersion: { type: integer, minimum: 0 }
    LibraryChannelBlock:
      type: object
      required: [id, ruleId, name, enabled, weekdayMask, startMinute, endMinute, priority, anchored, allowOverrun, sortOrder]
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        ruleId: { type: string, minLength: 1, maxLength: 128 }
        fallbackRuleId: { type: string, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        weekdayMask: { type: integer, minimum: 1, maximum: 127 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 0, maximum: 1439 }
        priority: { type: integer }
        anchored: { type: boolean }
        allowOverrun: { type: boolean }
        sortOrder: { type: integer }
        templateKey: { type: string }
        templateVersion: { type: integer, minimum: 0 }
    LibraryChannelAggregate:
      type: object
      required: [channel, rules, blocks]
      properties:
        channel: { $ref: "#/components/schemas/LibraryChannel" }
        rules:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/LibraryChannelRule" }
        blocks:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/LibraryChannelBlock" }
    LibraryChannelAggregateListResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LibraryChannelAggregate" } }
        total: { type: integer, minimum: 0 }
    LibraryChannelConfigurationRequest:
      type: object
      required: [expectedRevision, name, description, enabled, sortOrder, timezone, defaultRuleId, qualityProfile, logo, rules, blocks]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 0 }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        enabled: { type: boolean }
        sortOrder: { type: integer }
        timezone: { type: string }
        reshuffle:
          type: boolean
          default: false
          description: Mint a new deterministic programming seed. Ordinary updates preserve the existing seed.
        defaultRuleId: { type: string, minLength: 1, maxLength: 128 }
        qualityProfile: { type: string, enum: [original, auto, 1080p-high, 1080p-medium, 720p-high, 720p-medium, 480p, 328p] }
        logo: { $ref: "#/components/schemas/LibraryChannelLogo" }
        templateKey: { type: string }
        templateVersion: { type: integer, minimum: 0 }
        rules:
          type: array
          minItems: 1
          maxItems: 64
          items: { $ref: "#/components/schemas/LibraryChannelRule" }
        blocks:
          type: array
          maxItems: 256
          items: { $ref: "#/components/schemas/LibraryChannelBlock" }
    LibraryChannelGuideEntry:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [id, channelId, sourceType, kind, startsAt, endsAt, artwork, availability]
      properties:
        id: { type: string }
        channelId: { type: string }
        sourceType: { type: string, const: library-channel }
        kind: { type: string, enum: [media, slate, unavailable] }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        mediaId: { type: string }
        title: { type: string }
        subtitle: { type: string }
        summary: { type: string }
        contentRating: { type: string }
        artwork: { $ref: "#/components/schemas/ImageSet" }
        availability: { type: string, enum: [available, missing, unavailable, restricted] }
        reasonMessageId: { type: string }
    LibraryChannelGuide:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [sourceType, channel, from, to, serverTime, programs, pageInfo]
      properties:
        sourceType: { type: string, const: library-channel }
        channel: { $ref: "#/components/schemas/LibraryChannelSummary" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        programs:
          type: array
          items: { $ref: "#/components/schemas/LibraryChannelGuideEntry" }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    LibraryChannelsGuide:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [sourceType, channels, programs, from, to, serverTime, pageInfo]
      properties:
        sourceType: { type: string, const: library-channel }
        channels: { type: array, items: { $ref: "#/components/schemas/LibraryChannelSummary" } }
        programs: { type: array, items: { $ref: "#/components/schemas/LibraryChannelGuideEntry" } }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        pageInfo: { $ref: "#/components/schemas/CursorPageInfo" }
    LibraryChannelTuneRequest:
      type: object
      required: [clientInstanceId, intent]
      properties:
        at: { type: string, format: date-time, description: Owner-only diagnostic override. Consumer tune always uses authoritative server time. }
        clientInstanceId: { type: string }
        clientProfile: { $ref: "#/components/schemas/PlaybackClientProfile" }
        intent: { $ref: "#/components/schemas/PlaybackIntent" }
        replacement: { $ref: "#/components/schemas/PlaybackReplacementRequest" }
    LibraryChannelPlayoutSource:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [kind, durationSeconds]
      properties:
        kind: { type: string, enum: [media, generated_slate, unavailable] }
        mediaId: { type: string }
        offsetSeconds: { type: integer, minimum: 0 }
        durationSeconds: { type: integer, minimum: 1 }
        generatorId: { type: string }
    LibraryChannelTuneResponse:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [sourceType, channelId, programId, startsAt, endsAt, playout, qualityProfile, playback]
      properties:
        sourceType: { type: string, const: library-channel }
        channelId: { type: string }
        programId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        playout: { $ref: "#/components/schemas/LibraryChannelPlayoutSource" }
        qualityProfile:
          type: string
          description: Server-owned playback quality policy that the stream planner must apply.
        videoOverlay: { $ref: "#/components/schemas/LibraryChannelVideoOverlay" }
        playback: { $ref: "#/components/schemas/PlaybackResponse" }
    LibraryChannelVideoOverlay:
      x-portico-audience: viewer
      type: object
      additionalProperties: false
      required: [assetUrl, corner, widthPercent, insetPercent, treatment, requiresTranscode]
      properties:
        assetUrl: { type: string }
        corner: { type: string, enum: [top_left, top_right, bottom_left, bottom_right] }
        widthPercent: { type: number, minimum: 2, maximum: 20 }
        insetPercent: { type: number, minimum: 0, maximum: 10 }
        treatment: { type: string, enum: [color, white, black] }
        requiresTranscode: { type: boolean, const: true }
    LibraryChannelLogoAsset:
      type: object
      required: [id, source, mimeType, url, width, height, bytes, sha256]
      properties:
        id: { type: string }
        source: { type: string, const: custom }
        mimeType: { type: string, const: image/png }
        url: { type: string }
        width: { type: integer, minimum: 1, maximum: 4096 }
        height: { type: integer, minimum: 1, maximum: 4096 }
        bytes: { type: integer, minimum: 1, maximum: 2097152 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
    LibraryChannelTemplateSort:
      type: object
      required: [field, direction]
      properties:
        field: { type: string }
        direction: { type: string, enum: [asc, desc] }
    LibraryChannelTemplate:
      type: object
      required: [key, version, name, description, ruleName, query, selectionMode, episodeMode, minimumCandidates, minimumDistinctSeries, requiredEntityKinds, sort, logoRef]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: string }
        ruleName: { type: string }
        query: { type: object, additionalProperties: true }
        selectionMode: { type: string, enum: [sequential, shuffle_bag, weighted_random] }
        episodeMode: { type: string, enum: [none, in_order, marathon, randomized] }
        minimumCandidates: { type: integer, minimum: 0 }
        minimumDistinctSeries: { type: integer, minimum: 0 }
        requiredEntityKinds: { type: array, items: { type: string } }
        candidateLimit: { type: integer, minimum: 0 }
        recencyDays: { type: integer, minimum: 0 }
        sort: { type: array, items: { $ref: "#/components/schemas/LibraryChannelTemplateSort" } }
        logoRef: { type: string }
    LibraryChannelBlockPreset:
      type: object
      required: [key, version, name, description, weekdays, startMinute, endMinute, anchored, allowOverrun]
      properties:
        key: { type: string }
        version: { type: integer, minimum: 1 }
        name: { type: string }
        description: { type: string }
        weekdays: { type: integer, minimum: 1, maximum: 127 }
        startMinute: { type: integer, minimum: 0, maximum: 1439 }
        endMinute: { type: integer, minimum: 0, maximum: 1439 }
        anchored: { type: boolean }
        allowOverrun: { type: boolean }
    LibraryChannelTemplatesResponse:
      type: object
      required: [templates, blockPresets]
      properties:
        templates: { type: array, items: { $ref: "#/components/schemas/LibraryChannelTemplate" } }
        blockPresets: { type: array, items: { $ref: "#/components/schemas/LibraryChannelBlockPreset" } }
    LibraryChannelTemplateApplicability:
      type: object
      required: [templateKey, applicable, candidateCount, distinctSeries]
      properties:
        templateKey: { type: string }
        applicable: { type: boolean }
        candidateCount: { type: integer, minimum: 0 }
        distinctSeries: { type: integer, minimum: 0 }
    LibraryChannelApplicabilityResponse:
      type: object
      required: [items, total]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LibraryChannelTemplateApplicability" } }
        total: { type: integer, minimum: 0 }
    LibraryChannelRestoreDefaultsRequest:
      type: object
      required: [timezone]
      properties:
        timezone: { type: string }
        mode: { type: string, enum: [recommended, all], default: recommended, description: Recommended installs only applicable templates. All also installs unsupported templates disabled with an explicit reason. }
        templateKeys: { type: array, maxItems: 30, uniqueItems: true, items: { type: string } }
    LibraryChannelRestoreDefaultsResponse:
      type: object
      additionalProperties: false
      required: [items, createdCount, existingCount, skippedCount]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LibraryChannelAggregate" } }
        createdCount: { type: integer, minimum: 0 }
        existingCount: { type: integer, minimum: 0 }
        skippedCount: { type: integer, minimum: 0 }
    LibraryChannelReorderItem:
      type: object
      required: [id, expectedRevision]
      properties:
        id: { type: string }
        expectedRevision: { type: integer, format: int64, minimum: 1 }
    LibraryChannelReorderRequest:
      type: object
      required: [items]
      properties:
        items: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/LibraryChannelReorderItem" } }
    LibraryChannelGeneration:
      type: object
      required: [channelId, generationId, configRevision, horizonStart, horizonEnd, generatedThrough, entryCount, warnings]
      properties:
        channelId: { type: string }
        generationId: { type: string }
        configRevision: { type: integer, format: int64, minimum: 1 }
        horizonStart: { type: string, format: date-time }
        horizonEnd: { type: string, format: date-time }
        generatedThrough: { type: string, format: date-time }
        entryCount: { type: integer, minimum: 1 }
        warnings: { type: array, items: { type: string } }
    LibraryChannelHealth:
      type: object
      required: [channelId, enabled, configRevision, healthState]
      properties:
        channelId: { type: string }
        enabled: { type: boolean }
        configRevision: { type: integer, format: int64, minimum: 1 }
        healthState: { type: string, enum: [pending, healthy, warning, error, disabled] }
        healthMessageId: { type: string }
        generatedThrough: { type: string, format: date-time }
    LibraryChannelHealthResponse:
      type: object
      required: [items, total, segmentCache]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/LibraryChannelHealth" } }
        total: { type: integer, minimum: 0 }
        segmentCache: { $ref: "#/components/schemas/LibraryChannelSegmentCacheStatus" }
    LibraryChannelSegmentCacheStatus:
      type: object
      additionalProperties: false
      required: [bytes, files, limitBytes, limitFiles, maxAgeSeconds, pinnedFiles]
      properties:
        bytes: { type: integer, format: int64, minimum: 0 }
        files: { type: integer, minimum: 0 }
        limitBytes: { type: integer, format: int64, minimum: 1 }
        limitFiles: { type: integer, minimum: 1 }
        maxAgeSeconds: { type: integer, minimum: 1 }
        pinnedFiles: { type: integer, minimum: 0 }
        lastPrunedAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with current authentication state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /account/profiles:
    get:
      operationId: listAccountProfiles
      summary: List viewing profiles for the signed-in account
      responses:
        "200":
          description: Portable account profile directory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedProfileDirectory" }
    post:
      operationId: createAccountProfile
      summary: Create a Local Auth viewing profile
      description: Requires a current primary-profile administration proof in X-Portico-Profile-Admin-Proof. Hosted profiles remain managed by Portico Account.
      parameters:
        - name: X-Portico-Profile-Admin-Proof
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateManagedProfileRequest" }
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelectableProfile" }
        "401":
          description: Primary-profile proof required or expired
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /account/profiles/order:
    put:
      operationId: reorderAccountProfiles
      summary: Replace the Local Auth profile order
      parameters:
        - name: X-Portico-Profile-Admin-Proof
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [profileIds]
              properties:
                profileIds: { type: array, minItems: 1, maxItems: 8, uniqueItems: true, items: { type: string } }
      responses:
        "200":
          description: Reordered profile directory
          content: { application/json: { schema: { $ref: "#/components/schemas/ManagedProfileDirectory" } } }
  /account/profiles/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
      - name: X-Portico-Profile-Admin-Proof
        in: header
        required: true
        schema: { type: string }
    patch:
      operationId: updateAccountProfile
      summary: Update a Local Auth viewing profile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateManagedProfileRequest" } } }
      responses:
        "200":
          description: Updated profile
          content: { application/json: { schema: { $ref: "#/components/schemas/SelectableProfile" } } }
    delete:
      operationId: deleteAccountProfile
      summary: Permanently erase a Local Auth subordinate profile and its viewer-owned state
      responses:
        "200":
          description: Profile erased, or the stable receipt for an already-completed erasure
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfileErasureResponse" } } }
  /account/profiles/{profileId}/pin:
    parameters:
      - name: profileId
        in: path
        required: true
        schema: { type: string }
      - name: X-Portico-Profile-Admin-Proof
        in: header
        required: true
        schema: { type: string }
    put:
      operationId: setAccountProfilePin
      summary: Set or replace a Local Auth profile PIN after account password reauthentication
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalProfilePINSetRequest" }
      responses:
        "204": { description: PIN set and prior automatic trust revoked }
    delete:
      operationId: clearAccountProfilePin
      summary: Clear a Local Auth profile PIN after account password reauthentication when household policy permits
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocalProfilePINClearRequest" }
      responses:
        "204": { description: PIN cleared and prior automatic trust revoked }
  /account/profile-admin-proofs:
    post:
      operationId: createProfileAdministrationProof
      summary: Confirm the primary profile for five minutes of Local Auth profile administration
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ProfileAdministrationProofRequest" } } }
      responses:
        "201":
          description: Session-bound administration proof
          content: { application/json: { schema: { $ref: "#/components/schemas/ProfileAdministrationProofResponse" } } }
  /account/profile-trusts:
    post:
      operationId: createAutomaticProfileTrust
      description: Issues revocable remembered-profile trust for the current authoritative server profile session and server-issued device record. Hosted trust is valid only with the matching previously Cloud-established, profile-scoped server session and is never accepted by Local Auth profile selection.
      summary: Remember the currently selected profile on this device
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomaticProfileTrustRequest" } } }
      responses:
        "201":
          description: Revocable automatic-profile authorization trust
          content: { application/json: { schema: { $ref: "#/components/schemas/AutomaticProfileTrust" } } }
    delete:
      operationId: revokeAutomaticProfileTrusts
      summary: Revoke automatic-profile trust for this account and installation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomaticProfileTrustRequest" } } }
      responses:
        "204": { description: Installation trusts revoked }
  /account/profile-trusts/redeem:
    post:
      operationId: redeemAutomaticProfileTrust
      summary: Authoritatively confirm a remembered locked profile for the current app session
      description: Validates authority, account, profile, server, session device, installation, expiry, revocation, and current PIN revision before a remembered profile session may reopen.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/AutomaticProfileTrustRedemptionRequest" } } }
      responses:
        "204": { description: The remembered profile trust is current for this exact interactive session }
  /preferences:
    get:
      operationId: getViewerPreferenceBundle
      summary: Get the canonical server-owned viewer preference documents and effective policy
      parameters:
        - { name: deviceClass, in: query, required: false, schema: { type: string, enum: [web, mobile, television] }, description: Optional explicit scope. Omit with installationId to use the authenticated app session. }
        - { name: installationId, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 128 }, description: Optional explicit scope. Omit with deviceClass to use the authenticated app session. }
      responses:
        "200":
          description: Requested preference documents plus server-clamped effective device preferences
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerPreferenceBundle" } } }
  /preferences/{scopeType}:
    patch:
      operationId: patchViewerPreferenceDocument
      summary: Optimistically patch one canonical server-owned preference document
      parameters:
        - name: scopeType
          in: path
          required: true
          schema: { type: string, enum: [profile-server, profile-device-class, account-server-installation] }
        - { name: deviceClass, in: query, required: false, schema: { type: string, enum: [web, mobile, television] }, description: Optional explicit scope. Omit with installationId to use the authenticated app session. }
        - { name: installationId, in: query, required: false, schema: { type: string, minLength: 1, maxLength: 128 }, description: Optional explicit scope. Omit with deviceClass to use the authenticated app session. }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViewerPreferencePatch" } } }
      responses:
        "200":
          description: Updated requested document
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ProfileServerPreferenceDocument" }
                  - { $ref: "#/components/schemas/ProfileDeviceClassPreferenceDocument" }
                  - { $ref: "#/components/schemas/AccountServerInstallationPreferenceDocument" }
        "409":
          description: Expected revision does not match the current document
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /preferences/profile-activation:
    post:
      operationId: recordViewerProfileActivation
      summary: Remember the profile selected by the current authoritative app session
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViewerProfileActivationRequest" } } }
      responses:
        "200":
          description: Updated account and server installation preference document
          content: { application/json: { schema: { $ref: "#/components/schemas/AccountServerInstallationPreferenceDocument" } } }
        "409":
          description: Expected revision does not match the current document
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /notifications:
    get:
      operationId: listViewerNotifications
      summary: List private notifications for one exact profile or Portico-account recipient
      description: Requires the exact active interactive app session. API keys and non-interactive principals cannot read private notification content.
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: includeArchived, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Recipient-bound notification page
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerNotificationPage" } } }
  /notifications/read-all:
    post:
      operationId: markAllViewerNotificationsRead
      summary: Mark every current notification read for one exact recipient
      description: Requires the exact active interactive app session. API keys and non-interactive principals cannot mutate private notification receipts.
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
      responses:
        "200":
          description: Updated unread count and revision
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationReceipt" } } }
  /notifications/receipts:
    post:
      operationId: updateViewerNotificationReceipts
      summary: Atomically update one or more recipient-owned notification receipts
      description: Requires the exact active interactive app session. API keys and non-interactive principals cannot mutate private notification receipts.
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationReceiptMutation" } } }
      responses:
        "200":
          description: Updated receipts, unread count, and monotonic revision
          content: { application/json: { schema: { $ref: "#/components/schemas/NotificationReceiptResult" } } }
        "409":
          description: Expected revision does not match the current recipient revision
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /notifications/events:
    get:
      operationId: streamViewerNotificationInvalidations
      summary: Stream content-free private notification invalidations
      description: Requires the exact active interactive app session; API keys and non-interactive principals are rejected. Each event is only a content-free wake-up with a version, kind, and occurrence time. Recipient identity, revision, unread count, and notification content are refetched over the authenticated list endpoint and never enter the event stream.
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
      responses:
        "200":
          description: Server-sent notification-invalidation events
          content:
            text/event-stream:
              schema: { type: string }
  /notifications/events/poll:
    get:
      operationId: pollViewerNotificationInvalidations
      summary: Long-poll content-free private notification invalidations
      description: Requires the exact active interactive app session; API keys and non-interactive principals are rejected. A successful timeout returns 200 with an empty events array. Notification content is always refetched from the recipient-bound list endpoint.
      x-portico-permission: authenticated
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      x-portico-rate-policy: long-poll
      x-portico-audit-event: none
      x-portico-principal: interactive-session
      parameters:
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
        - { name: cursor, in: query, description: Opaque cursor previously returned by this exact recipient-scoped route., schema: { type: string } }
        - { name: waitSeconds, in: query, description: Maximum time to wait for an event. Zero performs an immediate cursor check., schema: { type: integer, minimum: 0, maximum: 25, default: 20 } }
      responses:
        "200":
          description: Notification invalidations, or an empty successful timeout envelope
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationInvalidationLongPollEnvelope" }
        "429":
          description: Long-poll concurrency or request-rate limit reached
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
  /notifications/{notificationId}:
    patch:
      operationId: updateViewerNotificationReceipt
      summary: Mark a recipient-owned notification read, unread, archived, or restored
      description: Requires the exact active interactive app session. API keys and non-interactive principals cannot mutate private notification receipts.
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string } }
        - { name: audience, in: query, schema: { type: string, enum: [profile, account-admin], default: profile } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/NotificationMutationRequest" } } }
      responses:
        "200":
          description: Updated notification
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerNotification" } } }
  /feedback:
    post:
      operationId: submitViewerFeedback
      summary: Send bounded one-way feedback to this server owner
      description: Client input never includes raw logs, paths, URLs, credentials, arbitrary diagnostics, account email, or IP address. Trusted diagnostics are constructed by the server.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ViewerFeedbackSubmission" } } }
      responses:
        "201":
          description: Message accepted
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerFeedbackReceipt" } } }
        "200":
          description: Duplicate message suppressed and the prior receipt returned
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerFeedbackReceipt" } } }
        "429":
          description: Profile feedback rate limit reached
          content: { application/problem+json: { schema: { $ref: "#/components/schemas/Error" } } }
  /feedback/capabilities:
    get:
      operationId: getViewerFeedbackCapabilities
      summary: Get the effective viewer-to-owner messaging policy for this profile
      responses:
        "200":
          description: Server-clamped feedback capability and retention policy
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerFeedbackCapabilities" } } }
  /admin/viewer-feedback:
    get:
      operationId: listOwnerViewerFeedback
      summary: List privacy-sanitized viewer messages for the server owner
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [new, read, resolved, dismissed] } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Owner feedback queue
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerFeedbackPage" } } }
  /admin/viewer-feedback/{feedbackId}:
    patch:
      operationId: updateOwnerViewerFeedback
      summary: Change viewer message status or send one bounded owner response
      parameters:
        - { name: feedbackId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OwnerFeedbackUpdateRequest" } } }
      responses:
        "200":
          description: Updated viewer message
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerFeedbackRecord" } } }
  /admin/viewer-notification-recipients:
    get:
      operationId: listOwnerViewerNotificationRecipients
      summary: List active recipients eligible for server-owner operational notices
      description: Returns local viewing profiles and primary Portico-account identities. Hosted subprofiles are never exposed.
      x-portico-permission: manage-server
      responses:
        "200":
          description: Privacy-bounded operational-notice recipient directory
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnerNotificationRecipientDirectory" } } }
  /admin/viewer-notifications:
    post:
      operationId: createOwnerViewerNotice
      summary: Send an operational notice to one viewer profile or Portico account
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/OwnerNoticeRequest" } } }
      responses:
        "201":
          description: Notice sent
          content: { application/json: { schema: { $ref: "#/components/schemas/ViewerNotification" } } }
  /readiness:
    get:
      operationId: getReadiness
      security: []
      summary: Check public server readiness
      responses:
        "200":
          description: Public readiness state
          content:
            application/json:
              schema:
                type: object
                required: [ready, status]
                properties:
                  ready:
                    type: boolean
                  status:
                    type: string
                    enum: [ready, unavailable]
        "503":
          description: Server is not ready
          content:
            application/json:
              schema:
                type: object
                required: [ready, status]
                properties:
                  ready:
                    type: boolean
                  status:
                    type: string
                    enum: [ready, unavailable]
  /auth/capabilities:
    get:
      security: []
      summary: Get public authentication capabilities
      description: Public-safe login capability response. Does not expose account names.
      responses:
        "200":
          description: Public authentication capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthCapabilities"
  /system/capabilities:
    get:
      summary: Get authenticated server capabilities
      description: Returns feature flags, effective permissions, marker taxonomy, and extras taxonomy for the current account.
      responses:
        "200":
          description: Current server capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerCapabilitiesResponse"
  /auth/me:
    get:
      security: []
      summary: Get current session and setup state
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
  /auth/setup:
    post:
      security: []
      summary: Create the first server owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serverName, username, displayName, password, setupMode, localOnlyAcknowledged]
              properties:
                serverName:
                  type: string
                  minLength: 1
                  maxLength: 120
                username:
                  type: string
                email:
                  type: string
                  description: Optional recovery and contact email for the local owner.
                displayName:
                  type: string
                password:
                  type: string
                  minLength: 8
                  maxLength: 72
                setupMode:
                  type: string
                  enum: [local_only]
                localOnlyAcknowledged:
                  type: boolean
                rememberOnBrowser:
                  type: boolean
                  default: true
                  description: Enroll this interactive web sign-in in the server-side browser account vault.
      responses:
        "201":
          description: Owner session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
  /auth/portico-setup/claim/start:
    post:
      security: []
      summary: Start Portico account first-run setup claim
      description: Starts a short-lived Portico account claim before any local owner exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serverName]
              properties:
                serverName:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        "201":
          description: Claim started
          content:
            application/json:
              schema:
                type: object
                properties:
                  remoteAccess:
                    $ref: "#/components/schemas/RemoteAccessStatus"
        "409":
          description: Server is already configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/portico-setup/status:
    get:
      security: []
      summary: Get Portico account first-run setup claim status
      description: Polls the pending claim and creates the linked owner profile after the claim is completed in Portico Web.
      responses:
        "200":
          description: Portico setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupRequired:
                    type: boolean
                  remoteAccess:
                    $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/status:
    get:
      summary: Get Remote Access status
      x-portico-role: owner
      description: Returns local server identity, claim state, direct endpoint, route health, certificate status, and synced Portico account members.
      responses:
        "200":
          description: Remote Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/routes/local:
    get:
      summary: List the server's verified local connection routes
      x-portico-role: owner
      responses:
        "200":
          description: Local connection routes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessRouteListResponse"
  /remote-access/settings:
    patch:
      summary: Update Remote Access settings
      x-portico-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteAccessSettingsPatch"
      responses:
        "200":
          description: Updated Remote Access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/claim/start:
    post:
      summary: Start a Portico server claim
      x-portico-role: owner
      responses:
        "201":
          description: Claim started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/claim/cancel:
    post:
      summary: Cancel the pending Portico server claim
      x-portico-role: owner
      responses:
        "200":
          description: Claim cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/unclaim:
    post:
      summary: Detach this local server from Portico
      x-portico-role: owner
      description: Clears only the local Portico credential, claim state, server ID, assigned hostname, and certificate status. The account-authenticated client must first remove the server through the Hosted `/api/account/servers/{serverId}` contract; this endpoint does not authorize or perform Hosted removal.
      responses:
        "200":
          description: Server disconnected from Portico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/test-direct:
    post:
      summary: Test the current direct Remote Access route
      x-portico-role: owner
      responses:
        "200":
          description: Direct route test recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/certificates/renew:
    post:
      summary: Request or renew the Remote Access certificate
      x-portico-role: owner
      responses:
        "202":
          description: Certificate maintenance job queued or reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessCertificateRenewResponse"
  /remote-access/members/{id}:
    patch:
      summary: Update a Hosted Portico member's local profile mapping
      x-portico-role: owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [localUserId]
              properties:
                localUserId:
                  type: string
      responses:
        "200":
          description: Member mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/policy-sync:
    post:
      summary: Synchronize the local projection of Hosted member policy
      x-portico-role: owner
      description: Fetches and applies the current Hosted policy snapshot after an account-authenticated member or invitation mutation. This endpoint does not mutate Hosted membership authority.
      responses:
        "200":
          description: Current Remote Access status after policy synchronization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteAccessStatus"
  /remote-access/health:
    get:
      security: []
      x-portico-audience: viewer
      x-portico-surfaces: [web, mobile, television]
      summary: Get public Remote Access route identity health
      description: Used by hosted web before trusting an account-linked direct route.
      responses:
        "200":
          description: Route identity health
          content:
            application/json:
              schema:
                type: object
                properties:
                  serverId:
                    type: string
                  serverPublicKeyFingerprint:
                    type: string
                  remoteAccessEnabled:
                    type: boolean
  /remote-access/hosted-wake:
    post:
      security: []
      x-portico-audience: management
      x-portico-surfaces: [web-admin]
      x-portico-rate-policy: state-mutation
      summary: Accept a signed Hosted Services convergence hint
      description: Verifies a short-lived Hosted signature and schedules an outbound authority refresh. The callback itself grants no authority and does not treat receipt as convergence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedServerWake"
      responses:
        "202":
          description: Verified wake accepted for asynchronous convergence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedServerWakeAccepted"
  /auth/login:
    post:
      security: []
      summary: Sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  description: Username or email address.
                password:
                  type: string
                  minLength: 1
                  maxLength: 72
                rememberOnBrowser:
                  type: boolean
                  default: true
                  description: Enroll this interactive web sign-in in the server-side browser account vault.
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
  /auth/browser-accounts:
    get:
      operationId: listBrowserAccounts
      security: []
      summary: List accounts remembered on this browser
      description: Authenticates with a server-scoped HttpOnly browser-vault cookie and returns display-safe account summaries only. An absent or stale vault returns an empty successful response.
      responses:
        "200":
          description: Browser account chooser state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccountsResponse"
  /auth/browser-accounts/switch:
    post:
      operationId: switchBrowserAccount
      security: []
      summary: Switch to a remembered browser account
      description: Revalidates the remembered grant, account state, identity, access schedule, device policy, authentication mode, and hosted membership before rotating the browser vault. Accounts without an explicit profile boundary receive a fresh ordinary session. Local accounts with profile selection enabled receive a five-minute browser-bound account-authentication challenge and directory; no viewer session exists until the client completes profile selection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccountSwitchRequest"
      responses:
        "200":
          description: Fresh viewer session or browser-bound Local Auth profile-selection challenge
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthMe"
                  - $ref: "#/components/schemas/ProfileAccountAuthenticationResponse"
  /auth/browser-accounts/preferences:
    patch:
      operationId: updateBrowserAccountPreferences
      security: []
      summary: Update browser account sign-in preferences
      description: Requires both the browser-vault cookie and an active ordinary session belonging to the same vault.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccountPreferencesRequest"
      responses:
        "200":
          description: Updated browser preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccountPreferencesResponse"
  /auth/browser-accounts/remove:
    post:
      operationId: removeBrowserAccount
      security: []
      summary: Remove one remembered account from this browser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserAccountRemoveRequest"
      responses:
        "200":
          description: Account removal result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccountMutationResponse"
  /auth/browser-accounts/sign-out-all:
    post:
      operationId: signOutAllBrowserAccounts
      security: []
      summary: Sign out every account remembered on this browser
      responses:
        "200":
          description: Browser vault revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserAccountMutationResponse"
  /auth/browser-accounts/{accountId}/image:
    parameters:
      - name: accountId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getBrowserAccountImage
      security: []
      summary: Stream a remembered account profile image
      responses:
        "200":
          description: Profile image
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
            image/png:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
    head:
      operationId: headBrowserAccountImage
      security: []
      summary: Inspect a remembered account profile image
      responses:
        "200":
          description: Profile image headers
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
  /auth/profile-authentications/local:
    post:
      operationId: authenticateLocalProfileAccount
      security: []
      summary: Authenticate a Local Auth account without entering a profile
      description: Verifies the account password and returns a five-minute hashed-at-rest account proof plus the selectable profile directory. It never creates a viewer session and is bound to one purpose, device, and installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalProfileAccountAuthenticationRequest"
      responses:
        "201":
          description: Account authenticated; profile selection is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileAccountAuthenticationResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many authentication attempts
  /auth/profile-selections/local:
    post:
      operationId: selectLocalProfile
      security: []
      summary: Select a Local Auth profile
      description: Atomically verifies the selected profile PIN when required, consumes the account-authentication proof, and returns a two-minute one-time grant bound to the server-issued device record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalProfileSelectionRequest"
      responses:
        "201":
          description: One-time profile grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSelectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          description: PIN is locked or selection attempts are rate limited
  /auth/profile-selections/session:
    post:
      operationId: selectActiveLocalProfile
      summary: Select a profile beneath the active Local Auth account
      description: Uses the existing authenticated account session as account proof, verifies the selected profile PIN when required, and returns a browser-bound one-time grant. It cannot cross accounts or select hosted profiles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActiveLocalProfileSelectionRequest"
      responses:
        "201":
          description: One-time profile grant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSelectionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: PIN is locked or selection attempts are rate limited
  /auth/profile-sessions/browser:
    post:
      operationId: createBrowserProfileSession
      security: []
      summary: Finalize a browser profile session
      description: Consumes one browser-purpose profile grant and creates an HttpOnly, profile-bound session. The grant cannot be replayed or used by another device or installation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrowserProfileSessionRequest"
      responses:
        "201":
          description: Browser profile session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/profile-sessions/native:
    post:
      operationId: createNativeProfileSession
      security: []
      summary: Finalize a native profile session
      description: Consumes one native-purpose profile grant and returns profile-bound local access and rotating refresh credentials. The signed profile grant and device identity must match; optional installation metadata is a storage scope hint and is not authentication proof.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeProfileSessionRequest"
      responses:
        "201":
          description: Native profile credentials created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeSessionCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/sessions:
    post:
      operationId: createNativeSession
      security: []
      summary: Create bounded local native credentials
      description: Authenticates local credentials, binds the installation to a revocable device record, and returns a 15-minute access credential plus a rotating refresh family with a rolling 180-day expiry. This endpoint never creates a browser cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeSessionCreateRequest"
      responses:
        "201":
          description: Native credentials created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeSessionCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/portico/handshakes:
    post:
      operationId: createPorticoAttachmentHandshake
      security: []
      summary: Begin an authenticated Portico Account server attachment
      description: Creates a bounded one-use P-256 key agreement signed by the server's Ed25519 identity. The transcript binds both ephemeral keys, the selected route origin, server identity, nonce, and expiry before any Hosted grant exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PorticoAttachmentHandshakeRequest"
      responses:
        "201":
          description: Signed attachment handshake created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PorticoAttachmentHandshakeResponse"
        "429":
          description: Too many attachment handshakes are active
  /auth/portico/sessions:
    post:
      operationId: attachPorticoSession
      security: []
      summary: Complete an encrypted Portico Account server attachment
      description: Decrypts a one-use request bound to the signed attachment handshake, introspects the server-scoped Hosted grant, verifies the profile-selection envelope, and returns encrypted server-local credentials. No Hosted grant, access token, refresh token, or cookie crosses a plaintext LAN route outside the authenticated encryption envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PorticoAttachmentEncryptedRequest"
      responses:
        "201":
          description: Portico server session attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PorticoAttachmentEncryptedResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Hosted Services is unavailable for this first-time attachment
  /auth/sessions/refresh:
    post:
      operationId: refreshNativeSession
      security: []
      summary: Rotate local native credentials
      description: Rotates the refresh credential and renews the server session's rolling 180-day expiry. A concurrent retry within 30 seconds receives the same replacement credentials; later reuse revokes the family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeSessionRefreshRequest"
      responses:
        "200":
          description: Native credentials rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeSessionCredentials"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/sessions/revoke:
    post:
      operationId: revokeNativeSession
      security: []
      summary: Revoke a local native credential family
      description: Idempotently revokes the refresh family and all access credentials derived from it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NativeSessionRefreshRequest"
      responses:
        "200":
          description: Credential family revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /auth/quick-connect/start:
    post:
      security: []
      summary: Start a local Quick Connect device login
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuickConnectStart"
      responses:
        "201":
          description: Quick Connect code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStartResponse"
        "503":
          description: Secure code allocation is temporarily unavailable
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/quick-connect/status:
    post:
      security: []
      summary: Poll Quick Connect approval status
      description: The high-entropy proof is carried only in the JSON body so it cannot leak through URL, referrer, proxy, or history logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              additionalProperties: false
              properties:
                secret:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Quick Connect status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectStatus"
  /auth/quick-connect/exchange:
    post:
      security: []
      summary: Exchange an approved Quick Connect secret or recover its committed session within five minutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [secret]
              properties:
                secret:
                  type: string
      responses:
        "200":
          description: Native credentials created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NativeSessionCredentials"
  /auth/quick-connect/pending:
    get:
      summary: List pending Quick Connect requests
      responses:
        "200":
          description: Pending Quick Connect requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/QuickConnectRequest"
  /auth/quick-connect/authorize:
    post:
      summary: Approve a Quick Connect code and bind the device login to the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 11
                  description: Canonical protocol-v1 code. Input is trimmed and uppercased; ordinary spaces and at most one dash are ignored.
      responses:
        "200":
          description: Quick Connect request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectRequest"
  /auth/quick-connect/deny:
    post:
      summary: Deny a pending Quick Connect code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 8
                  maxLength: 11
                  description: Canonical protocol-v1 code. Input is trimmed and uppercased; ordinary spaces and at most one dash are ignored.
      responses:
        "200":
          description: Quick Connect request denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuickConnectRequest"
  /auth/api-keys:
    get:
      summary: List active server-owner API keys
      description: Requires an interactive server-owner session. API keys cannot manage other API keys.
      x-portico-role: owner
      responses:
        "200":
          description: Active API keys without raw token values
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/APIKey"
    post:
      summary: Create a server-owner API key
      description: Requires an interactive server-owner session. The raw bearer token is returned once and is stored only as a hash by the server.
      x-portico-role: owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "201":
          description: API key created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreateResponse"
  /auth/api-keys/{id}:
    delete:
      summary: Revoke a server-owner API key
      description: Requires an interactive server-owner session. API keys cannot manage other API keys.
      x-portico-role: owner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
  /auth/logout:
    post:
      summary: Sign out
      responses:
        "200":
          description: Session cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /auth/portico/start:
    get:
      security: []
      summary: Start a Hosted Portico account sign-in
      parameters:
        - name: returnUrl
          in: query
          schema: { type: string }
        - name: rememberOnBrowser
          in: query
          schema: { type: boolean, default: true }
      responses:
        "302":
          description: Redirect to the Hosted Portico authorization flow
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/TextPayload"
  /auth/portico/callback:
    get:
      security: []
      summary: Complete a Hosted Portico account sign-in
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect back to the local UI with the sign-in result
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            text/html:
              schema:
                $ref: "#/components/schemas/TextPayload"
  /account/profile:
    get:
      summary: Get current user's local profile
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      summary: Update current user's local profile identity fields
      description: Updates only the authenticated user's local server profile display name and email. Server-wide user administration remains under `/users`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountProfileRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /account/password:
    post:
      operationId: changeAccountPassword
      summary: Change the current user's This Server password
      description: Requires an interactive authenticated session and proof of the current local password. API keys cannot change account credentials.
      x-portico-rate-policy: auth-sensitive
      x-portico-audit-event: account.password_changed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPasswordChangeRequest"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /account/library-navigation:
    get:
      summary: Get the current account's ordered pinned libraries
      responses:
        "200":
          description: Library navigation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryNavigationPreferences"
    patch:
      summary: Replace the current account's ordered pinned libraries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryNavigationPreferencesRequest"
      responses:
        "200":
          description: Updated library navigation preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryNavigationPreferences"
  /account/sessions:
    get:
      summary: List current user's active server sessions
      description: Returns only active sessions owned by the authenticated account on this server. Server-wide device administration remains under `/devices`.
      responses:
        "200":
          description: Active account sessions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/AccountSession"
  /account/sessions/{id}:
    delete:
      summary: Sign out one of the current user's non-current server sessions
      description: Deletes only a session owned by the authenticated account. The current session must use `/auth/logout`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session signed out
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "409":
          description: Current session must be signed out with `/auth/logout`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account/watch-history:
    delete:
      summary: Clear current user's watch history
      description: Removes playback history and resume points for the authenticated user on this server while preserving saved media state such as watchlist, favorites, likes, and ratings.
      responses:
        "200":
          description: Watch history cleared
          content:
            application/json:
              schema:
                type: object
                required: [ok, clearedAt]
                properties:
                  ok:
                    type: boolean
                  clearedAt:
                    type: string
                    format: date-time
  /display-preferences/{client}/{view}:
    parameters:
      - in: path
        name: client
        required: true
        schema:
          type: string
        description: Client family that owns the display preference.
      - in: path
        name: view
        required: true
        schema:
          type: string
        description: Stable view key within the client.
    get:
      summary: Get current user's display preferences for a client view
      responses:
        "200":
          description: Display preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPreference"
    patch:
      summary: Update current user's display preferences for a client view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayPreferenceRequest"
      responses:
        "200":
          description: Updated display preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayPreference"
  /account/image:
    get:
      summary: Stream the current user's profile image
      description: Streams the original upload by default. Optional bounded width/height query parameters return a cached JPEG resize variant.
      parameters:
        - in: query
          name: width
          schema:
            type: integer
            minimum: 32
            maximum: 2000
          description: Optional target width in pixels for a cached JPEG resize.
        - in: query
          name: height
          schema:
            type: integer
            minimum: 32
            maximum: 2000
          description: Optional target height in pixels for a cached JPEG resize.
      responses:
        "200":
          description: Profile image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
    post:
      summary: Upload the current user's profile image
      description: Accepts JPEG, PNG, or GIF profile images under 2 MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      summary: Delete the current user's profile image
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /system:
    get:
      security: []
      summary: Get server version and clock
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
  /branding:
    get:
      security: []
      summary: Get public-safe server branding
      description: Returns sanitized branding fields for login and client display. Arbitrary custom CSS is intentionally not supported.
      responses:
        "200":
          description: Branding document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingInfo"
  /system/identity:
    get:
      summary: Get stable server identity for trusted-client verification
      responses:
        "200":
          description: Server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemIdentity"
  /system/identity/reset:
    post:
      summary: Rotate the stable local server identity
      responses:
        "200":
          description: Rotated server identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemIdentity"
  /system/startup:
    get:
      summary: Get server startup phase diagnostics
      responses:
        "200":
          description: Startup diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartupDiagnostics"
  /system/diagnostics:
    get:
      summary: Get server-owner runtime diagnostics and dependency checks
      responses:
        "200":
          description: Runtime diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemDiagnostics"
  /system/time:
    get:
      summary: Get authenticated server clock sync timestamps
      responses:
        "200":
          description: Server time synchronization timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemTimeSync"
  /system/release:
    get:
      summary: Get server-owner release channel and migration readiness
      responses:
        "200":
          description: Release readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemReleaseInfo"
  /system/storage:
    get:
      summary: Get server-owner storage usage by server-managed category
      responses:
        "200":
          description: Storage usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStorageReport"
  /system/storage/paths:
    get:
      summary: Get active and configured server storage paths
      responses:
        "200":
          description: Storage path configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePathsResponse"
    patch:
      summary: Update owner-controlled server storage paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePathsRequest"
      responses:
        "200":
          description: Updated storage path configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePathsResponse"
  /system/storage/cleanup:
    post:
      summary: Run retention cleanup for server-managed storage categories
      responses:
        "200":
          description: Storage cleanup result and refreshed usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStorageCleanupResponse"
  /transcode/capacity:
    get:
      summary: Get server-owner transcode capacity and hardware validation
      responses:
        "200":
          description: Transcode capacity report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscodeCapacityReport"
  /network/connection-info:
    get:
      summary: Get runtime local routes and Portico remote-access status
      responses:
        "200":
          description: Network connection information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkConnectionInfo"
  /dlna/status:
    get:
      summary: Get DLNA/UPnP server status and exposed-library state
      responses:
        "200":
          description: DLNA status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DLNAStatus"
  /home:
    get:
      summary: Get the ordered lightweight personalized Home row manifest
      responses:
        "200":
          description: Home row descriptors with optional critical previews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeResponse" }
  /home/rows/{id}:
    get:
      summary: Load one independently cacheable Home row page
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One Home row page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeRow" }
  /suggestions:
    get:
      summary: Get explainable media suggestions
      description: Returns permission-filtered suggestions with source and reason metadata. Personal recommendations are ranked from user watchlist, rating, progress, and watched-state signals; local trending fills empty history.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Explainable media suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
  /filesystem/browse:
    get:
      summary: Browse server filesystem directories
      description: Owner-only utility for browsing local server folders when configuring libraries and storage paths.
      parameters:
        - name: path
          in: query
          schema:
            type: string
          description: Absolute server-host path to browse. Defaults to the server user's home directory when omitted.
      responses:
        "200":
          description: Browse result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemBrowseResponse"
        "400":
          description: Folder path is invalid or unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User cannot browse host folders or the folder cannot be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /filesystem/directories:
    post:
      summary: Create a server filesystem directory
      description: Owner-only utility for creating one local server folder. The requested path must be absolute, must not be a filesystem root, and its parent folder must already exist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilesystemCreateDirectoryRequest"
      responses:
        "201":
          description: Directory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilesystemBrowseResponse"
        "400":
          description: Folder path is invalid, parent is missing, or creation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User cannot create host folders or Portico lacks filesystem permission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Folder or file already exists at the requested path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /product-contract:
    get:
      operationId: getProductContract
      summary: Get the canonical cross-platform Portico product contract
      x-portico-permission: browse
      responses:
        "200":
          description: Canonical product contract
          headers:
            Cache-Control: { schema: { type: string, const: "private, no-cache" } }
            ETag: { schema: { type: string, minLength: 66, maxLength: 66 } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductContract" }
        "304":
          description: The cached semantic Product Contract is current
  /product-language/{locale}:
    get:
      operationId: getProductLanguage
      summary: Get canonical Portico wording and semantic icon identifiers
      security: []
      parameters:
        - name: locale
          in: path
          required: true
          schema: { type: string, enum: [en-US] }
      responses:
        "200":
          description: Versioned product language catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductLanguageCatalog" }
        "404":
          description: Requested locale is not available
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Error" }
  /libraries:
    get:
      summary: List libraries shared with the current user
      responses:
        "200":
          description: Libraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
    post:
      summary: Create a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRequest"
      responses:
        "201":
          description: Library created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
  /libraries/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get a library
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
    patch:
      summary: Update a library
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryRequest"
      responses:
        "200":
          description: Library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Library"
    delete:
      summary: Delete a library and indexed items
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
  /libraries/{libraryId}/browse-capabilities:
    get:
      operationId: getLibraryBrowseCapabilities
      summary: Resolve canonical browse capabilities for one library and principal
      x-portico-permission: view-library
      parameters:
        - name: libraryId
          in: path
          required: true
          schema: { type: string }
        - name: pivot
          in: query
          required: false
          description: When present, fields, sorts, allowed enum values, and resolvedPivot are narrowed to this library pivot.
          schema: { type: string }
      responses:
        "200":
          description: Principal- and library-specific browse capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryBrowseCapabilities" }
        "404":
          description: Library was not found or is not visible to this principal
        "422":
          description: Requested pivot is not available for this library
  /libraries/{libraryId}/browse:
    post:
      operationId: browseLibrary
      summary: Browse one library with the canonical query language and keyset cursor
      x-portico-permission: view-library
      parameters:
        - name: libraryId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BrowseLibraryRequest" }
      responses:
        "200":
          description: Cursor-paginated media cards
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowseLibraryResponse" }
        "404":
          description: Library was not found or is not visible to this principal
        "422":
          description: Browse expression, pivot, sort, or presentation fields are invalid
  /libraries/{id}/discover:
    get:
      operationId: getLibraryDiscover
      summary: Get library-scoped discovery rows
      description: Returns recommendation and activity rows containing only top-level media visible in the selected library.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 48
      responses:
        "200":
          description: Library-scoped discovery rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionsResponse"
  /libraries/{id}/categories:
    get:
      summary: List browsable categories for a library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Library categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryCategoryListResponse"
  /libraries/{id}/authors:
    get:
      summary: Browse permission-filtered audiobook authors
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audiobook author page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFacetValueListResponse" }
  /libraries/{id}/series:
    get:
      summary: Browse permission-filtered audiobook series
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Audiobook series page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryFacetValueListResponse" }
  /libraries/{id}/sources:
    get:
      summary: List source folders and origins for a library
      description: Requires library management or server management permission because local paths and remote origins may be sensitive. Results use opaque, principal-bound cursor pagination because a library can contain many distinct source origins.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 250, default: 100 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Library source groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibrarySourceGroupListResponse"
        "403":
          description: User cannot browse library source paths
  /libraries/{id}/scan:
    post:
      summary: Queue a library scan job
      description: Queues one coalesced library-level operation. remove_missing requires confirmedRunId from the latest /scan-review response; the server rejects stale, degraded, or non-authoritative reconciliation evidence.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LibraryScanRequest"
      responses:
        "201":
          description: Scan job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /libraries/{id}/scan-operations:
    get:
      summary: Get the owner-facing library scan operation
      description: Returns one library-level operation plus recent runs, structured phases and warnings, storage health, supported actions, and last/next scheduling evidence. Owner session only.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Library scan operation projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryScanOperationsResponse" }
  /libraries/{id}/scan-review:
    get:
      summary: Review missing media and identity conflicts before cleanup
      description: Returns owner-only paths and bounded reconciliation evidence. confirmationRunId may be submitted to remove_missing only when canConfirmRemoval is true.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Reconciliation review evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryScanReviewResponse" }
  /libraries/{id}/scan-runs:
    get:
      summary: List recent library scan runs
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 25 }
      responses:
        "200":
          description: Recent scan runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryScanRunListResponse" }
  /libraries/{id}/scan/cancel:
    post:
      summary: Cancel the active library scan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancelled or cancelling scan job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /libraries/{id}/scan/retry:
    post:
      summary: Retry a failed, cancelled, or degraded library scan
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LibraryScanRetryRequest" }
      responses:
        "201":
          description: Retry scan job queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /libraries/{id}/storage-sources:
    get:
      summary: List storage source health for a library
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Storage sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStorageSourceListResponse" }
  /libraries/{id}/storage-sources/{sourceId}:
    patch:
      summary: Override a storage source classification
      description: Persists an owner classification used by scanner timeout, polling, and circuit-breaker policy.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: sourceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageSourceClassificationRequest" }
      responses:
        "200":
          description: Updated storage source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryStorageSource" }
  /libraries/{id}/remote-storage-sources:
    get:
      summary: List managed remote storage sources
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Remote storage sources
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStorageSourceListResponse" }
    post:
      summary: Create a managed rclone or WebDAV source
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteStorageSourceRequest" }
      responses:
        "201":
          description: Created source with write-only credentials omitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStorageSource" }
  /libraries/{id}/remote-storage-sources/{sourceId}:
    get:
      summary: Get managed remote storage status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Remote storage source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStorageSource" }
    patch:
      summary: Update remote scan depth
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemoteStorageSourcePatchRequest" }
      responses:
        "200":
          description: Updated remote storage source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteStorageSource" }
    delete:
      summary: Remove a managed remote storage source
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
  /libraries/{id}/remote-storage-sources/{sourceId}/inventory:
    post:
      summary: Queue remote inventory and catalog reconciliation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        "202":
          description: Inventory queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
  /libraries/{id}/lyrics:
    post:
      summary: Queue missing lyrics fetch for a music library
      description: Queues an LRCLIB lookup job for tracks in the selected music library that do not already have uploaded, sidecar, or provider lyrics.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Missing lyrics fetch job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /libraries/trash/empty:
    post:
      summary: Empty missing library item trash
      responses:
        "202":
          description: Library trash cleanup queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryTrashCleanupResponse"
  /dashboard:
    get:
      summary: Get dashboard metrics, streams, jobs, and notices
      description: Defaults to live sessions. History mode reads recorded playback sessions, including Live TV sessions from first-party and third-party clients that use the playback heartbeat API.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [live, history]
            default: live
        - name: period
          in: query
          schema:
            type: string
            enum: [5m, 1h, 6h, 24h, 7d, 30d]
        - name: userId
          in: query
          schema:
            type: string
        - name: libraryId
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
        - name: sections
          in: query
          description: Comma-separated Dashboard sections to load. Use bandwidth for the bandwidth-only samples endpoint, sessions for active playback only, or core for the main overview.
          schema:
            type: string
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardResponse"
  /dashboard/activity:
    get:
      summary: Get lightweight live server activity
      responses:
        "200":
          description: Current server activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerActivityResponse"
  /dashboard/overview-usage:
    get:
      summary: Get dashboard usage rollups
      responses:
        "200":
          description: Dashboard usage rollups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverviewUsageResponse"
  /metadata/repair:
    get:
      summary: List metadata identity records requiring review
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: staleDays
          in: query
          schema: { type: integer, minimum: 1, maximum: 3650, default: 180 }
      responses:
        "200":
          description: Metadata repair candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataRepairResponse"
    post:
      summary: Queue a metadata identity rematch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataRepairRequest"
      responses:
        "201":
          description: Metadata repair queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataRepairActionResponse"
  /identity-reconciliation/reviews:
    get:
      summary: List unresolved or resolved identity reconciliation reviews
      parameters:
        - name: domain
          in: query
          schema: { type: string, enum: [media, media_parent, live_tv_channel] }
        - name: status
          in: query
          schema: { type: string, enum: [open, resolved, all], default: open }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Identity reconciliation review page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityReconciliationReviewPage"
  /identity-reconciliation/reviews/{reviewId}:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Get one identity reconciliation review
      responses:
        "200":
          description: Identity reconciliation review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityReconciliationReview"
  /identity-reconciliation/reviews/{reviewId}/resolve:
    parameters:
      - name: reviewId
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Resolve an identity reconciliation review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityReconciliationResolveRequest"
      responses:
        "200":
          description: Resolved identity reconciliation review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityReconciliationReview"
  /metadata/health:
    get:
      summary: Get metadata and library health issues
      description: Returns owner-facing cleanup findings for unmatched media, weak provider identity, missing artwork, missing runtimes, unavailable sources, stream-analysis gaps, unknown audio languages, missing credits, and raw imported titles.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 300
            default: 80
        - name: category
          in: query
          schema:
            type: string
            enum: [unmatched, identity_warning, missing_artwork, missing_duration, unavailable_source, stream_analysis, audio_language, missing_credits, raw_title]
        - name: libraryId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Metadata health report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataHealthResponse"
    post:
      summary: Queue a metadata health action
      description: Queues real server work for supported metadata health categories. Missing artwork queues metadata refresh jobs for items whose configured provider can refresh artwork.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetadataHealthActionRequest"
      responses:
        "202":
          description: Metadata health action queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataHealthActionResponse"
  /people/media:
    get:
      summary: List accessible media associated with a person
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Person media results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItemListResponse"
  /people/{personId}:
    get:
      operationId: getPersonDetail
      summary: Get a stable person detail pivot and accessible media credits
      x-portico-permission: browse
      x-portico-surfaces: [web, mobile, television]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string, pattern: '^person_[A-Za-z0-9_-]+$' }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Person identity and keyset-paginated credits visible to the active profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonDetailResponse" }
        "404":
          description: Person was not found in media visible to this profile
  /watchlist:
    get:
      summary: Browse the authenticated user's watchlist
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 250, default: 24 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string, enum: [all, unwatched, inProgress], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [updated, title, year, duration, progress], default: updated }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Watchlist page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
  /favorites:
    get:
      summary: Browse the authenticated user's favorites
      description: Favorites are independent personal media state and do not require an item to be on the watchlist.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 250, default: 24 }
        - name: cursor
          in: query
          schema: { type: string }
        - name: filter
          in: query
          schema: { type: string, enum: [all, unwatched, inProgress], default: all }
        - name: sort
          in: query
          schema: { type: string, enum: [updated, title, year, duration, progress], default: updated }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Favorites page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CursorListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/MediaItem"
  /media/bulk/state:
    post:
      summary: Update personal state for up to 200 media items atomically
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkMediaStateRequest" }
      responses:
        "200":
          description: Updated media items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemListResponse" }
  /media/bulk/jobs:
    post:
      summary: Queue one bounded server job per media item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkMediaJobRequest" }
      responses:
        "201":
          description: Queued jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobListResponse" }
  /media/bulk/metadata:
    post:
      summary: Apply one metadata patch to up to 200 media items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkMediaMetadataRequest" }
      responses:
        "200":
          description: Updated media items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItemListResponse" }
  /media/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get media details
      description: Returns the viewer-safe media projection for the active profile. Client query parameters cannot select a management or unredacted technical projection, including for principals that also hold metadata or library administration permissions.
      responses:
        "200":
          description: Media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    patch:
      summary: Update editable media metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMediaRequest"
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    delete:
      summary: Delete a media record and optionally move its source files to the Portico trash
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMediaRequest"
      responses:
        "200":
          description: Media deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMediaResponse"
  /media/{id}/children:
    get:
      operationId: getMediaChildren
      summary: List a container's accessible children with a stable keyset cursor
      description: Supports show, season, artist, album, audiobook-series, and other canonical hierarchy pivots without requiring oversized detail payloads.
      x-portico-permission: browse
      x-portico-surfaces: [web, mobile, television]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 4096 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Child media cards ordered by canonical hierarchy semantics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaChildrenResponse" }
        "404":
          description: Parent was not found or is not visible to this profile
  /media/{id}/match-candidates:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Search explicit metadata match candidates for a media item
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: year
          in: query
          schema: { type: integer, minimum: 1 }
        - name: language
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Metadata match candidates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaMatchSearchResponse" }
  /media/{id}/match:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Apply an explicit provider metadata match to a media item
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualMediaMatchRequest" }
      responses:
        "200":
          description: Rematched media item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaItem" }
  /media/{id}/watchlist:
    post:
      summary: Set watchlist state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watchlisted]
              properties:
                watchlisted:
                  type: boolean
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/favorite:
    post:
      summary: Set favorite state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/reaction:
    post:
      summary: Set like/dislike reaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction:
                  type: string
                  enum: ["", like, dislike]
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/watched:
    post:
      summary: Set watched state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [watched]
              properties:
                watched:
                  type: boolean
                sessionId:
                  type: string
                  description: Optional playback session id to heartbeat while progress is written.
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/rating:
    post:
      summary: Set user rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: integer
                  minimum: 0
                  maximum: 10
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
  /media/{id}/jobs:
    post:
      summary: Queue a media job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [metadata_refresh, media_analyze, optimize_version]
                profile:
                  type: string
                  description: Optional optimized-version profile when type is optimize_version.
                analysisMode:
                  type: string
                  enum: [full, probe]
                  description: Optional media analysis mode when type is media_analyze. Use probe for stream metadata only and full for generated analysis assets.
      responses:
        "201":
          description: Job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /media/{id}/recommendations:
    get:
      summary: Get lazily loaded contextual recommendation rows for a media item
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Contextual recommendation rows
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeRowListResponse" }
  /media/{id}/stream:
    get:
      summary: Stream a media item through the authenticated Portico playback proxy
      security:
        - mediaGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proxied media stream
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
        "206":
          description: Proxied media byte range
    head:
      summary: Inspect media stream headers without transferring the body
      security:
        - mediaGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Proxied media stream headers
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/BinaryPayload" }
  /media/{id}/hls/{resource}:
    get:
      summary: Read a playback-session-authorized HLS manifest, segment, or subtitle resource
      security:
        - mediaGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [master.m3u8, variant.m3u8, subtitles.m3u8, subtitle.vtt, segment]
      responses:
        "200":
          description: Authorized HLS resource
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
        "206":
          description: Authorized partial media resource
        "401":
          description: Media grant is absent, invalid, expired, revoked, or out of scope
    head:
      summary: Inspect a playback-session-authorized HLS resource
      security:
        - mediaGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: resource
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authorized HLS resource headers
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/BinaryPayload" }
  /download-preparations:
    get:
      operationId: listDownloadPreparations
      summary: List durable download preparations owned by the active profile
      x-portico-permission: download-media
      responses:
        "200":
          description: Profile-owned download preparation queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListResponse"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DownloadPreparation" }
        "403": { description: Profile cannot download media }
    post:
      operationId: createDownloadPreparation
      summary: Create or reuse a profile-owned preparation interest
      description: Original files become ready after validation. Optimized requests deduplicate server conversion work while retaining separate profile-owned lifecycle state. mediaIds and containerId create bounded batch/season preparations; nextAfterMediaId prepares the next authorized episode.
      x-portico-permission: download-media
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadPreparationCreateRequest" }
      responses:
        "201":
          description: Download preparation created or reused
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DownloadPreparation"
                  - $ref: "#/components/schemas/DownloadPreparationBatchResponse"
        "403": { description: Profile cannot download media }
        "404": { description: Media is unavailable to the active profile }
        "409": { description: Source or selected quality cannot be prepared }
        "429": { description: Account or profile preparation limit reached }
  /download-preparations/{preparationId}:
    parameters:
      - name: preparationId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDownloadPreparation
      summary: Get a profile-owned download preparation
      x-portico-permission: download-media
      responses:
        "200":
          description: Materialized preparation state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadPreparation" }
        "404": { description: Preparation is absent or belongs to another profile }
    patch:
      operationId: updateDownloadPreparation
      summary: Pause, resume, cancel, retry, or remove a preparation interest
      x-portico-permission: download-media
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadPreparationUpdateRequest" }
      responses:
        "200":
          description: Updated preparation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadPreparation" }
        "404": { description: Preparation is absent or belongs to another profile }
        "409": { description: Action is not valid for the current state }
    delete:
      operationId: removeDownloadPreparation
      summary: Remove a preparation from the active profile queue
      x-portico-permission: download-media
      responses:
        "200":
          description: Removed preparation tombstone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadPreparation" }
        "404": { description: Preparation is absent or belongs to another profile }
  /download-preparations/{preparationId}/grant:
    parameters:
      - name: preparationId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: createDownloadPreparationGrant
      summary: Mint a bounded, range-safe transfer grant for a ready preparation
      x-portico-permission: download-media
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadPreparationGrantRequest" }
      responses:
        "201":
          description: Transfer grant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaDownloadGrantResponse" }
        "404": { description: Preparation is absent or belongs to another profile }
        "409": { description: Preparation is not ready }
  /offline-download-authorizations/revalidate:
    post:
      operationId: revalidateOfflineDownloadAuthorization
      summary: Revalidate and replace an immutable native offline authorization receipt
      description: Returns a signed replacement only after the active profile, exact authorization revision, preparation, media version, and verified artifact binding are rechecked atomically. Complete foreign viewer scopes return out-of-scope without probing receipt or preparation state; malformed receipts return invalid.
      x-portico-auth: session
      x-portico-permission: download-media
      x-portico-audience: viewer
      x-portico-surfaces: [mobile, television]
      x-portico-rate-policy: auth-sensitive
      x-portico-audit-event: api.revalidateOfflineDownloadAuthorization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineDownloadAuthorizationRevalidationRequest" }
      responses:
        "200":
          description: Exact revalidation outcome; only valid-replacement includes a receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineDownloadAuthorizationRevalidationResponse" }
        "503": { description: Authorization state could not be checked atomically }
  /media/{id}/download:
    get:
      summary: Download the original source or an existing optimized version for a permitted media item
      security:
        - downloadGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: profile
          in: query
          required: false
          description: Use source/original for the local source, default/optimized for the configured optimized profile, or one of the stable optimized registry profile IDs.
          schema:
            type: string
      responses:
        "200":
          description: Source or optimized file download
          content:
            application/octet-stream:
              schema:
                $ref: "#/components/schemas/BinaryPayload"
        "206":
          description: Source file byte range
        "403":
          description: User lacks download permission
        "401":
          description: Download grant is absent, invalid, expired, revoked, or out of scope
    head:
      summary: Inspect downloadable media headers without transferring the body
      security:
        - downloadGrantAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: profile
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Source or optimized file headers
          content:
            application/octet-stream:
              schema: { $ref: "#/components/schemas/BinaryPayload" }
        "401":
          description: Download grant is absent, invalid, expired, revoked, or out of scope
  /media/{id}/download-options:
    get:
      summary: List source and optimized download options for a media item
      description: Returns the original source download option plus all optimized-version profiles, including whether each variant is available, pending, or needs to be generated.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Download options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadOptionsResponse"
        "403":
          description: User cannot view media downloads
  /media/{id}/optimized:
    get:
      summary: List optimized versions for a media item
      parameters:
        - name: id
          in: path
          required: true
