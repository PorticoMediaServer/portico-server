      enum:
        - play
        - play.from-beginning
        - download
        - queue.add
        - watchlist.add
        - watchlist.remove
        - favorite.add
        - favorite.remove
        - watched.set
        - watched.mark
        - watched.unmark
        - reaction.set
        - rating.set
        - collection.add
        - playlist.add
        - watch-with-friends.start
        - metadata.edit
        - metadata.refresh
        - media.analyze
        - media.optimize
        - media.delete
        - live.play
        - dvr.record
        - dvr.record-series
        - dvr.play
        - dvr.cancel
        - dvr.delete
        - dvr.edit
        - dvr.enable
        - dvr.disable
        - dvr.rule.create
        - feedback.report-problem
        - feedback.request-higher-quality
    MediaActionCapability:
      type: object
      additionalProperties: false
      required: [id, mutating, bulkSupported, presentation, command, confirmation, invalidates]
      properties:
        id: { $ref: "#/components/schemas/MediaActionID" }
        mutating: { type: boolean }
        bulkSupported: { type: boolean }
        presentation: { $ref: "#/components/schemas/MediaActionPresentation" }
        command: { $ref: "#/components/schemas/MediaActionCommand" }
        confirmation: { $ref: "#/components/schemas/MediaActionConfirmation" }
        invalidates:
          type: array
          items: { type: string }
    MediaActionPresentation:
      type: object
      additionalProperties: false
      required: [labelMessageId, iconId, group, priority, surfaces]
      properties:
        labelMessageId: { type: string, pattern: '^action\.[a-z0-9.-]+$' }
        iconId: { type: string, pattern: '^action\.[a-z0-9.-]+$' }
        group: { type: string, enum: [playback, recording, saved, state, administration, feedback] }
        priority: { type: integer, minimum: 0, maximum: 100 }
        surfaces:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [web, mobile, television, web-admin] }
    MediaActionCommand:
      type: object
      additionalProperties: false
      required: [kind, execution, resultHandling]
      properties:
        kind: { type: string, enum: [api, client-flow] }
        execution: { type: string, enum: [single, per-item, selection] }
        method: { type: string, enum: [GET, POST, PATCH, DELETE] }
        pathTemplate: { type: string }
        staticBody:
          type: object
          additionalProperties: true
        requiredInputs:
          type: array
          uniqueItems: true
          items: { type: string }
        flowId: { type: string }
        resultHandling: { type: string, enum: [json, job, playback-session, download-preparation, flow] }
    MediaActionConfirmation:
      type: object
      additionalProperties: false
      required: [required, tone]
      properties:
        required: { type: boolean }
        tone: { type: string, enum: [none, destructive] }
