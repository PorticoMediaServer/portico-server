        group: { type: string, enum: [movies, shows, episodes, people, music, audiobooks, live-tv] }
        sort:
          type: string
          enum: [relevance, title, releaseYear, dateAdded]
          description: Omit for relevance. Relevance means best match first and only supports desc. Title defaults to asc; releaseYear and dateAdded default to desc.
        direction:
          type: string
          enum: [asc, desc]
          description: Relevance only accepts desc. Title, releaseYear, and dateAdded accept either direction.
        cursor: { type: string }
        limit: { type: integer, minimum: 1, maximum: 50 }
        recordHistory:
          type: boolean
          description: Records a successful full-search query in the active profile's bounded server history. Quick/typeahead requests leave this false.
