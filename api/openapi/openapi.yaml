        query: { $ref: "#/components/schemas/BrowseExpression" }
        sort:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/BrowseSort" }
        presentation: { $ref: "#/components/schemas/BrowsePresentation" }
        seek: { $ref: "#/components/schemas/BrowseSeek" }
        cursor: { type: string, maxLength: 4096 }
        limit: { type: integer, minimum: 1, maximum: 200 }
