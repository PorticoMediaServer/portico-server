      type: object
      additionalProperties: false
      required: [field, operator, value]
      properties:
        field: { type: string }
        operator: { type: string }
        value:
          oneOf:
            - type: "null"
            - type: string
            - type: number
            - type: boolean
            - type: array
              minItems: 1
              items:
                oneOf:
                  - type: string
                  - type: number
                  - type: boolean
    BrowseExpression:
      oneOf:
        - type: object
          additionalProperties: false
          required: [all]
          properties:
            all:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/BrowseExpression" }
        - type: object
          additionalProperties: false
          required: [any]
          properties:
            any:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/BrowseExpression" }
        - type: object
          additionalProperties: false
          required: [not]
          properties:
            not: { $ref: "#/components/schemas/BrowseExpression" }
        - $ref: "#/components/schemas/BrowsePredicate"
    BrowsePresentation:
      type: object
      additionalProperties: false
      properties:
        fields:
          type: array
          uniqueItems: true
          items: { type: string }
    BrowseSeek:
      type: object
      additionalProperties: false
      required: [prefix]
      properties:
        prefix:
          type: string
          minLength: 1
          maxLength: 1
          pattern: '^(?:[A-Za-z]|#)$'
          description: "Alphabet anchor such as A-Z or #. Valid only on the first page with title or sortTitle ascending as the primary sort."
