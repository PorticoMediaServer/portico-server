      type: object
      additionalProperties: false
      required: [watchlisted, favorite, watched, progressSeconds]
      properties:
        watchlisted: { type: boolean }
        favorite: { type: boolean }
        watched: { type: boolean }
        progressSeconds: { type: integer, minimum: 0 }
        lastPlayedAt: { type: string, format: date-time }
