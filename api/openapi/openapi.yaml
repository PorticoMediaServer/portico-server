              type: object
              additionalProperties: false
              required: [sessionId, requestId, terminal]
              properties:
                sessionId:
                  type: string
                requestId:
                  type: string
                  minLength: 8
                  maxLength: 128
                  pattern: '^[A-Za-z0-9._:-]+$'
                terminal:
                  $ref: "#/components/schemas/PlaybackTerminalEvent"
      responses:
        "200":
          description: Live stream session closed
          content:
