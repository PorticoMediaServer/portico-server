          description: Watch With Friends group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchWithFriendsGroup"
    delete:
      summary: End a Watch With Friends group
      parameters:
        - name: expectedRevision
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: idempotencyKey
          in: query
