    DownloadPreparationGrantRequest:
      type: object
      required: [delivery]
      properties:
        delivery:
          type: string
          enum: [browser, native]
          description: Browser delivery uses only an HttpOnly cookie. Native delivery returns the ephemeral transfer credential for the PorticoDownload authorization scheme.
    MediaDownloadGrantResponse:
      type: object
      required: [downloadUrl, expiresAt, profile]
      properties:
        downloadUrl:
          type: string
          description: Clean same-server artifact URL. Browsers use the HttpOnly grant cookie; native transfer adapters send grantToken in Authorization and never persist either value.
        grantToken:
          type: string
          description: "Ephemeral transfer credential returned only by preparation grants for Authorization: PorticoDownload <grantToken>. Browser grant routes place it solely in an HttpOnly cookie. Never persist or log it."
        expiresAt:
          type: string
          format: date-time
        profile:
          type: string
        authorizationReceipt:
          $ref: "#/components/schemas/OfflineDownloadAuthorizationReceipt"
          description: Immutable signed authorization receipt returned only for native delivery after exact artifact verification and an atomic authorization-fence recheck.
    OfflineDownloadAuthorizationViewerScope:
      type: object
      additionalProperties: false
      required: [scopeKind, authority, accountId, profileId, serverId, authorizationRevision]
      properties:
        scopeKind: { type: string, const: server-bound }
        authority: { type: string, enum: [local, hosted] }
        accountId: { type: string, minLength: 1, maxLength: 128 }
        profileId: { type: string, minLength: 1, maxLength: 128 }
        serverId: { type: string, minLength: 1, maxLength: 128 }
        authorizationRevision: { type: string, minLength: 1, maxLength: 128 }
    OfflineDownloadAuthorizationIssuer:
      type: object
      additionalProperties: false
      required: [serverId, signingKeyFingerprint]
      properties:
        serverId: { type: string, minLength: 1, maxLength: 128 }
        signingKeyFingerprint:
          type: string
          pattern: "^sha256:[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    OfflineDownloadAuthorizationPreparation:
      type: object
      additionalProperties: false
      required: [preparationId, mediaId, mediaVersionId, qualityId]
      properties:
        preparationId: { type: string, minLength: 1, maxLength: 128 }
        mediaId: { type: string, minLength: 1, maxLength: 128 }
        mediaVersionId: { type: string, minLength: 1, maxLength: 128 }
        qualityId: { type: string, minLength: 1, maxLength: 128 }
    OfflineDownloadAuthorizationArtifact:
      type: object
      additionalProperties: false
      required: [sha256, sizeBytes]
      properties:
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
    OfflineDownloadAuthorizationReceipt:
      type: object
      additionalProperties: false
      required: [version, purpose, receiptId, viewerScope, issuer, preparation, artifact, lastVerifiedAt, verifyBy, signature]
      properties:
        version: { type: integer, const: 1 }
        purpose: { type: string, const: offline-download-authorization }
        receiptId: { type: string, minLength: 1, maxLength: 128 }
        viewerScope: { $ref: "#/components/schemas/OfflineDownloadAuthorizationViewerScope" }
        issuer: { $ref: "#/components/schemas/OfflineDownloadAuthorizationIssuer" }
        preparation: { $ref: "#/components/schemas/OfflineDownloadAuthorizationPreparation" }
        artifact: { $ref: "#/components/schemas/OfflineDownloadAuthorizationArtifact" }
        lastVerifiedAt: { type: string, format: date-time }
        verifyBy: { type: string, format: date-time }
        signature:
          type: string
          pattern: "^[A-Za-z0-9_-]{85}[AQgw]$"
    OfflineDownloadAuthorizationRevalidationRequest:
      type: object
      additionalProperties: false
      required: [receipt]
      properties:
        receipt: { $ref: "#/components/schemas/OfflineDownloadAuthorizationReceipt" }
    OfflineDownloadAuthorizationRevalidationResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [outcome, receipt]
          properties:
            outcome: { type: string, const: valid-replacement }
            receipt: { $ref: "#/components/schemas/OfflineDownloadAuthorizationReceipt" }
        - type: object
          additionalProperties: false
          required: [outcome]
          properties:
            outcome: { type: string, enum: [revoked, invalid, out-of-scope] }
