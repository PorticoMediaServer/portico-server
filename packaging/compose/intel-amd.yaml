services:
  portico:
    image: ghcr.io/porticomediaserver/portico-server:latest
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-0002}"
      TZ: "${TZ:-Etc/UTC}"
    ports: ["32500:32500"]
    volumes:
      - ${PORTICO_CONFIG:-./config}:/config
      - ${PORTICO_TRANSCODE:-./transcode}:/transcode
      - ${PORTICO_MEDIA:-./media}:/media:ro
    devices:
      - /dev/dri:/dev/dri
