services:
  portico:
    image: ghcr.io/porticomediaserver/portico-server:latest
    restart: unless-stopped
    ports: ["32500:32500"]
    volumes:
      - ${PORTICO_CONFIG:-./config}:/config
      - ${PORTICO_TRANSCODE:-./transcode}:/transcode
      - ${PORTICO_MEDIA:-./media}:/media:ro
    gpus: all
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      UMASK: "${UMASK:-0002}"
      TZ: "${TZ:-Etc/UTC}"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
