name: portico-media-server
arch: ${PORTICO_PACKAGE_ARCH}
platform: linux
version: ${PORTICO_PACKAGE_VERSION}
section: video
priority: optional
maintainer: Justin Ehler <https://ehler.ca>
description: Free personal media server for organizing and streaming your media.
vendor: Portico
homepage: https://getportico.tv
license: GPL-3.0-or-later
contents:
  - src: ${PORTICO_PACKAGE_ROOT}/portico-media-server
    dst: /usr/lib/portico-media-server/portico-media-server
    file_info:
      mode: 0755
  - src: ${PORTICO_PACKAGE_ROOT}/portico-desktop
    dst: /usr/lib/portico-media-server/portico-desktop
    file_info:
      mode: 0755
  - src: ${PORTICO_PACKAGE_ROOT}/bin/ffmpeg
    dst: /usr/lib/portico-media-server/bin/ffmpeg
    file_info:
      mode: 0755
  - src: ${PORTICO_PACKAGE_ROOT}/bin/ffprobe
    dst: /usr/lib/portico-media-server/bin/ffprobe
    file_info:
      mode: 0755
  - src: ${PORTICO_PACKAGE_ROOT}/web/
    dst: /usr/lib/portico-media-server/web/
  - src: ${PORTICO_PACKAGE_ROOT}/licenses/
    dst: /usr/share/doc/portico-media-server/licenses/
  - src: ${PORTICO_PACKAGE_ROOT}/LICENSE
    dst: /usr/share/doc/portico-media-server/LICENSE
  - src: ${PORTICO_PACKAGE_ROOT}/THIRD-PARTY-NOTICES.md
    dst: /usr/share/doc/portico-media-server/THIRD-PARTY-NOTICES.md
  - src: packaging/linux/portico-media-server.service
    dst: /usr/lib/systemd/system/portico-media-server.service
  - src: packaging/linux/tv.getportico.server.desktop
    dst: /etc/xdg/autostart/tv.getportico.server.desktop
  - src: packaging/linux/portico-media-server.svg
    dst: /usr/share/icons/hicolor/scalable/status/portico-media-server.svg
scripts:
  postinstall: packaging/linux/postinstall.sh
  preremove: packaging/linux/preremove.sh
