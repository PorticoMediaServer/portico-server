openapi: 3.1.0
info:
  title: Portico Server — notifications and viewer feedback
  version: "1.0.0"
  description: |
    The notification inbox and the viewer feedback surface of a Portico server.

    Four rules hold across everything here.

    * **One revision orders everything.** Every inbox carries a monotonic
      `revision`. The same number fences a batch write (`expectedRevision`),
      resumes an event stream (`Last-Event-ID`) and parks a long poll
      (`?revision=`). A client that holds one number holds its whole position.
    * **One document per read.** `GET /v1/notifications/inbox` returns the page,
      the counts, the retention window and the revision together. There is no
      second request to render an inbox, and no waterfall.
    * **One write surface.** Every state change — read, unread, archive,
      unarchive, read-all — goes through `POST /v1/notifications/inbox/actions`,
      which is fenced, idempotent and returns a per-identifier outcome. Changing
      five notices is one request.
    * **Producers cannot invent client instructions.** An action is either a
      navigation to an allowlisted view or one of six allowlisted commands. A
      client that does not recognise a command must render the action disabled;
      it must never synthesise behaviour from the string.

    **Audiences.** A notification addresses either one profile
    (`audience: profile`) or the administrators of an account
    (`audience: account-admin`). Audience is enforced by the server: a member
    session asking for `account-admin` receives 401, and an identifier belonging
    to another inbox reports `not-found` rather than confirming it exists.

    **Retention.** `notifications.retentionDays` is not a separate setting. It is
    the existing settings-registry field `notificationDays`, read and written
    through `PATCH /v1/admin/console/settings`, and reported here as
    `retentionDays` with `retentionSettingsField` naming its authority.

    Every operation requires a session on the selected server
    (`Authorization: Bearer <access token>`). Routes under `/v1/admin/` require
    an owner session.
servers:
  - url: https://{server}
    variables:
      server:
        default: localhost:8443
        description: The selected Portico server.
security:
  - viewerSession: []
tags:
  - name: notifications
    description: The viewer and administrator inbox.
  - name: notifications-live
    description: Event stream and long poll.
  - name: notifications-admin
    description: Owner broadcast and notification settings.
  - name: feedback
    description: Viewer feedback submission and the reporter's own reports.
  - name: feedback-admin
    description: Feedback triage.
paths:
  /v1/notifications/capabilities:
    get:
      tags: [notifications]
      operationId: getNotificationCapabilities
      summary: Every vocabulary a client needs to render notifications
      description: |
        The complete allowlists: audiences, severities, list states, producer
        sources, action command identifiers and navigation views, plus the paging
        limit, the heartbeat interval and the maximum long-poll wait.

        A client should read this once per session and validate against it rather
        than hard-coding the sets. An unrecognised command or view in a stored
        notification means this document is newer than the client: render the
        action disabled.

        Cost: constant, answered from memory. No paging.
      responses:
        "200":
          description: The vocabularies.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationCapabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/inbox:
    get:
      tags: [notifications]
      operationId: getNotificationInbox
      summary: One page of the inbox with its counts and revision
      description: |
        Returns the inbox document: one page of notifications newest first, the
        four counts, the revision, the observation time and the retention window.

        `audience` selects which inbox to read. `all` (the default) merges the
        caller's own profile inbox with the account-admin inbox when the caller
        is an owner; a member asking for `account-admin` receives 401 rather than
        an empty list, so a client can tell "not allowed" from "nothing there".

        `state` filters: `unread`, `read` (read and not archived), `archived`, or
        `all` (the default, including archived). Expired notifications are never
        returned in any state.

        Paging is by cursor: pass the `nextCursor` from the previous page. A
        cursor is an opaque sequence token; do not construct one. Reading never
        writes — retention runs on the server's maintenance tick, not on a GET.

        Cost: one indexed page query plus one counting query, both bounded by the
        per-inbox cap of 1000 records. Safe to call on every inbox open.
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [profile, account-admin, all], default: all }
        - name: state
          in: query
          schema: { type: string, enum: [unread, read, archived, all], default: all }
        - name: cursor
          in: query
          description: The `nextCursor` from the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
      responses:
        "200":
          description: The inbox document.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationInbox" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/unread-count:
    get:
      tags: [notifications]
      operationId: getNotificationUnreadCount
      summary: The revision and the four counts, and nothing else
      description: |
        The cheapest read in the feature: one revision and the unread, read,
        archived and total counts for the selected audience. Intended for a badge
        and for clients that poll rather than stream.

        Prefer `GET /v1/notifications/events`, or `GET /v1/notifications/wait`,
        over polling this on a short timer. Polling it every few seconds is
        nevertheless safe: it is two indexed aggregate queries and returns a few
        hundred bytes.

        Cost: two indexed aggregates. No paging.
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [profile, account-admin, all], default: all }
      responses:
        "200":
          description: The counts.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationSummary" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/inbox/actions:
    post:
      tags: [notifications]
      operationId: applyNotificationActions
      summary: The single, fenced, idempotent inbox write
      description: |
        Applies up to eight operations to the inbox in one transaction and
        returns the new revision, the new counts and a per-identifier outcome.

        `expectedRevision` is the revision the client last read. If the inbox has
        moved since, nothing is written and the response is 409 carrying
        `currentRevision`; refresh and retry. Pass `0` to apply regardless, which
        is only appropriate for a client that does not hold a revision yet.

        `operationId` is an idempotency key scoped to the caller. Retrying a
        request that may or may not have been applied returns the recorded
        answer instead of applying it twice. Reuse of the same key with a
        different body is 409.

        Outcomes per identifier: `applied` (the state changed), `unchanged` (the
        notification is already in that state) or `not-found` (no such
        notification in an inbox this caller may write). A notification belonging
        to another inbox reports `not-found`; the response never confirms that an
        identifier exists elsewhere.

        `archive` also marks read, because a notice filed away is one that was
        seen. `read-all` takes no identifiers and covers the unarchived records of
        the selected audience.

        A batch that changes nothing does not advance the revision, so another
        client's fence is not invalidated by a no-op.

        Cost: one transaction; at most 200 identifiers per request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationBatch" }
      responses:
        "200":
          description: The applied batch.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationBatchResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/events:
    get:
      tags: [notifications-live]
      operationId: streamNotificationEvents
      summary: Server-sent events for one viewer's inboxes
      description: |
        A `text/event-stream` whose notification frames carry `id: <revision>`.

        Frames:

        * `hello` — sent immediately with the current revision, the counts and
          `heartbeatSeconds`.
        * `change` — the notifications whose revision is above the client's,
          oldest first, with the new revision and counts. `resync: true` means
          more changed than one frame carries: re-read the inbox from
          `GET /v1/notifications/inbox` rather than trusting a partial list.
        * `heartbeat` — every 20 seconds, carrying the current revision, so a
          client can tell a live connection from a stalled proxy.
        * `closed` — the server is ending the stream; `reason` is
          `unauthorized`, `unavailable` or `stream-lifetime`. Reconnect with
          `Last-Event-ID` unless the reason is `unauthorized`.

        * `receiver.inbox_changed` — a per-profile receiver invalidation with
          `{kind: grant|handoff|resync, receiverId?: string}`. Grant/handoff
          arrivals are emitted only after their transaction commits. Fetch the
          named receiver's authenticated inbox. `resync` is sent on every
          connection and when changes are coalesced; refresh the inboxes of this
          profile's registered receivers. These hints contain no grant secrets,
          media identifiers or commands and carry no SSE id, preserving the
          notification resume cursor. The durable receiver inbox is authoritative.

        **Resume.** Send `Last-Event-ID: <revision>` on reconnect (browsers do
        this automatically). The server replays exactly the records whose
        revision is above it. `?revision=` is the equivalent hint on a first
        connection. A malformed `Last-Event-ID` resumes from nothing rather than
        failing the connection.

        Authorization is re-derived before event delivery and every 20-second
        heartbeat, so a revoked session stops receiving at its next check. A stream is closed after 30 minutes with
        `reason: stream-lifetime`; reconnecting with `Last-Event-ID` loses
        nothing.

        Limits: four concurrent parked connections per session and 512 per server,
        counted against `GET /v1/notifications/wait` as well. Exceeding either is
        429.

        Cost: event-driven indexed queries, with a 45-second safety poll. Clients
        that cannot hold an event-stream reader should use
        `GET /v1/notifications/wait` instead of polling the inbox.
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [profile, account-admin, all], default: all }
        - name: revision
          in: query
          description: First-connection resume hint. `Last-Event-ID` takes precedence.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: Last-Event-ID
          in: header
          description: The revision of the last frame the client processed.
          schema: { type: string }
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/notifications/wait:
    get:
      tags: [notifications-live]
      operationId: waitForNotifications
      summary: Long poll for the next inbox change
      description: |
        The event stream's contract without server-sent events, for clients that
        cannot hold a stream reader open.

        Pass the revision the client holds. If the inbox has already moved the
        response is immediate and carries the changed records. Otherwise the
        request parks until the revision moves or `waitSeconds` elapses, then
        returns the current revision with an empty `items`.

        `resync: true` carries the same meaning as on the stream: re-read the
        inbox.

        A request with no `revision` returns the current revision without
        parking, which is how a client obtains its first position.

        Limits: the same four-per-session, 64-per-server budget as the event
        stream. Exceeding it is 429.

        Cost: one small indexed query on wake, plus one every two seconds while
        parked. No paging.
      parameters:
        - name: audience
          in: query
          schema: { type: string, enum: [profile, account-admin, all], default: all }
        - name: revision
          in: query
          description: The revision the client holds. Omit to read the current one without parking.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: waitSeconds
          in: query
          schema: { type: integer, minimum: 0, maximum: 60, default: 25 }
      responses:
        "200":
          description: The change, or the unchanged revision after the wait.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationDelta" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/notifications/broadcast:
    post:
      tags: [notifications-admin]
      operationId: broadcastNotification
      summary: Send one notice to every profile, or to every administrator
      description: |
        Writes one notification into every inbox of the chosen audience in a
        single transaction.

        It is deduped like any other producer: re-sending the same `dedupeKey`
        edits the existing notice in every inbox — new title, new body, new
        actions, moved back to unread — instead of posting a second copy. That is
        how a maintenance window is corrected rather than repeated.

        `operationId` is an idempotency key: a retried request delivers once.

        `expiresInDays` of 0 applies the server's retention window.

        Owner sessions only. Bounded to 500 recipients per broadcast.

        Cost: one transaction proportional to the number of profiles. No paging.
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationBroadcast" }
      responses:
        "200":
          description: The delivery report.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationBroadcastResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/notifications/settings:
    get:
      tags: [notifications-admin]
      operationId: getNotificationSettings
      summary: Retention and the producer thresholds
      description: |
        `retentionDays` is reported here but is **not** owned here:
        `retentionSettingsField` names the settings-registry field
        (`notificationDays`) that is its single authority, written through
        `PATCH /v1/admin/console/settings`.

        The storage and certificate thresholds are owned by this feature, because
        they decide when a producer raises a notice rather than what a setting
        means elsewhere.

        Cost: one document read. No paging.
      security:
        - ownerSession: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
    patch:
      tags: [notifications-admin]
      operationId: updateNotificationSettings
      summary: Change the producer thresholds
      description: |
        Fenced by `expectedRevision` against the document returned by the GET.

        `storageCriticalPercent` must be strictly below `storageWarningPercent`,
        so the two thresholds cannot be configured into an unreachable state.

        `retentionDays` cannot be written here. Write `notificationDays` through
        `PATCH /v1/admin/console/settings`.

        Cost: one transaction. No paging.
      security:
        - ownerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsChange" }
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/NotificationSettings" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/feedback/capabilities:
    get:
      tags: [feedback]
      operationId: getFeedbackCapabilities
      summary: What this viewer may send, before the form is drawn
      description: |
        The two-level taxonomy (kind then category), the message length bounds,
        whether diagnostics can be attached, the duplicate window, the statuses a
        report can reach, and — the point of the endpoint — whether this viewer
        may submit at all.

        `canSubmit: false` with `submitBlockedReason` means a restricted or
        rate-limited profile. A client should disable its control and show the
        reason rather than letting a viewer write a message that will be refused.

        Each category declares `wantsPlaybackSession` and `wantsItem`, so a client
        knows when to offer the playback-session prefill and when to ask which
        title is affected.

        `revision` changes only when the taxonomy changes; a client may cache the
        document against it.

        Cost: one settings read plus two indexed counts. No paging.
      responses:
        "200":
          description: The capabilities.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackCapabilities" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/feedback/reports:
    post:
      tags: [feedback]
      operationId: submitFeedbackReport
      summary: Open a report, or recognise a repeat of one
      description: |
        Opens a report under a kind and a category from the capabilities
        taxonomy.

        **Duplicate detection.** If the same profile already opened a report with
        the same kind, category and affected item, whose message normalises to
        the same text, within the last 24 hours, the existing report is returned
        with `duplicate: true` and `created: false`, and the response's
        `report.id` is that earlier report. Normalisation folds case, punctuation
        and runs of whitespace, so a viewer retyping a complaint is recognised
        rather than counted twice. A duplicate still increments the report's
        `duplicates` counter, which is what tells a reviewer that the problem
        recurred.

        **Diagnostics prefill.** `playbackSessionId` is a hint, not an upload.
        The server resolves it into a reference to the playback record it already
        holds and records the decision in `report.diagnostics.decision`:

        * `attached` — resolved; `reference` names the record.
        * `declined` — a session was named but `attachDiagnostics` was false.
        * `unavailable` — the session is gone, or belongs to another viewer.
        * `not-requested` — no session was named.

        A resolved session also fills in the affected title, so a reporter does
        not have to name it. A session identifier from another viewer's playback
        always resolves to `unavailable`; it never resolves to their diagnostics.

        `operationId` is an idempotency key. Rate limit: 10 reports per profile
        per hour, then 429.

        Cost: one transaction with two indexed lookups. No paging.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackSubmission" }
      responses:
        "200":
          description: The new report, or the existing one it duplicates.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackSubmissionResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
    get:
      tags: [feedback]
      operationId: listOwnFeedbackReports
      summary: The caller's own reports
      description: |
        One page of the calling profile's reports, newest first, each with its
        status thread so a viewer can see what happened without a second request.

        Filters are the same as the administrative list; the scope is fixed to
        the caller.

        Cost: one indexed page query plus one grouped count. Cursor paging.
      parameters:
        - { $ref: "#/components/parameters/FeedbackStatus" }
        - { $ref: "#/components/parameters/FeedbackKind" }
        - { $ref: "#/components/parameters/FeedbackCategory" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The caller's reports.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackList" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/feedback/reports/{id}:
    get:
      tags: [feedback]
      operationId: getOwnFeedbackReport
      summary: One of the caller's reports with its thread
      description: |
        The report and its complete status thread — every transition, with the
        administrator's reply where one was left. A report belonging to another
        profile is 404, not 403.

        Cost: two indexed reads. The thread is capped at 200 entries.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/feedback/reports:
    get:
      tags: [feedback-admin]
      operationId: listFeedbackReports
      summary: The triage list with its status counts
      description: |
        One page of every report on the server, newest first, with
        `statusCounts` for the tab badges.

        The counts honour every filter **except** `status`, so the badges and the
        list agree: filtering to `kind=library` gives the open/in-progress/
        resolved/closed split within the library reports.

        `reporter` is a prefix match on the reporter's display name, which is
        what a reviewer has in front of them; it is intended for type-ahead.

        Owner sessions only. Filtering and sorting happen in SQL; a client should
        not page the whole table to filter locally.

        Cost: one indexed page query plus one grouped count over an indexed
        status column. Cursor paging.
      security:
        - ownerSession: []
      parameters:
        - { $ref: "#/components/parameters/FeedbackStatus" }
        - { $ref: "#/components/parameters/FeedbackKind" }
        - { $ref: "#/components/parameters/FeedbackCategory" }
        - name: reporter
          in: query
          description: Prefix match on the reporter's display name.
          schema: { type: string, maxLength: 120 }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: The triage page.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackList" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/feedback/reports/{id}:
    get:
      tags: [feedback-admin]
      operationId: getFeedbackReport
      summary: One report with its reporter and its thread
      description: |
        The full report: the message, the reporter's display name, authority and
        role, the diagnostics decision and reference, the duplicate count, and
        the complete status thread.

        Owner sessions only.

        Cost: two indexed reads. The thread is capped at 200 entries.
      security:
        - ownerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/admin/feedback/reports/{id}/status:
    post:
      tags: [feedback-admin]
      operationId: transitionFeedbackReport
      summary: Move a report's status
      description: |
        Moves the report to a new status, appends the change and any reply to the
        reporter-visible thread, writes an audit entry and notifies the reporter.

        `expectedRevision` fences the write: if another administrator moved the
        report first, nothing is written and the response is 409 carrying
        `currentRevision`. `operationId` makes a retry safe.

        The reply is visible to the reporter. The thread is capped at 200
        entries; a report at the cap returns 429.

        Owner sessions only.

        Cost: one transaction. No paging.
      security:
        - ownerSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackTransition" }
      responses:
        "200":
          description: The moved report.
          content:
            application/json:
              schema:
                type: object
                required: [scope, data]
                properties:
                  scope: { $ref: "#/components/schemas/Scope" }
                  data: { $ref: "#/components/schemas/FeedbackReport" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/Busy" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    viewerSession:
      type: http
      scheme: bearer
    ownerSession:
      type: http
      scheme: bearer
  parameters:
    Cursor:
      name: cursor
      in: query
      description: The `nextCursor` from the previous page.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 40 }
    FeedbackStatus:
      name: status
      in: query
      schema: { type: string, enum: [open, in-progress, resolved, closed] }
    FeedbackKind:
      name: kind
      in: query
      schema: { type: string, enum: [playback, library, apps, account, other] }
    FeedbackCategory:
      name: category
      in: query
      description: A category identifier from the capabilities taxonomy.
      schema: { type: string }
  responses:
    Invalid:
      description: A field or query parameter is outside its published bounds.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No session, or the session lacks the required authority on this server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such record in the caller's scope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The revision fence failed, or an idempotency key was reused with a different body. `error.currentRevision` names the revision to refresh to.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Busy:
      description: A capacity or rate limit was reached. `Retry-After` is set.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unavailable:
      description: The server could not complete the request. Retry with the same operation key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ReceiverInboxEvent:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [grant, handoff, resync] }
        receiverId: { type: string, description: Present on grant and handoff hints. }
    Scope:
      type: object
      required: [serverId, viewerFence]
      properties:
        serverId: { type: string }
        viewerFence:
          type: string
          description: A digest of the session and its epoch. A change means the response belongs to a different session than the one the client holds.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
            currentRevision: { type: integer, format: int64 }
            fields:
              type: array
              items: { type: string }
    NavigateTarget:
      type: object
      required: [view]
      properties:
        view:
          type: string
          description: An allowlisted view. The complete list is published by GET /v1/notifications/capabilities.
        entityId: { type: string }
        libraryId: { type: string }
    NotificationAction:
      type: object
      required: [kind, label]
      description: |
        Either a navigation or an allowlisted command. `target` is present only
        for `navigate`; `command` only for `command`. A client that does not
        recognise the view or the command must render the action disabled.
      properties:
        kind: { type: string, enum: [navigate, command] }
        label: { type: string, maxLength: 80 }
        target: { $ref: "#/components/schemas/NavigateTarget" }
        command:
          type: string
          enum: [retry-job, open-download, dismiss-conflict, review-device, open-feedback, run-scan]
        arguments:
          type: object
          additionalProperties: { type: string }
    Notification:
      type: object
      required: [id, audience, severity, source, category, title, body, arguments, actions, dedupeKey, revision, createdAt, updatedAt, expiresAt, readAt, archivedAt, read, archived, cursor]
      properties:
        id: { type: string }
        audience: { type: string, enum: [profile, account-admin] }
        severity: { type: string, enum: [info, warning, critical] }
        source:
          type: string
          enum: [feedback, downloads, dvr, security, scan, networking, storage, broadcast]
          description: The producer. Part of the dedupe identity, so two producers cannot collide on a key.
        category:
          type: string
          description: The event, e.g. download.finished, dvr.conflict, security.new-device, scan.failed, storage.low, feedback.received. Clients localising notifications key on this plus `arguments`.
        title: { type: string }
        body: { type: string }
        arguments:
          type: object
          additionalProperties: { type: string }
          description: Interpolation values for a localised rendering of `category`.
        actions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/NotificationAction" }
        dedupeKey:
          type: string
          description: The producer's identity for the underlying condition. A re-raise edits this record rather than adding another.
        revision: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64, description: Milliseconds since the epoch. }
        updatedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        readAt: { type: [integer, "null"], format: int64 }
        archivedAt: { type: [integer, "null"], format: int64 }
        read: { type: boolean }
        archived: { type: boolean }
        cursor: { type: string }
    NotificationCounts:
      type: object
      required: [unread, read, archived, total]
      properties:
        unread: { type: integer }
        read: { type: integer }
        archived: { type: integer }
        total: { type: integer }
    NotificationInbox:
      type: object
      required: [revision, audience, audiences, state, counts, items, nextCursor, observedAt, retentionDays]
      properties:
        revision: { type: integer, format: int64 }
        audience: { type: string }
        audiences:
          type: array
          items: { type: string }
          description: The audiences this session may read.
        state: { type: string }
        counts: { $ref: "#/components/schemas/NotificationCounts" }
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        nextCursor: { type: string }
        observedAt: { type: integer, format: int64 }
        retentionDays: { type: integer }
    NotificationSummary:
      type: object
      required: [revision, audience, counts, observedAt]
      properties:
        revision: { type: integer, format: int64 }
        audience: { type: string }
        counts: { $ref: "#/components/schemas/NotificationCounts" }
        observedAt: { type: integer, format: int64 }
    NotificationDelta:
      type: object
      required: [revision, since, resync, items, counts]
      properties:
        revision: { type: integer, format: int64 }
        since: { type: integer, format: int64 }
        resync:
          type: boolean
          description: More changed than one frame carries. Re-read GET /v1/notifications/inbox.
        items:
          type: array
          items: { $ref: "#/components/schemas/Notification" }
        counts: { $ref: "#/components/schemas/NotificationCounts" }
    NotificationBatch:
      type: object
      required: [operationId, operations]
      properties:
        operationId: { type: string, maxLength: 160 }
        expectedRevision:
          type: integer
          format: int64
          description: The revision the client last read. 0 applies regardless.
        audience: { type: string, enum: [profile, account-admin, all], default: all }
        operations:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: object
            required: [action]
            properties:
              action: { type: string, enum: [read, unread, archive, unarchive, read-all] }
              ids:
                type: array
                maxItems: 200
                items: { type: string }
                description: Required for every action except read-all, which takes none.
    NotificationBatchResult:
      type: object
      required: [revision, audience, applied, receipts, counts]
      properties:
        revision: { type: integer, format: int64 }
        audience: { type: string }
        applied: { type: integer }
        receipts:
          type: array
          items:
            type: object
            required: [action, outcome]
            properties:
              action: { type: string }
              id: { type: string }
              outcome: { type: string, enum: [applied, unchanged, not-found] }
        counts: { $ref: "#/components/schemas/NotificationCounts" }
    NotificationBroadcast:
      type: object
      required: [operationId, audience, severity, dedupeKey, title]
      properties:
        operationId: { type: string }
        audience: { type: string, enum: [profile, account-admin] }
        severity: { type: string, enum: [info, warning, critical] }
        dedupeKey:
          type: string
          maxLength: 200
          description: Re-sending the same key edits the existing notice in every inbox.
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        actions:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/NotificationAction" }
        expiresInDays: { type: integer, minimum: 0, maximum: 180, description: 0 applies the retention window. }
    NotificationBroadcastResult:
      type: object
      required: [audience, delivered, created, updated, revision, dedupeKey, ids]
      properties:
        audience: { type: string }
        delivered: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        revision: { type: integer, format: int64 }
        dedupeKey: { type: string }
        ids:
          type: array
          items: { type: string }
          description: Up to the first 50 notification identifiers written.
    NotificationSettings:
      type: object
      required: [revision, retentionDays, retentionSettingsField, storageWarningPercent, storageCriticalPercent, certificateWarningDays, maintenanceIntervalMinutes]
      properties:
        revision: { type: integer, format: int64 }
        retentionDays: { type: integer, description: Read-only here. }
        retentionSettingsField:
          type: string
          description: The settings-registry field that owns retentionDays. Always "notificationDays".
        storageWarningPercent: { type: integer, minimum: 1, maximum: 50 }
        storageCriticalPercent: { type: integer, minimum: 1 }
        certificateWarningDays: { type: integer, minimum: 1, maximum: 90 }
        maintenanceIntervalMinutes: { type: integer }
    NotificationSettingsChange:
      type: object
      required: [expectedRevision, storageWarningPercent, storageCriticalPercent, certificateWarningDays]
      properties:
        expectedRevision: { type: integer, format: int64 }
        storageWarningPercent: { type: integer, minimum: 1, maximum: 50 }
        storageCriticalPercent: { type: integer, minimum: 1, description: Must be strictly below storageWarningPercent. }
        certificateWarningDays: { type: integer, minimum: 1, maximum: 90 }
    NotificationCapabilities:
      type: object
      required: [audiences, severities, states, sources, commands, views, maxLimit, heartbeatSeconds, maxWaitSeconds]
      properties:
        audiences: { type: array, items: { type: string } }
        severities: { type: array, items: { type: string } }
        states: { type: array, items: { type: string } }
        sources: { type: array, items: { type: string } }
        commands: { type: array, items: { type: string } }
        views: { type: array, items: { type: string } }
        maxLimit: { type: integer }
        heartbeatSeconds: { type: integer }
        maxWaitSeconds: { type: integer }
    FeedbackCategoryDefinition:
      type: object
      required: [id, label, description, wantsPlaybackSession, wantsItem]
      properties:
        id: { type: string }
        label: { type: string }
        description: { type: string }
        wantsPlaybackSession: { type: boolean }
        wantsItem: { type: boolean }
    FeedbackKindDefinition:
      type: object
      required: [id, label, categories]
      properties:
        id: { type: string }
        label: { type: string }
        categories:
          type: array
          items: { $ref: "#/components/schemas/FeedbackCategoryDefinition" }
    FeedbackCapabilities:
      type: object
      required: [revision, canSubmit, kinds, maxMessageLength, minMessageLength, diagnosticsSupported, diagnosticsOptional, duplicateWindowHours, retentionDays, statuses, diagnosticsDecisions, perProfileHourlyLimit, reporterName, reporterAuthority]
      properties:
        revision: { type: string }
        canSubmit: { type: boolean }
        submitBlockedReason: { type: string }
        kinds:
          type: array
          items: { $ref: "#/components/schemas/FeedbackKindDefinition" }
        maxMessageLength: { type: integer }
        minMessageLength: { type: integer }
        diagnosticsSupported: { type: boolean }
        diagnosticsOptional: { type: boolean }
        duplicateWindowHours: { type: integer }
        retentionDays: { type: integer }
        statuses: { type: array, items: { type: string } }
        diagnosticsDecisions: { type: array, items: { type: string } }
        perProfileHourlyLimit: { type: integer }
        reporterName: { type: string }
        reporterAuthority: { type: string }
    FeedbackSubmission:
      type: object
      required: [operationId, kind, category, message]
      properties:
        operationId: { type: string }
        kind: { type: string }
        category: { type: string }
        message: { type: string, minLength: 8, maxLength: 2000, description: Unicode code points; the minimum excludes surrounding whitespace. }
        itemId: { type: string }
        playbackSessionId:
          type: string
          description: A prefill hint. The server resolves it; the client never uploads diagnostics.
        attachDiagnostics:
          type: boolean
          description: The reporter's choice. False with a session named records a "declined" decision.
    FeedbackReporter:
      type: object
      required: [name, authority, role, self]
      properties:
        name: { type: string }
        authority: { type: string }
        role: { type: string }
        self: { type: boolean }
    FeedbackDiagnostics:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [attached, unavailable, declined, not-requested] }
        reference: { type: string }
        detail: { type: string }
    FeedbackThreadEvent:
      type: object
      required: [sequence, at, revision, status, reply, actorClass]
      properties:
        sequence: { type: integer, format: int64 }
        at: { type: integer, format: int64 }
        revision: { type: integer, format: int64 }
        status: { type: string }
        reply: { type: string }
        actorClass: { type: string, enum: [viewer, admin, owner] }
    FeedbackReport:
      type: object
      required: [id, cursor, revision, status, kind, category, message, createdAt, updatedAt, expiresAt, reporter, diagnostics, duplicates, thread]
      properties:
        id: { type: string }
        cursor: { type: string }
        revision: { type: integer, format: int64 }
        status: { type: string, enum: [open, in-progress, resolved, closed] }
        kind: { type: string }
        category: { type: string }
        message: { type: string }
        itemId: { type: string, description: Omitted when the caller can no longer reach the title. }
        createdAt: { type: integer, format: int64 }
        updatedAt: { type: integer, format: int64 }
        expiresAt: { type: integer, format: int64 }
        reporter: { $ref: "#/components/schemas/FeedbackReporter" }
        diagnostics: { $ref: "#/components/schemas/FeedbackDiagnostics" }
        duplicateOf: { type: string }
        duplicates: { type: integer, description: How many times the same profile restated this report inside the window. }
        thread:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/FeedbackThreadEvent" }
    FeedbackSubmissionResult:
      type: object
      required: [report, duplicate, created]
      properties:
        report: { $ref: "#/components/schemas/FeedbackReport" }
        duplicate: { type: boolean }
        created: { type: boolean }
        duplicateOf:
          type: string
          description: Present only on a duplicate. Names the report the submission was folded into, which is also the report returned.
    FeedbackList:
      type: object
      required: [items, nextCursor, statusCounts, total, filter, observedAt]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FeedbackReport" }
        nextCursor: { type: string }
        statusCounts:
          type: object
          additionalProperties: { type: integer }
          description: Counts per status honouring every filter except status itself.
        total: { type: integer }
        filter:
          type: object
          additionalProperties: { type: string }
        observedAt: { type: integer, format: int64 }
    FeedbackTransition:
      type: object
      required: [operationId, expectedRevision, status]
      properties:
        operationId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        status: { type: string, enum: [open, in-progress, resolved, closed] }
        reply: { type: string, maxLength: 2000, description: Visible to the reporter. Length is in Unicode code points. }
