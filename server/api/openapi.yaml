      responses:
        '200': { description: The preview., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_metadata_repair, metadata_conflict, not_found]
  /v1/metadata/{kind}/{id}/art/{role}:
