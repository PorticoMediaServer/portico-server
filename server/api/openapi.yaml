        and de-duplicate it. Owner approval is what can make a marker `automaticSafe` for viewers.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisMarkerMutation' } } } }
      responses:
        '200': { description: The analysis view after the change., content: { application/json: { schema: { $ref: '#/components/schemas/AnalysisView' } } } }
        default: { $ref: '#/components/responses/AnalysisError' }
      x-error-codes: [unauthorized, invalid_analysis, analysis_conflict, analysis_clock_unavailable, analysis_unavailable, rate_limited]
