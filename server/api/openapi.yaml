      description: >-
        The holder of the direct account session. Pass a session id from
        `GET /v1/direct/sessions`, or the literal `all` to revoke every session on the account
        including the caller's own. Revocation is immediate: in-flight media reads are re-checked
        every 100ms and stop mid-transfer. Responds 204.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: 'Session id, or `all` for every session on the account.' }
      responses:
