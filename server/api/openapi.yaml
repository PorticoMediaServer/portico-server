      responses:
        '200': { description: The new preference revision., content: { application/json: { schema: { type: object, required: [protocolVersion, serverId, revision], properties: { protocolVersion: { type: string }, serverId: { type: string }, revision: { type: integer, format: int64 } } } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, channel_revision_conflict, channel_busy, guide_unavailable]
  /v1/admin/live-sources:
    get:
      operationId: listLiveSources
      tags: [live]
      summary: List live TV sources
      description: >-
        Server owner only; no query string. Returns every configured source with its channel
        mappings, tuner count, viewer-access setting and the current refresh status of each remote
        guide.
      responses:
        '200': { description: The sources and their refresh status., content: { application/json: { schema: { type: object, required: [protocolVersion, serverId, sources, refresh], properties: { protocolVersion: { type: string }, serverId: { type: string }, sources: { type: array, items: { type: object, additionalProperties: true } }, refresh: { type: array, items: { type: object, additionalProperties: true } } } } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, channel_busy, source_unavailable, guide_unavailable]
    post:
      operationId: saveLiveSource
      tags: [live]
      summary: Create or update a live TV source
      description: >-
        Server owner only; no query string. Carries the playlist and guide documents inline (bounded
        to twice the upload limit), the tuner count and any explicit channel mappings.
        `expectedRevision` fences an update and `requestId` makes it replayable. Preview first with
        `POST /v1/admin/live-sources/preview`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSourceInput' } } } }
      responses:
        '200': { description: The saved source., content: { application/json: { schema: { type: object, required: [protocolVersion, serverId, source], properties: { protocolVersion: { type: string }, serverId: { type: string }, source: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, channel_revision_conflict, source_network_policy, source_credentials_required, source_capacity_unavailable, channel_busy, source_unavailable]
  /v1/admin/live-sources/preview:
    post:
      operationId: previewLiveSource
      tags: [live]
      summary: Preview a live source before saving it
      description: >-
        Server owner only; no query string. Parses the submitted playlist and guide without storing
        anything and reports the channels, programmes and problems it found, so an owner confirms a
        described result rather than a blind save. Nothing is fetched from the network here.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LiveSourceInput' } } } }
      responses:
        '200': { description: The parse preview., content: { application/json: { schema: { type: object, required: [protocolVersion, serverId, preview], properties: { protocolVersion: { type: string }, serverId: { type: string }, preview: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, channel_busy, guide_unavailable]
  /v1/admin/live-sources/{id}/enabled:
    post:
      operationId: setLiveSourceEnabled
      tags: [live]
      summary: Enable or disable a live source
      description: >-
        Server owner only; no query string. `enabled` must be present explicitly — a missing flag is
