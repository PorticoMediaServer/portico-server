    put:
      operationId: setListeningPreferences
      tags: [preferences]
      summary: Replace the listening preferences
      description: >-
        Any authenticated viewer, for their own profile. Every field is mandatory — this is a
        whole-document write, not a patch, so an omitted field is an error rather than a silent
