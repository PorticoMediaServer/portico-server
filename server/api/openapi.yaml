      responses:
        '200': { description: The image bytes., content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '404': { description: Artwork is pending or unavailable; `Retry-After` is set when pending., content: { text/plain: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, source_unavailable]
  /v1/items/{id}/detail:
    get:
      operationId: getItemDetail
      tags: [items]
      summary: Read the composed item detail screen
      description: >-
        Any authenticated viewer with access to the item's library. One request returns everything
        a detail screen needs: the item, this viewer's personal state, the server-authored action
        list, the metadata blocks, the analysis markers this viewer is allowed to see, and — for
        movies — related rows. The viewer's permission fence is recomputed after the read and a
