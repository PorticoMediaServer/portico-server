  /v1/direct/password:
    post:
      operationId: changeDirectPassword
      tags: [direct]
      summary: Change the account password
      description: >-
        The holder of the direct account session, who must also prove the current password in the
        body. Rate limited with the other `/v1/direct` POSTs. Responds 204; existing sessions are
        not implicitly revoked, so call `DELETE /v1/direct/sessions/all` afterwards if the password
        change was a response to compromise.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currentPassword, newPassword], properties: { currentPassword: { type: string, format: password }, newPassword: { type: string, format: password } }, additionalProperties: false } } } }
      responses:
        '204': { description: The password was changed. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, conflict, persistence_error]
  /v1/direct/members:
    get:
      operationId: listDirectMembers
      tags: [direct]
      summary: List the server's direct member accounts
      description: >-
        The holder of an owner direct account session. Returns every member account on this server
        with its allowed libraries, disabled flag and revision. Members are the server's own
        accounts, independent of Hosted membership.
      responses:
        '200': { description: The member accounts., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/DirectMember' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, persistence_error]
    post:
      operationId: createDirectMember
      tags: [direct]
      summary: Create a direct member account
      description: >-
        The holder of an owner direct account session. Creates a member with a username, an initial
        password, a display name and the list of library ids they may see; an empty
        `allowedLibraries` means every library. Rate limited with the other `/v1/direct` POSTs.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectMemberInput' } } } }
      responses:
        '201': { description: The created member., content: { application/json: { schema: { $ref: '#/components/schemas/DirectMember' } } } }
