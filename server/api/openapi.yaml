openapi: 3.1.0
info:
  title: Portico Media Server HTTP API
  version: '1.0.0'
  summary: Every route served by the Portico media server, for third-party players and automations.
  description: >-
    This document is the complete, authoritative description of the HTTP surface registered by
    `server/internal/httpapi` (plus the `internal/networking` claim/remote/certificate
    routes it composes into the same mux). Standing principle 2a.1 of the Feature Depth Program
    requires every capability a first-party client has to be reachable through a documented
    endpoint, because third parties build players and library-management automations on this API;
    nothing here is client-private.


    Two namespaces are in use. `/v1` is the product surface: identity, catalogue, browsing,
    personal state, metadata administration, storage, live TV and playback (sessions,
    queues, channels). `/v1/media/...` are capability URLs, not REST resources: they are unguessable,
    grant-bound byte streams. There is no `/v2`, `/v3` or `/v4` Portico namespace; `api4.thetvdb.com/v4`
    that appears in the server source is an outbound provider URL.


    Every JSON error in this API is the same envelope:
    `{"error":{"code":"...","message":"...","retryable":true|false}}`. Some handlers add sibling
    fields next to `error` (`current`, `serverId`, `viewerFence`, `currentRevision`, `fields`,
    `serverTime`).
    Each operation lists the codes its handler can produce under `x-error-codes`.
  license:
    name: Proprietary
servers:
  - url: /
    description: The server's own origin (LAN address, Portico remote hostname, or http://localhost:32500 in development).
security:
  - bearerAuth: []
tags:
  - name: auth
    description: Session creation, the current viewer, and session teardown.
  - name: setup
    description: First-run onboarding, browser bootstrap, and Quick Connect device pairing.
  - name: sessions
    description: Direct-account session inventory and revocation.
  - name: direct
    description: Direct (server-local) accounts, profiles, members and ownership.
  - name: hosted
    description: Hosted Services attachment, wake, restrictions and offline profile selection.
  - name: libraries
    description: Library inventory, creation, scanning and library-scoped policy.
  - name: items
    description: Individual catalogue items, their artwork, detail and personal state.
  - name: content
    description: Server-composed browse surfaces — home, library content, rows, categories, workspaces.
  - name: search
    description: Cross-library search and per-viewer search history.
  - name: saved
    description: Watchlist, favourites, saved views, pins and personal history.
  - name: playlists
    description: Playlists, their entries, ordering and sharing.
  - name: collections
    description: Owner-curated collections inside one library.
  - name: playback
    description: Playback sessions, offers, chapters, media delivery and the v2 control plane.
  - name: queues
    description: v2 queues and queue-driven playback transitions.
  - name: subtitles
    description: Subtitle catalogue, acquisition, per-session selection and document delivery.
  - name: lyrics
    description: Lyric resources, acquisition, offsets and provider policy.
  - name: analysis
    description: Media analysis runs, artifacts, markers and analysis policy.
  - name: trickplay
    description: Trickplay tile sets, WebVTT thumbnail tracks and chapter images.
  - name: preferences
    description: The viewer preference registry and effective preference values.
  - name: notifications
    description: The per-viewer notification inbox.
  - name: feedback
    description: Viewer problem reports and owner triage.
  - name: live
    description: Live TV sources, the unified guide and channel preferences.
  - name: dvr
    description: Recording schedules, rules, retention and recording storage.
  - name: library-channels
    description: Channels generated from library content.
  - name: admin-console
    description: The owner operations console — settings, jobs, schedules, alerts, exports, diagnostics.
  - name: admin-libraries
    description: Owner library administration, sources, inventory and scan policy.
  - name: storage
    description: Managed mounts, remote source adapters and storage operations.
  - name: networking
    description: Portico remote access claims, endpoint proofs and automatic HTTPS.
  - name: media
    description: Grant-bound byte delivery for streams, segments, subtitles and rendered audio.
paths:
  /v1/events:
    get:
      operationId: getEvents
      tags: [notifications]
      summary: Resume the viewer's event feed
      description: >-
        One bearer-authenticated SSE stream per installation, or the same durable
        feed as a long-poll when waitSeconds is supplied. The feed currently
        carries notification.changed, owner-only operation.updated and
        library.scan.updated invalidations. Refetch the named resource under current authority;
        events do not contain its private content. Last-Event-ID resumes SSE,
        while after resumes long-poll. A cursor older than the bounded retention
        window produces stream.resync. Streams send heartbeat comments every 25
        seconds and close after 30 minutes with stream.closed.
      parameters:
        - { name: Last-Event-ID, in: header, required: false, schema: { type: string, pattern: '^[0-9]+$' } }
        - { name: after, in: query, required: false, schema: { type: string, pattern: '^[0-9]+$' }, description: Long-poll cursor only. }
        - { name: waitSeconds, in: query, required: false, schema: { type: integer, minimum: 0, maximum: 25 }, description: Presence selects long-poll instead of SSE. }
      responses:
        '200':
          description: SSE stream or long-poll page.
          content:
            text/event-stream: { schema: { type: string } }
            application/json:
              schema:
                type: object
                required: [events, nextAfter]
                properties:
                  nextAfter: { type: string }
                  events:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [id, type, at, resource, revision]
                      properties:
                        id: { type: string }
                        type: { type: string, enum: [notification.changed, operation.updated, job.updated, library.scan.updated, stream.resync] }
                        at: { type: string, format: date-time }
                        resource:
                          type: object
                          required: [kind, id]
                          properties:
                            kind: { type: string, enum: [inbox, operation, job, library, stream] }
                            id: { type: string }
                        revision: { type: string }
                        data: { type: object, additionalProperties: true, description: 'Type-specific. library.scan.updated carries LibraryScanEventData.' }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, invalid_cursor, event_stream_exists, stream_unavailable]
  /health/live:
    get:
      operationId: getHealthLive
      tags: [admin-console]
      summary: Liveness probe
      description: >-
        Unauthenticated. Returns as soon as the process is serving HTTP, before and after root
        composition. It carries no account, build, route or dependency detail, so it is safe to
        expose to a load balancer or supervisor. Callers should treat any non-200 as "restart me".
      security: []
      responses:
        '200': { description: The process is alive., content: { application/json: { schema: { type: object, required: [alive], properties: { alive: { type: boolean, const: true } } } } } }
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [admin-console]
      summary: Readiness probe
      description: >-
        Unauthenticated. Pings the state database with a one-second deadline and reports whether
        the server can answer real requests. Readiness is published only after root composition
        completed, so a 503 here means "composed but the database is not answering" or "not
        composed yet". Automations should gate their first API call on a 200 from this route.
      security: []
      responses:
        '200': { description: The server is ready., content: { application/json: { schema: { type: object, required: [ready], properties: { ready: { type: boolean, const: true } } } } } }
        '503': { description: The state database is unavailable., content: { application/json: { schema: { type: object, required: [ready], properties: { ready: { type: boolean, const: false } } } } } }
  /v1/system:
    get:
      operationId: getSystemInfo
      tags: [setup]
      summary: Server identity and build
      description: >-
        Unauthenticated, and the correct first call for any client or automation. It returns the
        stable server id and name, whether first-run setup still has to happen, whether Hosted
        Services are configured for this server, and the build fingerprint. A client uses
        `setupRequired` to decide between the onboarding flow and a sign-in flow, and
        `hostedConfigured` to decide whether hosted attach is offered alongside direct sign-in.
      security: []
      responses:
        '200': { description: Server identity., content: { application/json: { schema: { $ref: '#/components/schemas/SystemInfo' } } } }
  /v1/attribution:
    get:
      operationId: listAttributionNotices
      tags: [setup]
      summary: Metadata provider attribution notices
      description: >-
        Unauthenticated. Returns the attribution notices that any client displaying Portico
        metadata or artwork must surface — TMDB, TheTVDB, MusicBrainz and the Cover Art Archive.
        Third-party players are expected to render these verbatim somewhere reachable from the UI.
      security: []
      responses:
        '200': { description: Provider notices., content: { application/json: { schema: { type: object, required: [providers], properties: { providers: { type: array, items: { type: object, required: [name, notice, url], properties: { name: { type: string }, notice: { type: string }, url: { type: string, format: uri } } } } } } } } }
  /v1/setup:
    post:
      operationId: completeSetup
      tags: [setup]
      summary: Create the first owner account
      description: >-
        Unauthenticated but heavily fenced: it is rate limited per peer address (10/minute), it
        requires a `setupToken` obtained from `POST /v1/setup/browser` for browser callers, and the
        recovery-route check refuses a non-private peer. It is answered only while the server still
        reports `setupRequired`. The response is the first owner's authorization session.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SetupOptions' } } } }
      responses:
        '201': { description: The owner account and its first session., content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [invalid_request, rate_limited, unauthorized, slow_down, authorization_pending, conflict, authentication_busy, persistence_error]
  /v1/setup/browser:
    post:
      operationId: startBrowserSetup
      tags: [setup]
      summary: Mint a browser setup token
      description: >-
        Unauthenticated, but only a browser on the same machine or LAN may call it: the transport
        peer must be loopback/private, the `Host` and `Origin` must both be local names, the
        `Origin` must be same-origin or configured, and the body must be an empty JSON object sent
        as `application/json`. It returns the server id plus a short-lived `setupToken` to pass to
        `POST /v1/setup`. Rate limited to 10 per minute per peer.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: Setup token., content: { application/json: { schema: { type: object, required: [serverId, setupToken], properties: { serverId: { type: string }, setupToken: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited]
  /v1/setup/resume:
    post:
      operationId: resumeSetup
      tags: [setup]
      summary: Resume an interrupted setup
      description: >-
        Unauthenticated, rate limited to 20 per minute per peer. Given the `requestId` and
        `setupToken` from an interrupted first-run, it returns the current onboarding state so a
        reloaded browser tab or a restarted installer can continue where it stopped rather than
        starting a second owner account.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [requestId, setupToken], properties: { requestId: { type: string }, setupToken: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: Onboarding state., content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingState' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, slow_down]
  /v1/setup/state:
    get:
      operationId: getSetupState
      tags: [setup]
      summary: Read onboarding state
      description: >-
        Requires a bearer token for the **local** owner specifically; a Hosted owner token is
        refused, because bootstrap and recovery must never be driven by an account this server does
        not itself control. Returns the onboarding phase, whether the recovery owner is confirmed,
        whether remote recovery is enabled, and the revision to pass to the finish/remote-recovery
        calls.
      responses:
        '200': { description: Onboarding state., content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingState' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, persistence_error]
  /v1/setup/finish:
    post:
      operationId: finishSetup
      tags: [setup]
      summary: Mark onboarding complete
      description: >-
        Local owner only. Optimistically concurrent: `revision` must equal the revision last read
        from `GET /v1/setup/state` (it is serialised as a JSON string). On success the server
        leaves the onboarding phase and normal sign-in becomes the only entry point.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingCommand' } } } }
      responses:
        '200': { description: The onboarding state after finishing., content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingState' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, conflict, persistence_error]
  /v1/setup/remote-recovery:
    post:
      operationId: setRemoteRecovery
      tags: [setup]
      summary: Enable or disable remote recovery sign-in
      description: >-
        Local owner only. Turns on (or off) the ability to sign the recovery owner in from outside
        the private network; enabling it requires `warningConfirmed` because it widens where the
        recovery account can be used. `revision` is the optimistic-concurrency fence from
        `GET /v1/setup/state`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingCommand' } } } }
      responses:
        '200': { description: The onboarding state after the change., content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingState' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, conflict, persistence_error]
  /v1/quick-connect:
    post:
      operationId: startQuickConnect
      tags: [setup]
      summary: Begin a Quick Connect pairing
      description: >-
        Unauthenticated, called by the device that wants to be signed in (a TV, a console, a
        headless automation). It returns a user code to display and a device code to poll with.
        Rate limited to 10 per minute per peer with a five-second server deadline.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuickStart' } } } }
      responses:
        '201': { description: The pairing request., content: { application/json: { schema: { $ref: '#/components/schemas/QuickConnectRequest' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [invalid_request, rate_limited, slow_down, unauthorized]
  /v1/quick-connect/review:
    post:
      operationId: reviewQuickConnect
      tags: [setup]
      summary: Look up a pending Quick Connect code
      description: >-
        Local owner only, rate limited per peer **and** per account (10 per minute each). The owner
        types the user code the waiting device is displaying and gets back what that device claims
        to be — name, platform, app version — so the approval decision is made against a described
        device rather than a bare code.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [userCode], properties: { userCode: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: The pending device., content: { application/json: { schema: { $ref: '#/components/schemas/QuickConnectReview' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, not_found]
  /v1/quick-connect/decision:
    post:
      operationId: decideQuickConnect
      tags: [setup]
      summary: Approve or deny a Quick Connect request
      description: >-
        Local owner only, rate limited per peer and per account. `decision` is `approve` or `deny`;
        both `requestId` and `userCode` must match the reviewed request so an owner cannot approve a
        different device than the one they read. Returns 204 with no body — the waiting device
        learns the outcome from its own token poll.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuickConnectDecision' } } } }
      responses:
        '204': { description: The decision was recorded. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, not_found, conflict]
  /v1/quick-connect/token:
    post:
      operationId: pollQuickConnectToken
      tags: [setup]
      summary: Poll a Quick Connect device code for a session
      description: >-
        Unauthenticated, called in a loop by the waiting device with its `deviceCode`. Until the
        owner decides, the server answers `authorization_pending` (or `slow_down` with a
        `Retry-After`); after approval it answers with the device's own authorization session. The
        recovery-route rule still applies, so a recovery owner cannot be paired from a public peer.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [deviceCode], properties: { deviceCode: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: The approved session., content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [authorization_pending, slow_down, rate_limited, invalid_request, unauthorized, not_found]
  /v1/quick-connect/cancel:
    post:
      operationId: cancelQuickConnect
      tags: [setup]
      summary: Abandon a Quick Connect device code
      description: >-
        Unauthenticated, called by the waiting device when the viewer backs out. The device code is
        invalidated so a later approval cannot mint a session for a screen nobody is watching.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [deviceCode], properties: { deviceCode: { type: string } }, additionalProperties: false } } } }
      responses:
        '204': { description: The request was cancelled. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [invalid_request, not_found, rate_limited]
  /v1/sessions:
    post:
      operationId: createSession
      tags: [auth]
      summary: Sign in with a username and password
      description: >-
        Unauthenticated and rate limited (20 per minute per peer address). This is the compatibility
        sign-in that returns a ready-to-use viewer session in one call; `POST /v1/direct/sign-in`
        is the richer flow that returns an account session for profile selection. The returned
        token goes in `Authorization: Bearer` on every other call.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses:
        '200': { description: The viewer session., content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, profile_selection_required, profile_pin_invalid, profile_pin_locked, authentication_busy]
  /v1/me:
    get:
      operationId: getCurrentViewer
      tags: [auth]
      summary: Identify the bearer token's viewer
      description: >-
        Any authenticated viewer. Returns the account id, profile id, server id, authority
        (`local` or `hosted`) and role carried by the presented token. Clients use it to confirm a
        stored token is still live and to learn whether the viewer is an owner before showing
        administrative surfaces.
      responses:
        '200': { description: The viewer., content: { application/json: { schema: { type: object, required: [viewer], properties: { viewer: { $ref: '#/components/schemas/Viewer' } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, authentication_busy, persistence_error]
  /v1/sessions/current:
    delete:
      operationId: logoutSessionFamily
      tags: [auth]
      summary: Sign out and revoke the whole token family
      description: >-
        Any bearer token that is authentic for a session family, including a retired or expired
        generation — deliberately, so a client holding a stale token can still sign itself out. It
        accepts no query string and no request body of any kind, and revokes every generation of the
        family, not just the presented token. Responds 204 on success.
      responses:
        '204': { description: The session family was revoked. }
        '400': { description: A query string or request body was sent., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '401': { description: The token is missing or not authentic., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '405': { description: A method other than DELETE was used. }
        '503': { description: Sign-out could not be confirmed; retry., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
      x-error-codes: [invalid_logout_request, unauthorized, session_logout_unavailable]
  /v1/hosted/wake:
    post:
      operationId: wakeHosted
      tags: [hosted]
      summary: Accept a signed wake from Hosted Services
      description: >-
        Unauthenticated at the bearer layer: authority comes entirely from the signature on the
        submitted Hosted envelope, which this server verifies against the Hosted authority key it
        was configured with. Hosted calls it to tell a sleeping server that membership or policy
        changed. Returns 202 with no body.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/HostedSigned' } } } }
      responses:
        '202': { description: The wake was accepted. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [invalid_request, unauthorized]
  /v1/hosted/restrictions:
    post:
      operationId: applyHostedRestrictions
      tags: [hosted]
      summary: Report a profile restriction to Hosted (gone)
      description: >-
        Removed with server-owned membership (migration 0120). Always answers 410 `moved`; a
        Portico Account signs in with `POST /v1/direct/sign-in {porticoIdentity}`.
      security: []
      responses:
        '410': { description: Gone., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
      x-error-codes: [moved]
  /v1/hosted/attach:
    post:
      operationId: attachHostedTicket
      tags: [hosted]
      summary: Exchange a Hosted ticket for a server session (gone)
      description: >-
        Removed with server-owned membership (migration 0120). Always answers 410 `moved`; a
        Portico Account signs in with `POST /v1/direct/sign-in {porticoIdentity}`.
      security: []
      responses:
        '410': { description: Gone., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
      x-error-codes: [moved]
  /v1/hosted/profiles/offline-select:
    post:
      operationId: selectHostedProfileOffline
      tags: [hosted]
      summary: Select a hosted profile from a signed offline proof (gone)
      description: >-
        Removed with server-owned membership (migration 0120). Always answers 410 `moved`; a
        Portico Account signs in with `POST /v1/direct/sign-in {porticoIdentity}`.
      security: []
      responses:
        '410': { description: Gone., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
      x-error-codes: [moved]
  /v1/direct/sign-in:
    post:
      operationId: directSignIn
      tags: [direct]
      summary: Sign in to a direct (server-local) account
      description: >-
        Unauthenticated and rate limited with the other `POST /v1/direct/*` routes. Returns an
        *account* session — not yet a viewer session — which is the token used for every other
        `/v1/direct` call. A client then lists profiles and calls
        `POST /v1/direct/profiles/{id}/select` to obtain the viewer token used for the rest of the
        API.

        A Portico Account member sends `porticoIdentity` instead of a username and password: a
        Hosted identity assertion for this server that answers a challenge from
        `POST /v1/direct/portico-challenge`, verified offline against the pinned Hosted root.
        Membership is this server's own: a proven account that is not a member gets
        `access_refused`; a server clock far from Hosted's, `clock_skew`.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [ { $ref: '#/components/schemas/Credentials' }, { $ref: '#/components/schemas/PorticoIdentitySignIn' } ] } } } }
      responses:
        '200': { description: The account session and its profiles., content: { application/json: { schema: { $ref: '#/components/schemas/DirectAccountSession' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, access_refused, clock_skew, invalid_request, rate_limited, authentication_busy, persistence_error]
  /v1/direct/portico-challenge:
    post:
      operationId: porticoChallenge
      tags: [direct]
      summary: Issue a challenge for a Portico identity assertion
      description: >-
        Unauthenticated and rate limited with the other `POST /v1/direct/*` routes. Returns a
        single-use challenge bound to the calling installation (`X-Portico-Installation-Id`), valid
        for five minutes, and `proof`: a `portico.challenge-proof` signed with this server's identity
        key over the challenge, the client's `nonce` (32 random bytes, base64url) and the
        installation. The client checks the proof against the server id it meant to reach (the id
        is the key's digest) before it has Hosted sign the challenge into an identity assertion
        (`POST /v1/servers/{id}/identity` on Hosted), and then signs in with that assertion. A
        request without a nonce (an app from before signed challenges) answers 400
        `client_update_required`.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [nonce], properties: { nonce: { type: string } }, additionalProperties: false } } } }
      responses:
