        `requestId` apply.
      parameters:
        - $ref: '#/components/parameters/LibraryChannelId'
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { requestId: { type: string }, expectedRevision: { type: integer, format: int64 }, boundary: { type: string, description: Where the regenerated schedule may take effect. } }, additionalProperties: false } } } }
      responses:
        '200': { description: The regenerated channel., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_changed, channel_in_use, library_channels_unavailable]
  /v1/admin/library-channels/{id}/delete:
    post:
      operationId: deleteLibraryChannel
      tags: [library-channels]
      summary: Delete a library channel
      description: >-
        Server owner only. Modelled as a POST because it carries `expectedRevision` and `requestId`.
        A channel someone is currently watching answers `channel_in_use`.
      parameters:
        - $ref: '#/components/parameters/LibraryChannelId'
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { requestId: { type: string }, expectedRevision: { type: integer, format: int64 } }, additionalProperties: false } } } }
      responses:
        '200': { description: Whether the channel was deleted., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_changed, channel_in_use, library_channels_unavailable]
  /v1/admin/library-channels/templates:
    get:
      operationId: listLibraryChannelTemplates
      tags: [library-channels]
      summary: List library-channel templates
      description: >-
        Server owner only. Templates are ready-made channel ideas — "all my 90s movies", "this
        show, in order" — and the server filters them to the ones this library actually supports, so
        a template that would produce nothing is not offered.
      responses:
        '200': { description: The applicable templates., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, library_channels_unavailable]
  /v1/admin/library-channels/templates/{id}/install:
    post:
      operationId: installLibraryChannelTemplate
      tags: [library-channels]
      summary: Create a channel from a template
      description: >-
        Server owner only. Instantiates the template into a real channel in the given `timezone`.
        A template that matches nothing in this server's libraries answers `template_inapplicable`
        rather than creating an empty channel. `requestId` makes the install replayable.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Template id. }
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { requestId: { type: string }, timezone: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: The created channel., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, template_inapplicable, library_channel_no_libraries, library_channels_unavailable]
  /v1/library-channels/preferences:
    post:
      operationId: setLibraryChannelPreference
      tags: [library-channels]
      summary: Favourite or hide a library channel
      description: >-
        Any authenticated viewer with server membership, for their own profile. The library-channel
        counterpart of `POST /v1/channels/preferences`, with the same `favorite`/`hidden` flags,
        `expectedRevision` fence and `requestId` idempotency key.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChannelPreferenceInput' } } } }
      responses:
        '200': { description: The new preference revision., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_changed, library_channels_unavailable]
  /v1/networking/identity-proof:
    post:
      operationId: proveServerIdentity
      tags: [networking]
      summary: Answer a Portico remote identity challenge
      description: >-
        Unauthenticated at the bearer layer: the caller is the Portico remote authority, and the
        exchange is authenticated by the server's own signing key rather than by a session. It
        proves that the host answering at a claimed hostname really is this server, which is what
        stops a name from being pointed at somebody else's machine. Registered only when a routing
        identity handler is composed.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: The signed identity challenge. } } } }
      responses:
        '200': { description: The signed proof., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request]
  /v1/networking/claim:
    get:
      operationId: getNetworkingClaim
      tags: [networking]
      summary: Read the remote-access claim status
      description: >-
        Local server owner only — a hosted owner cannot claim a name for this machine, and no cookie
        grants it; when an `Origin` is present it must be one of the configured origins. Returns the
        current claim, the hostname, the generation and what step is outstanding. Fifteen-second
        deadline.
      responses:
        '200': { description: The claim status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/prepare:
    post:
      operationId: prepareNetworkingClaim
      tags: [networking]
      summary: Begin claiming a Portico remote hostname
      description: >-
        Local server owner only. Starts the claim exchange with the remote authority and returns
        what the owner must confirm next. The owner's live session family is re-checked inside the
        claim transaction, so a revoked owner cannot complete a claim they started.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: The claim preparation request. } } } }
      responses:
        '200': { description: The claim status after the step., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/approve:
    post:
      operationId: approveNetworkingClaim
      tags: [networking]
      summary: Approve a prepared claim
      description: >-
        Local server owner only. Carries the owner's signed approval of the exact prepared claim —
        the body is canonicalised and duplicate or aliased fields are rejected, so the signed
        envelope is byte-for-byte what was approved.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: The signed claim approval. } } } }
      responses:
        '200': { description: The claim status after approval., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/web-approval:
    post:
      operationId: beginNetworkingWebClaimApproval
      tags: [networking]
      summary: Request web approval for a prepared server claim
      description: Local server owner only. Registers a signed pending claim with Hosted and returns approvalUrl and claimCode in the claim status. The URL places the code in its fragment.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: Expected operation and claim revision. } } } }
      responses:
        '200': { description: Claim status with approval URL., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/await-approval:
    post:
      operationId: awaitNetworkingWebClaimApproval
      tags: [networking]
      summary: Complete a server claim when Hosted pushes the web decision
      description: Local server owner only. Holds one response for the pending decision, rechecks local owner and claim authority, then completes the finite claim coordinator. No client or server polling is required.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: Expected operation and claim revision. } } } }
      responses:
        '200': { description: Final claim status or approval_closed/approval_changed., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/continue:
    post:
      operationId: continueNetworkingClaim
      tags: [networking]
      summary: Continue an in-progress claim
      description: >-
        Local server owner only. Advances a claim that is waiting on the remote authority — for
        example after DNS propagation — and returns the updated status. Safe to call repeatedly.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The claim status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/cancel:
    post:
      operationId: cancelNetworkingClaim
      tags: [networking]
      summary: Abandon an in-progress claim
      description: Local server owner only. Cancels the outstanding claim and returns the status afterwards. A completed claim cannot be cancelled this way.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The claim status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/claim/endpoint:
    post:
      operationId: registerNetworkingEndpoint
      tags: [networking]
      summary: Register a reachable endpoint for the claim
      description: >-
        Local server owner only. Registers an address at which this server can be reached, to be
        published for the claimed hostname. Registration alone proves nothing — the endpoint must
        then answer `POST /v1/networking/endpoint-proof`.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The registration result., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/endpoint-proof:
    post:
      operationId: proveNetworkingEndpoint
      tags: [networking]
      summary: Answer an endpoint reachability challenge
      description: >-
        Unauthenticated at the bearer layer: the caller is the remote authority verifying that the
        registered endpoint really reaches this server, matched against a pending registration. It
        is what turns a claimed address into a published one.
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The proof response., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [invalid_request, claim_unavailable]
  /v1/networking/remote:
    get:
      operationId: getRemoteAccessStatus
      tags: [networking]
      summary: Read remote-access state
      description: >-
        Local server owner only (the same management authorizer as the claim routes). Returns the
        authority, generation, state, candidate paths, port mappings and the LAN/public topology the
        server believes it has. Eight-second deadline.
      responses:
        '200': { description: The remote-access status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_unavailable]
  /v1/networking/remote/config:
    post:
      operationId: configureRemoteAccess
      tags: [networking]
      summary: Change the remote-access configuration
      description: >-
        Local server owner only. Sets the authority and the remote configuration — which access
        paths are permitted, port mapping preferences and so on — then returns the refreshed status,
        so the owner sees the effect of the change without a second read.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [authorityId, config], properties: { authorityId: { type: string }, config: { type: object, additionalProperties: true } }, additionalProperties: false } } } }
      responses:
        '200': { description: The status after configuration., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/remote/check:
    post:
      operationId: checkRemoteAccess
      tags: [networking]
      summary: Re-check remote reachability now
      description: >-
        Local server owner only. Forces a fresh reachability probe instead of waiting for the next
        scheduled check, and returns the resulting status. This is the button an owner presses after
        changing a router.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The status after the check., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_unavailable]
  /v1/networking/certificate:
    get:
      operationId: getCertificateStatus
      tags: [networking]
      summary: Read the automatic HTTPS certificate status
      description: >-
        Local server owner only. Returns the certificate's namespace, environment, issuer, order
        state, expiry and any outstanding retry window. Ten-second deadline.
      responses:
        '200': { description: The certificate status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_unavailable]
  /v1/networking/certificate/config:
    post:
      operationId: configureCertificate
      tags: [networking]
      summary: Change the automatic HTTPS configuration
      description: >-
        Local server owner only. Sets the issuer and environment for automatic certificates and
        returns the refreshed status. Changing the configuration wakes the certificate worker but
        never bypasses a durable `Retry-After` an issuer has imposed.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [authorityId, config], properties: { authorityId: { type: string }, config: { type: object, additionalProperties: true } }, additionalProperties: false } } } }
      responses:
        '200': { description: The status after configuration., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_conflict, claim_unavailable]
  /v1/networking/certificate/retry:
    post:
      operationId: retryCertificate
      tags: [networking]
      summary: Wake the certificate worker
      description: >-
        Local server owner only. Coalesced: it asks the worker to look again, and deliberately does
        **not** bypass a durable retry window or manufacture a new idempotency key for an unresolved
        order, so pressing it repeatedly cannot get the server rate-limited by the issuer.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
      responses:
        '200': { description: The certificate status., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/NetworkingError' }
      x-error-codes: [owner_required, invalid_request, claim_unavailable]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The current authorization session, issued by sign-in, hosted attach, profile selection or
        Quick Connect. It is re-validated transactionally on every request: library permission,
        session-family liveness and, for owners, the authority horizon are all checked inside the
        transaction that answers the request, so a revocation takes effect immediately rather than
        at the next token expiry.
  parameters:
    LibraryId: { name: id, in: path, required: true, schema: { type: string }, description: Library id. }
    ItemId: { name: id, in: path, required: true, schema: { type: string }, description: Catalogue item id. }
    ShowId: { name: id, in: path, required: true, schema: { type: string }, description: Show id. }
    SourceId: { name: source, in: path, required: true, schema: { type: string }, description: Library source id. }
    LiveSourceId: { name: id, in: path, required: true, schema: { type: string }, description: Live TV source id. }
    LibraryChannelId: { name: id, in: path, required: true, schema: { type: string }, description: Library channel id. }
    RecordingId: { name: id, in: path, required: true, schema: { type: string }, description: Recording id. }
    PlaybackId: { name: playbackId, in: path, required: true, schema: { type: string }, description: Playback session id. }
    Grant: { name: grant, in: path, required: true, schema: { type: string }, description: Opaque, unguessable media grant issued with a playback session. }
    MetadataKind: { name: kind, in: path, required: true, schema: { type: string, enum: [item, album, show, artist, book, season] }, description: Catalogue entity kind. }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string }, description: 'Opaque continuation cursor from the previous page''s `nextCursor`. Never construct one; a cursor the server does not recognise answers `invalid_cursor`.' }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1 }, description: 'Page size. Browse, search and home clamp to their maxima; other catalogue lists reset an out-of-range limit to the 40 default. Console and admin reads use ConsoleLimit and reject out-of-range values with 400.' }
    ConsoleLimit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 40, default: 40 }, description: Page size, 1–40. }
    AnalysisSourceId: { name: sourceId, in: query, required: false, schema: { type: string, maxLength: 256 }, description: Pin the read to one analysed source. }
    AnalysisSourceRevision: { name: sourceRevision, in: query, required: false, schema: { type: string, maxLength: 256 }, description: Pin the read to one source revision. }
    AnalysisMappingRevision: { name: mappingRevision, in: query, required: false, schema: { type: string, maxLength: 256 }, description: Pin the read to one timeline mapping revision. }
    AnalysisSessionId: { name: sessionId, in: query, required: false, schema: { type: string, maxLength: 256 }, description: Resolve against the source a playback session is using. }
    AnalysisGeneration: { name: generation, in: query, required: false, schema: { type: integer, format: int64, minimum: 0 }, description: Session generation. }
  responses:
    Error:
      description: >-
        The standard error envelope. `code` is a stable machine-readable string, `message` is
        human-readable and already safe to show, and `retryable` says whether repeating the same
        request unchanged could succeed. Some handlers add sibling fields beside `error` — `current`,
        `serverId`, `viewerFence`, `itemId`, `currentRevision`, `fields` or `serverTime`. See each
        operation's `x-error-codes` for the codes it can produce.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    SubtitleError:
      description: 'The standard error envelope with subtitle codes. 503 responses carry `Retry-After: 2`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LyricsError:
      description: The standard error envelope with lyric codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AnalysisError:
      description: The standard error envelope with media-analysis codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ConsoleError:
      description: >-
        The standard error envelope with console codes. A `console_conflict` adds `currentRevision`
        and a validation failure adds `fields` (the rejected field paths) inside `error`. 429
        responses carry `Retry-After: 60`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConsoleErrorEnvelope' }
    LiveError:
      description: The standard error envelope with live-channel codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    LibraryChannelError:
      description: The standard error envelope with library-channel codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    DVRError:
      description: 'The standard error envelope with DVR codes; always sent `Cache-Control: no-store`.'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NetworkingError:
      description: The standard error envelope with networking claim codes. Transport detail is never included, because it can disclose a private target.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    LibraryScanEventData:
      type: object
      additionalProperties: false
      required: [state, found]
      properties:
        state: { type: string, enum: [started, progress, finished] }
        found: { type: integer, minimum: 0 }
    LibraryMetadataAgent:
      type: object
      required: [libraryId, libraryKind, revision, agent, agents]
      properties:
        libraryId: { type: string }
        libraryKind: { type: string }
        revision: { type: integer, format: int64 }
        agent: { type: string, description: 'The selected source: `online` or `local` (more may be added).' }
        language: { type: string, description: "The library's current metadata language (movie, TV and anime libraries). Older libraries may hold a regional tag such as en-US." }
        agents:
          type: array
          description: The sources this library kind can choose, the default first.
          items: { $ref: '#/components/schemas/LibraryMetadataAgentOption' }
    LibraryMetadataAgentOption:
      type: object
      required: [id, name, description, providers, languages]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        providers: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string, pattern: '^[a-z]{2}$' }, description: 'Metadata languages this source can fetch, ISO 639-1; empty when it has no language choice.' }
        defaultLanguage: { type: string, pattern: '^[a-z]{2}$', description: Present when languages is non-empty. }
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code: { type: string, description: Stable machine-readable error code. }
        message: { type: string, description: Human-readable message, already safe to display. }
        retryable: { type: boolean, description: Whether repeating the identical request could succeed. }
        serverTime: { type: string, format: date-time, description: Present on storage, remote-source and activity failures. }
        confirmRoots: { type: array, maxItems: 8, items: { type: string }, description: 'Only with source_lan_confirmation_required: the LAN roots the owner must confirm, to send back unchanged in confirmedLanRoots.' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }
      additionalProperties: true
    ConsoleErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          allOf:
            - { $ref: '#/components/schemas/Error' }
            - type: object
              properties:
                currentRevision: { type: integer, format: int64, description: Present on `console_conflict`; the revision to retry with. }
                fields: { type: array, items: { type: string }, description: Present on validation failures; the rejected field paths. }
    SystemInfo:
      type: object
      required: [id, name, setupRequired, hostedConfigured]
      properties:
        id: { type: string, description: Stable server id. }
        name: { type: string }
        setupRequired: { type: boolean, description: True until the first owner account exists. }
        hostedConfigured: { type: boolean, description: Whether Hosted Services are configured for this server. }
        version: { type: string }
        buildId: { type: string }
        sourceDigest: { type: string }
        builtAt: { type: string }
    Viewer:
      type: object
      description: identity.Viewer
      required: [accountId, profileId, serverId, authority, role]
      properties:
        accountId: { type: string }
        profileId: { type: string }
        serverId: { type: string }
        authority: { type: string, enum: [local, hosted], description: Whether the account is this server's own or a Hosted account. }
        role: { type: string, enum: [owner, member], description: '`owner` unlocks the administrative surfaces.' }
    AuthSession:
      type: object
      description: 'identity.Envelope — an issued authorization session. Send `accessToken` as `Authorization: Bearer <accessToken>`.'
      required: [accessToken, expiresAt, viewer, sessionFamilyId, tokenGeneration, authorizationHorizon]
      properties:
        accessToken: { type: string, description: 'The bearer token, 43–2048 characters.' }
        expiresAt: { type: string, format: date-time }
        viewer: { $ref: '#/components/schemas/Viewer' }
        sessionFamilyId: { type: string, description: The token family. Every generation of a family shares it, and signing out revokes the whole family. }
        tokenGeneration: { type: string, description: This token's generation within the family, serialised as a JSON string. A rotated token is a new generation, not a new device. }
        authorizationHorizon: { type: string, format: date-time, description: How long this authority may be relied on before it must be renewed. }
        serverIdentity: { type: [object, 'null'], required: [publicKey, fingerprint], properties: { publicKey: { type: string }, fingerprint: { type: string } }, description: identity.NativeServerIdentity, for clients that pin the server key. }
    SignedEnvelope:
      type: object
      description: A Hosted-signed document (payload, signature, keyId, certificate), verified against the pinned Hosted root.
      required: [payload, signature, keyId]
      properties:
        payload: { type: string }
        signature: { type: string }
        keyId: { type: string }
        certificate: { type: object }
    PorticoIdentitySignIn:
      type: object
      required: [porticoIdentity]
      properties:
        porticoIdentity: { $ref: '#/components/schemas/SignedEnvelope' }
      additionalProperties: false
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
      additionalProperties: false
    SetupOptions:
      type: object
      description: identity.SetupOptions
      required: [setupToken, username, password, name]
      properties:
        requestId: { type: string }
        setupToken: { type: string, description: From `POST /v1/setup/browser`. }
        username: { type: string }
        password: { type: string, format: password }
        name: { type: string, description: Server display name. }
        authMode: { type: string }
        recoverySaved: { type: boolean }
        interactive: { type: boolean }
      additionalProperties: false
    OnboardingState:
      type: object
      description: identity.OnboardingState
      required: [authMode, phase, ready, recoveryOwner, recoveryConfirmed, remoteRecovery, claimInstalled, revision, sessionLabel]
      properties:
        authMode: { type: string }
        phase: { type: string }
        ready: { type: boolean }
        recoveryOwner: { type: boolean }
        recoveryConfirmed: { type: boolean }
        remoteRecovery: { type: boolean }
        claimInstalled: { type: boolean }
        revision: { type: string, description: Optimistic-concurrency fence, serialised as a JSON string. }
        sessionLabel: { type: string }
    OnboardingCommand:
      type: object
      required: [revision]
      properties:
        revision: { type: string, description: The revision from `GET /v1/setup/state`, as a JSON string. }
        enabled: { type: boolean, description: Remote recovery on or off. }
        warningConfirmed: { type: boolean, description: Required to enable remote recovery. }
      additionalProperties: false
    QuickStart:
      type: object
      description: identity.QuickStart
      required: [requestId, deviceName]
      properties:
        requestId: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        appVersion: { type: string }
      additionalProperties: false
    QuickConnectRequest:
      type: object
      description: identity.QuickAuthorization
      required: [deviceCode, userCode, verificationUri, verificationUriComplete, expiresAt, expiresIn, interval]
      properties:
        deviceCode: { type: string, description: Secret the waiting device polls with; never display it. }
        userCode: { type: string, description: Short code to display to the viewer. }
        verificationUri: { type: string, format: uri, description: Where the owner goes to approve. }
        verificationUriComplete: { type: string, format: uri, description: The same URI with the user code embedded, for a QR code. }
        expiresAt: { type: string, format: date-time }
        expiresIn: { type: integer, description: Seconds until the request expires. }
        interval: { type: integer, description: Minimum seconds between token polls. }
    QuickConnectReview:
      type: object
      description: identity.QuickPreview — what the waiting device claims to be.
      required: [requestId, userCode, deviceName, platform, appVersion, expiresAt]
      properties:
        requestId: { type: string }
        userCode: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        appVersion: { type: string }
        expiresAt: { type: string, format: date-time }
    QuickConnectDecision:
      type: object
      required: [requestId, userCode, decision]
      properties:
        requestId: { type: string }
        userCode: { type: string }
        decision: { type: string, enum: [approve, deny] }
      additionalProperties: false
    HostedSigned:
      type: object
      description: 'hosted.Signed: a payload with the Hosted authority''s detached signature.'
      additionalProperties: true
    HostedRestriction:
      type: object
      required: [accountId, profileId]
      properties:
        accountId: { type: string }
        profileId: { type: string }
        allowedLibraries: { type: array, items: { type: string }, description: Library ids; an empty list means every library. }
        revoked: { type: boolean, description: Revoke the member entirely. }
      additionalProperties: false
    DirectSnapshot:
      type: object
      description: identity.DirectSnapshot — the account and its profiles.
      required: [authority, serverId, account, profiles, canManage]
      properties:
        authority: { type: string, const: local }
        serverId: { type: string }
        account: { $ref: '#/components/schemas/DirectAccount' }
        profiles: { type: array, items: { $ref: '#/components/schemas/DirectProfile' } }
        canManage: { type: boolean, description: Whether this account may administer the server. }
        custodyPending: { type: boolean, description: "The owner is a Portico Account but Hosted's custody of the server's claim is not with it: accept it with POST /v1/direct/ownership/custody." }
    DirectAccountSession:
      description: >-
        identity.DirectSignIn — the account snapshot plus the account-session token. `accountToken`
        is what every other `/v1/direct` route takes as its bearer; it is not a viewer session.
        `session` is present only when the server could select a profile without asking, and then it
        already carries the viewer token.
      allOf:
        - { $ref: '#/components/schemas/DirectSnapshot' }
        - type: object
          required: [accountToken, accountExpiresAt]
          properties:
            accountToken: { type: string, description: Bearer token for the `/v1/direct` routes. }
            accountExpiresAt: { type: string, format: date-time }
            session: { oneOf: [{ $ref: '#/components/schemas/AuthSession' }, { type: 'null' }] }
    DirectSelectionResult:
      type: object
      description: identity.DirectSelectionResult
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/AuthSession' }
        trustedSelection: { type: [object, 'null'], additionalProperties: true, description: The trust token issued when `trust` was requested, letting this installation skip the PIN next time. }
    DirectAccount:
      type: object
      description: identity.DirectAccount
      required: [id, username, primaryProfileId, role, revision, disabled, allowedLibraries]
      properties:
        id: { type: string }
        username: { type: string }
        primaryProfileId: { type: string }
        role: { type: string, enum: [owner, member] }
        revision: { type: integer, format: int64, description: Optimistic-concurrency fence for member and ownership writes. }
        disabled: { type: boolean }
        allowedLibraries: { type: array, items: { type: string }, description: An empty list means every library. }
    DirectProfile:
      type: object
      description: identity.DirectProfile
      required: [id, name, primary, position, art, revision, pinRevision, pinRequired, allowedLibraries]
      properties:
        id: { type: string }
        name: { type: string }
        primary: { type: boolean, description: The primary profile cannot be deleted. }
        position: { type: integer, description: Display order. }
        art: { type: string }
        revision: { type: integer, format: int64 }
        pinRevision: { type: integer, format: int64, description: Ordered independently of the profile's own edits. }
        pinRequired: { type: boolean }
        allowedLibraries: { type: array, items: { type: string } }
    DirectProfileEdit:
      type: object
      description: identity.DirectProfileEdit
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64 }
        name: { type: [string, 'null'] }
        art: { type: [string, 'null'] }
        pin: { type: [string, 'null'], description: Set or clear the profile PIN. }
        policy: { type: [object, 'null'], additionalProperties: true }
      additionalProperties: false
    DirectSelection:
      type: object
      description: identity.DirectSelection
      properties:
        pin: { type: string }
        installationId: { type: string, description: Stable per-installation id of the calling client. }
        trustToken: { type: string, description: Previously issued trust token that lets this installation skip the PIN. }
        trust: { type: boolean, description: Ask for a trust token for this installation. }
      additionalProperties: false
    ProfileOrderEntry:
      type: object
      description: identity.ProfileOrderEntry
      required: [id, revision]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64 }
      additionalProperties: false
    DirectSession:
      type: object
      description: identity.DirectSession
      required: [id, profileId, profileName, expiresAt, current]
      properties:
        id: { type: string }
        profileId: { type: string }
        profileName: { type: string }
        expiresAt: { type: string, format: date-time }
        current: { type: boolean, description: True for the calling session. }
    DirectMember:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        name: { type: string }
        allowedLibraries: { type: array, items: { type: string } }
        disabled: { type: boolean }
        revision: { type: integer, format: int64 }
      additionalProperties: true
    DirectMemberInput:
      type: object
      description: identity.DirectMemberInput
      properties:
        username: { type: string }
        password: { type: string, format: password }
        name: { type: string }
        allowedLibraries: { type: array, items: { type: string }, description: Library ids; an empty list means every library. }
        expectedRevision: { type: integer, format: int64, description: Required on update. }
        disabled: { type: boolean }
      additionalProperties: false
    Library:
      type: object
      description: catalog.Library
      required: [id, name, kind, defaultView]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [movie, tv, anime, music, audiobook] }
        defaultView: { type: string, description: The server's choice of first screen for this library. }
    Item:
      type: object
      description: catalog.Item
      required: [id, libraryId, title, kind, duration, progressSeconds, available, addedAt]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [movie, episode, song, audiobook_file, extra], description: Media kind. }
        year: { type: integer }
        duration: { type: number, format: double, description: Seconds. }
        overview: { type: string }
        posterUrl: { type: string }
        backdropUrl: { type: string }
        stillUrl: { type: string, description: 'An episode item''s own still (episode still candidates only). Absent when the episode has none; never inherited season or show art — clients draw the placeholder.' }
        progressSeconds: { type: number, format: double, description: This viewer's resume position. }
        available: { type: boolean }
        watched: { type: [boolean, 'null'] }
        addedAt: { type: [string, 'null'], format: date-time }
        song: { type: [object, 'null'], additionalProperties: true }
        bookFile: { type: [object, 'null'], additionalProperties: true }
        episode: { type: [object, 'null'], additionalProperties: true }
        sources: { type: array, items: { type: object, additionalProperties: true } }
    Show:
      type: object
      description: catalog.Show
      required: [id, libraryId, title, libraryKind, providerMatchStatus]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        year: { type: integer }
        libraryKind: { type: string }
        providerMatchStatus: { type: string }
        posterUrl: { type: string }
        backdropUrl: { type: string }
        logoUrl: { type: string, description: The show's logo; absent when none is selected. }
        overview: { type: string }
        status: { type: string, description: 'Provider series status (e.g. `Continuing`, `Ended`). Absent when unknown.' }
        firstAired: { type: string, description: Series premiere (provider date, YYYY-MM-DD). Absent when unknown. }
        lastAired: { type: string, description: Latest air date among this library's episodes (YYYY-MM-DD). Absent when none. }
        rating: { $ref: '#/components/schemas/ShowRating' }
        providerSourceUrl: { type: string }
        providerObservedAt: { type: string }
    ShowRating:
      type: object
      description: 'catalog.ShowRating — the provider''s community rating on its own scale (TMDB and TVDB: 10).'
      required: [value, scale]
      properties:
        value: { type: number, format: double }
        scale: { type: integer }
        votes: { type: integer }
    ShowCredit:
      type: object
      description: 'catalog.ShowCredit — one credited person on a show. `id` is the /v1/people person id (the same person as in movies), absent only while that person has no people row. `portraitUrl` is the show''s own portrait for the person (TVDB) else the person''s portrait. Shown to every viewer who may see the show, restricted profiles included.'
      required: [name, ordinal]
      properties:
        id: { type: string, description: /v1/people person id; absent only while the person has no people row. }
        name: { type: string }
        role: { type: string, description: Character or job (e.g. the TVDB character name). }
        department: { type: string, description: Acting, Creator, Writing, Directing, Production, etc. }
        ordinal: { type: integer, description: Billing order within the credit list. }
        portraitUrl: { type: string }
    Season:
      type: object
      description: catalog.Season
      required: [id, showId, number, title]
      properties:
        id: { type: string }
        showId: { type: string }
        number: { type: integer }
        title: { type: string }
        posterUrl: { type: string, description: 'The season''s own poster (TVDB, local season art or an owner upload). Absent when the season has none; never the show''s poster.' }
    Artist:
      type: object
      description: catalog.Artist
      required: [id, libraryId, name]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string }
    Album:
      type: object
      description: catalog.Album
      required: [id, libraryId, title, albumArtistId, albumArtist, providerMatchStatus]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        albumArtistId: { type: string }
        albumArtist: { type: string }
        year: { type: integer }
        providerMatchStatus: { type: string }
        posterUrl: { type: string }
        providerReleaseId: { type: string }
        providerReleaseGroupId: { type: string }
        providerReleaseDate: { type: string }
        providerReleaseCountry: { type: string }
        providerObservedAt: { type: string }
    Book:
      type: object
      description: catalog.Book
      required: [id, libraryId, title, providerMatchStatus]
      properties:
        id: { type: string }
        libraryId: { type: string }
        title: { type: string }
        author: { type: string }
        narrator: { type: string }
        providerMatchStatus: { type: string }
        posterUrl: { type: string }
        resume: { type: [object, 'null'], additionalProperties: true }
    BookChapter:
      type: object
      description: catalog.BookChapter
      required: [id, itemId, index, title, startSeconds, endSeconds]
      properties:
        id: { type: string }
        itemId: { type: string }
        index: { type: integer }
        title: { type: string }
        startSeconds: { type: number, format: double }
        endSeconds: { type: number, format: double }
    Category:
      type: object
      description: catalog.Category
      required: [id, name, count]
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer }
        artworkPaths: { type: array, items: { type: string }, description: Up to 4 poster paths of the category's top items by the library's default sort, for a 2x2 mosaic. Absent when the top items carry no posters. }
    Collection:
      type: object
      description: catalog.Collection
      required: [id, libraryId, name, itemCount]
      properties:
        id: { type: string }
        libraryId: { type: string }
        name: { type: string }
        itemCount: { type: integer }
    BrowsePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { type: object, additionalProperties: true, description: A composed browse row. } }
        nextCursor: { type: string, description: Empty when the listing is exhausted. }
    ContentEntry:
      type: object
      description: >-
        catalog.ContentEntry — one row or entity on a composed surface. Album
        entities carry year, duration (the track total in seconds), the
        album-artist link, label, albumType and MusicBrainz genres; artist
        entities carry overview (biography, with overviewSource/Url), country,
        active years and top local genres; artist releases carry role
        album|ep|single|compilation|appearance and read newest-first; category
        rows carry artworkPaths for a 2x2 mosaic. Artist views add an unpaged
        popularTracks section with the viewer's top 5 songs by play count.
      required: [id, kind, title]
      properties:
        userRating: {type: number, format: double, minimum: 0.5, maximum: 5, description: "The viewer's own rating in half steps, on item rows the viewer has rated; absent otherwise."}
        plays: {type: integer, minimum: 1, description: "How many times the viewer has played a song to the end; song entries only, absent when never played."}
        id: { type: string }
        kind: { type: string }
        title: { type: string }
        subtitle: { type: string }
        libraryId: { type: string }
        overview: { type: string }
        posterUrl: { type: string }
        backdropUrl: { type: string }
        stillUrl: { type: string, description: 'An episode entry''s own still, never inherited; clients draw the placeholder when absent (Spec — Page Content §0.2).' }
        airDate: { type: string, description: 'An episode''s air date (YYYY-MM-DD): show workspace pages and episode rows of a browse page; absent when unknown.' }
        rating: { type: number, description: 'Community rating, 0–10. Browse pages only; absent when unknown.' }
        author: { type: string, description: 'The author of a book entry, or of the book an audiobook file belongs to; absent when unknown.' }
        album: { type: object, description: 'A song entry''s album (id and name).', properties: { id: { type: string }, name: { type: string } } }
        resolution: { type: string, enum: [4k, 1080p, 720p, sd], description: 'Picture class of the item''s best file. Browse pages only; absent for containers and audio.' }
        overviewSource: { type: string, description: 'Biography source (e.g. `Wikipedia`) when overview is provider text; absent for owner text. Artist entities only.' }
        overviewSourceUrl: { type: string, description: The biography's source article. Artist entities only. }
        country: { type: string, description: The artist's MusicBrainz country code. Artist entities only. }
        label: { type: string, description: The album's record label. Album entities only. }
        albumType: { type: string, enum: [Album, EP, Single, Compilation], description: The album's release-group type (a Compilation secondary wins). Album entities only. }
        activeBeginYear: { type: integer, description: The artist's first active year. Artist entities only. }
        activeEndYear: { type: integer, description: The artist's last active year; absent when still active. Artist entities only. }
        addedAt: { type: [string, 'null'] }
        available: { type: boolean }
        watched: { type: boolean }
        duration: { type: number }
        progressSeconds: { type: number }
        count: { type: integer }
        year: { type: integer, description: Release year; album entities only, absent when unknown. }
        artist:
          type: object
          description: The album artist; album entities only.
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        role: { type: string, enum: [album, ep, single, compilation, appearance], description: 'The release''s relationship to the artist (by release-group type for own releases) or its type section; artist releases only.' }
        artworkPaths: { type: array, items: { type: string }, description: Up to 4 poster paths for a 2x2 mosaic; category rows only. }
        navigation:
          type: object
          properties:
            view: { type: string }
            entityId: { type: string }
            category: { type: string }
        playback:
          type: object
          properties:
            itemId: { type: string }
            startSeconds: { type: number }
    ContentFilter:
      type: object
      description: >-
        catalog.ContentFilter — one server-defined predicate on a composed
        surface. Each option carries the exact count behind it.
      required: [id, labelKey, options]
      properties:
        id: { type: string }
        labelKey: { type: string, description: Localisation key; clients must not invent labels. }
        options: { type: array, items: { $ref: '#/components/schemas/ContentFilterOption' } }
    ContentFilterOption:
      type: object
      description: >-
        catalog.ContentFilterOption — one value of a content filter with the
        count behind it.
      required: [id, label, count]
      properties:
        id: { type: string }
        label: { type: string }
        count: { type: integer }
    ContentSection:
      type: object
      required: [id, type, heading, entries, totalCount, nextCursor, start]
      properties:
        id: { type: string, description: 'The section id; a library Discover view adds the personal rows scoped to the library, for_you:<generator>[:<key>].' }
        type: { type: string }
        heading:
          type: object
          description: 'key (a catalogue message id) and fallback (US English); params fill a parameterised heading such as home.row.genreForYou {genre} on a personal row.'
          required: [key, fallback]
          properties:
            key: { type: string }
            fallback: { type: string }
            params: { type: object, additionalProperties: { type: string } }
        entries: { type: array, items: { type: object, additionalProperties: true } }
        totalCount: { type: integer }
        nextCursor: { type: string }
        start: { type: integer, minimum: 0, description: 'Index of the first entry in the whole section: the requested start, the offset a listening continuation resumes at, and 0 otherwise.' }
    ContentEnvelope:
      type: object
      description: >-
        catalog.ContentEnvelope — the server-composed content surface. `heading`, `navigation`,
        `sorts` and `filters` describe the chrome; `sections` carry the rows. `revision` fences the
        composition and `query` echoes the query the server actually ran.
      required: [heading, scope, revision, navigation, query, sorts, filters, sections]
      properties:
        heading: { type: object, additionalProperties: true }
        scope: { type: object, additionalProperties: true }
        revision: { type: object, additionalProperties: true }
        navigation: { type: array, items: { type: object, additionalProperties: true } }
        query: { type: object, additionalProperties: true }
        sorts: { type: array, items: { type: object, additionalProperties: true } }
        filters: { type: array, items: { $ref: '#/components/schemas/ContentFilter' } }
        sections: { type: array, items: { $ref: '#/components/schemas/ContentSection' } }
        entity: { type: [object, 'null'], additionalProperties: true }
        listening: { type: [object, 'null'], additionalProperties: true }
        actions: { type: [array, 'null'], items: { type: string } }
        playlistRevision: { type: [integer, 'null'], format: int64 }
        empty: { type: [object, 'null'], additionalProperties: true }
    Detail:
      type: object
      description: catalog.Detail — the composed item detail screen.
      required: [scope, revision, item, personal, actions, metadata, markers]
      properties:
        scope: { type: object, additionalProperties: true }
        revision: { type: object, additionalProperties: true }
        item: { $ref: '#/components/schemas/Item' }
        personal: { $ref: '#/components/schemas/PersonalState' }
        facts: { type: object, additionalProperties: true, description: "The title's own facts for the facts line and Details: contentRating, studio, network, tagline, releaseDate, originalTitle, country, edition. Absent fields are omitted; the object is omitted when all are." }
        files: { type: array, items: { type: object, additionalProperties: true }, description: "Every file of the title with its tracks, for the Files list: id, path (owners only), size, container, duration, bitRate, available, video {codec, width, height, dynamicRange, hdr10Plus, frameRate, bitDepth, bitRate}, audio[] and subtitles[] {language, codec, title, channels, channelLayout, objectAudio, bitRate, default, forced, external}." }
        actions: { type: array, items: { $ref: '#/components/schemas/DetailAction' } }
        metadata: { type: object, additionalProperties: true, description: 'Sources, ratings, genres and credits. `credits` holds the first page of the cast in billing order and the key crew (directing, writing, creator, music, producing); `creditTotals` ({cast, crew}) counts both groups, and GET /v1/items/{id}/credits pages either one completely.' }
        markers: { type: array, items: { $ref: '#/components/schemas/Marker' }, description: 'Markers this viewer may see. An empty list means "no markers", never "skip anyway".' }
        related: { type: [object, 'null'], additionalProperties: true, description: Movies only unless `related=all` was requested. With that opt-in episode/song/audiobook_file are supported; extras and other unsupported kinds omit the section. }
    CreditPage:
      type: object
      description: catalog.CreditPage — one page of a title's cast or crew, in billing order.
      required: [group, credits, total]
      properties:
        group: { type: string, enum: [cast, crew] }
        credits: { type: array, items: { type: object, additionalProperties: true } }
        total: { type: integer, minimum: 0, description: Every credit in the group. }
        nextCursor: { type: string, description: 'Absent on the last page.' }
    DetailAction:
      type: object
      description: catalog.DetailAction — a server-authored action for the detail screen. Resume startSeconds is bounded by the current item duration, including audiobook files.
      required: [id, labelKey, enabled]
      properties:
        id: { type: string }
        labelKey: { type: string, description: Localisation key; clients must not invent labels. }
        enabled: { type: boolean }
        min: { type: [number, 'null'], format: double }
        max: { type: [number, 'null'], format: double }
        step: { type: [number, 'null'], format: double }
        playback: { type: [object, 'null'], additionalProperties: true }
    Marker:
      type: object
      description: segmentmarkers.Marker
      required: [id, kind, startSeconds, endSeconds, automaticSafe]
      properties:
        id: { type: string }
        kind: { type: string, enum: [recap, intro, outro, credits, commercial] }
        startSeconds: { type: number, format: double }
        endSeconds: { type: number, format: double }
        automaticSafe: { type: boolean, description: Server-decided from detection confidence and owner approval. A client must not skip automatically when this is false. }
    PersonalState:
      type: object
      description: catalog.PersonalState
      required: [watched, progressSeconds, lastPlayedAt, status, conflicts, watchlisted, favorite, rating, revision]
      properties:
        watched: { type: boolean }
        progressSeconds: { type: number, format: double }
        lastPlayedAt: { type: string }
        status: { type: string }
        conflicts: { type: array, items: { type: object, additionalProperties: true } }
        watchlisted: { type: boolean }
        favorite: { type: boolean }
        notInterested: { type: boolean, description: 'The viewer marked this title "Not interested": it is never recommended, and similar titles rank a little lower. Absent means false.' }
        rating: { type: [number, 'null'], format: double }
        revision: { type: integer, format: int64, description: Optimistic-concurrency fence for personal-state writes. }
    PersonalMutation:
      type: object
      description: catalog.PersonalMutation
      required: [operationId, expectedRevision]
      properties:
        operationId: { type: string, description: Idempotency key; a retry returns the original receipt. }
        expectedRevision: { type: integer, format: int64, description: Mandatory optimistic-concurrency fence. }
        watched: { type: [boolean, 'null'] }
        progressSeconds: { type: [number, 'null'], format: double }
        watchlisted: { type: [boolean, 'null'] }
        favorite: { type: [boolean, 'null'] }
        notInterested: { type: [boolean, 'null'], description: 'Hide the title from recommendations (true), or undo that (false).' }
        rating: { description: 'A number to set the rating, or null to clear it; omit to leave unchanged.' }
        offline: { type: [object, 'null'], additionalProperties: true, description: Evidence captured while the client was offline. }
        resolution: { type: [object, 'null'], additionalProperties: true, description: How to resolve a previously reported conflict. }
      additionalProperties: false
    PersonalReceipt:
      type: object
      description: catalog.PersonalReceipt
      required: [serverId, operationId, itemId, libraryId, viewerFence, personal, receiptLifetimeSeconds]
      properties:
        serverId: { type: string }
        operationId: { type: string }
        itemId: { type: string }
        libraryId: { type: string }
        viewerFence: { type: string }
        personal: { $ref: '#/components/schemas/PersonalState' }
        current: { oneOf: [{ $ref: '#/components/schemas/PersonalState' }, { type: 'null' }] }
        receiptLifetimeSeconds: { type: integer, format: int64, description: 2592000 (30 days) — how long the same `operationId` may safely be replayed. }
    PersonalConflictEnvelope:
      type: object
      required: [error, serverId, viewerFence, itemId, current]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        serverId: { type: string }
        viewerFence: { type: string }
        itemId: { type: string }
        current: { $ref: '#/components/schemas/PersonalState' }
    PlaylistOrderWindow:
      type: object
      required: [serverId, viewerFence, playlistId, revision, entryIds]
      properties:
        serverId: { type: string }
        viewerFence: { type: string }
        playlistId: { type: string }
        revision: { type: integer, format: int64 }
        entryIds: { type: array, maxItems: 100, items: { type: string } }
        nextCursor: { type: string }
    PlaylistReorderWindow:
      type: object
      additionalProperties: false
      required: [operationId, expectedRevision, entryIds]
      properties:
        operationId: { type: string, pattern: '^[A-Za-z0-9_-]{1,128}$' }
        expectedRevision: { type: integer, minimum: 1, maximum: 9007199254740991 }
        entryIds: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string, minLength: 1 } }
        afterEntryId: { type: string }
    PlaylistMutation:
      type: object
      description: catalog.PlaylistMutation
      required: [operationId]
      properties:
        operationId: { type: string, description: Idempotency key. }
        expectedRevision: { type: integer, format: int64, description: Required on every action except `create`. }
        name: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        itemId: { type: string, description: The item to add. }
        itemIds: { type: array, items: { type: string } }
        entryIds: { type: array, minItems: 1, maxItems: 200, uniqueItems: true, items: { type: string }, description: Occurrences to move or permute. }
        afterEntryId: { type: string, description: Optional move anchor; empty string prepends. }
        authority: { type: string, enum: [local, hosted], description: Share target authority. }
        accountId: { type: string, description: Share target account. }
        profileId: { type: string, description: Share target profile. }
        role: { type: string }
      additionalProperties: false
    PlaylistReceipt:
      type: object
      description: catalog.PlaylistReceipt
      required: [serverId, viewerFence, operationId, playlistId, revision, deleted]
      properties:
        serverId: { type: string }
        viewerFence: { type: string }
        operationId: { type: string }
        playlistId: { type: string }
        revision: { type: integer, format: int64 }
        entryId: { type: string, description: Present when an entry was added. }
        deleted: { type: boolean }
    SavedResourceMutation:
      type: object
      description: catalog.SavedResourceMutation
      required: [operationId, expectedRevision]
      properties:
        operationId: { type: string, description: Idempotency key. }
        expectedRevision: { type: integer, format: int64, description: Mandatory, including on create (send 0). }
        kind: { type: string }
        name: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        definition: { type: [object, 'null'], additionalProperties: true, description: The saved-view definition, including its `libraryId`. }
        addItemIds: { type: array, items: { type: string } }
        removeEntryIds: { type: array, items: { type: string } }
        authority: { type: string, enum: [local, hosted] }
        accountId: { type: string }
        profileId: { type: string }
