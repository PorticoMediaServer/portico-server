      responses:
        '200': { description: The storage status., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_storage_unsupported, dvr_unavailable]
    put:
      operationId: setRecordingStoragePolicy
      tags: [dvr]
      summary: Change the recording retention policy
      description: >-
        Server owner only. Sets the recording root and the retention rules that decide when old
        recordings are removed; recordings marked `keep` are exempt. `expectedRevision` and
