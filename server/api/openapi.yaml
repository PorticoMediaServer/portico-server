      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRDeleteRuleInput' } } } }
      responses:
        '200': { description: The rule was deleted., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
