      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRStoragePolicyInput' } } } }
      responses:
        '200': { description: The stored policy., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_storage_unsupported, dvr_unavailable]
