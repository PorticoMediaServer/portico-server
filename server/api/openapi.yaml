    get:
      operationId: getJob
      tags: [libraries]
      summary: Read an ingestion job
      description: >-
        Server owner only. Returns the job's state, progress counters and any failure. This is the
        low-level ingestion view; the console job surface (`/v1/admin/console/jobs`) is the one
        that covers every background job kind.
      responses:
        '200': { description: The job., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, persistence_error]
    delete:
      operationId: cancelJob
      tags: [libraries]
      summary: Cancel an ingestion job
      description: >-
        Server owner only. Equivalent to `POST /v1/admin/ingestion/jobs/{id}/cancel`. Cancellation is cooperative:
        the running stage stops at its next checkpoint. Responds 204.
      responses:
        '204': { description: The job was cancelled. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, operation_conflict, persistence_error]
  /v1/admin/ingestion/jobs/{id}/{action}:
    post:
      operationId: controlJob
      tags: [libraries]
      summary: Pause, resume, cancel or retry an ingestion job
      description: >-
        Server owner only. `retry` re-enqueues the job and answers 202 with the new job;
        `pause`, `resume` and `cancel` answer 204. Any other action is rejected as an invalid admin
        request.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Ingestion job id. }
        - { name: action, in: path, required: true, schema: { type: string, enum: [pause, resume, cancel, retry] }, description: Control verb. }
      responses:
        '202': { description: 'The re-queued job (action `retry`).', content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '204': { description: 'The control verb was applied (`pause`, `resume`, `cancel`).' }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, not_found, source_busy, operation_conflict, persistence_error]
  /v1/items:
