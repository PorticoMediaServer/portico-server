      x-error-codes: [unauthorized, not_found, persistence_error]
    delete:
      operationId: deleteItem
      tags: [items]
      summary: Remove an item from the catalogue
      description: >-
        Server owner only. Removes the catalogue row and its personal state; it does not delete
        media from disk. A later scan of a source that still contains the file will re-create the
        item. Responds 204.
      responses:
        '204': { description: The item was removed. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, source_busy, persistence_error]
  /v1/items/{id}/art/{kind}:
    get:
      operationId: getItemArtwork
      tags: [items]
      summary: Fetch item artwork
      description: >-
        Any authenticated viewer with access to the item's library. Serves the stored artwork bytes
        with the provider's own content type and supports conditional and range requests through
