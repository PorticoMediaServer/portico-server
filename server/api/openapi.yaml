        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, playlist_conflict, operation_conflict, stale_continuation, persistence_error]
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      summary: Delete a playlist
      description: >-
        The playlist's owner; rate limited per profile. Requires `expectedRevision` and
