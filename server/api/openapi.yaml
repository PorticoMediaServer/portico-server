    get:
      operationId: getTrickplayTile
      tags: [trickplay]
      summary: Fetch one trickplay tile image
      description: >-
        Any authenticated viewer with access to the item's library. `tile` must be a plain decimal
        index with a `.jpg` suffix and no leading zeros. Tiles are immutable for their digest, so
        the response carries an `ETag` and `Cache-Control: private, max-age=300`; the viewer fence is
