        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: The channel choices., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_unavailable]
  /v1/dvr/rules/preview:
    post:
      operationId: previewRecordingRule
