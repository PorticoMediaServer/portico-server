      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DAVInput' } } } }
      responses:
        '200': { description: The configuration receipt., content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSourceReceiptEnvelope' } } } }
