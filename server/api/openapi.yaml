      responses:
        '200': { description: The detail screen., content: { application/json: { schema: { $ref: '#/components/schemas/Detail' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, stale_continuation, persistence_error, source_unavailable]
  /v1/items/{id}/credits:
    get:
      operationId: listItemCredits
      tags: [items]
      summary: Page a title's cast or crew
      description: >-
        Any authenticated viewer with access to the item's library. The complete cast or crew of a
        title in billing order, a page at a time: the detail response carries only the first page
        of the cast and the key crew. Follow `nextCursor` until it is absent.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - { name: group, in: query, required: true, schema: { type: string, enum: [cast, crew] } }
        - $ref: '#/components/parameters/Cursor'
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200 }, description: 'Page size; absent or out of range, 200.' }
      responses:
        '200': { description: One page of credits., content: { application/json: { schema: { $ref: '#/components/schemas/CreditPage' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, invalid_request, invalid_cursor, stale_continuation, persistence_error]
  /v1/items/{id}/personal-state:
    put:
      operationId: setItemPersonalState
      tags: [items]
      summary: Change this viewer's state for an item
      description: >-
        Any authenticated viewer with access to the item's library; rate limited to 120 changes per
        minute per profile. The body is an optimistic-concurrency mutation — `expectedRevision` is
        mandatory and `operationId` is the idempotency key, so a retried request returns the same
        receipt instead of double-applying. On a conflict the 409 body carries the current state
        alongside the error so the client can reconcile without a second read.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PersonalMutation' } } } }
      responses:
        '200': { description: The mutation receipt and the resulting state., content: { application/json: { schema: { $ref: '#/components/schemas/PersonalReceipt' } } } }
        '409': { description: 'The mutation conflicted; the envelope carries `current`, `serverId`, `viewerFence` and `itemId`.', content: { application/json: { schema: { $ref: '#/components/schemas/PersonalConflictEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, personal_state_conflict, personal_needs_resolution, personal_needs_review, operation_expired, personal_capacity, stale_continuation, persistence_error]
  /v1/items/{id}/metadata/refresh:
    post:
      operationId: refreshItemMetadata
      tags: [items]
      summary: Queue a provider metadata refresh for an item
      description: >-
        Server owner only. Queues a re-fetch from the configured metadata provider and answers 202
        immediately; the item's metadata and artwork change asynchronously. Poll
        `GET /v1/items/{id}/detail` or the console job surface for the result.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '202': { description: The refresh was queued., content: { application/json: { schema: { type: object, required: [itemId, status], properties: { itemId: { type: string }, status: { type: string, const: queued } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, not_found, metadata_conflict, persistence_error]
  /v1/items/{id}/source-availability:
    get:
      operationId: getItemSourceAvailability
      tags: [items]
      summary: Advisory availability of an item's media
      description: >-
        Any authenticated viewer with access to the item's library. Reports whether the item's media
        is presently reachable — `ready`, `resolve_on_play` (a `.strm` that will be resolved when
        playback starts), `changed`, `unsupported` or `unavailable`. It is an advisory projection
        over admitted locations, never a source selection or a playback grant, and it deliberately
        never exposes a provider locator.
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200': { description: The advisory state., content: { application/json: { schema: { type: object, required: [itemId, state], properties: { itemId: { type: string }, state: { type: string, enum: [ready, resolve_on_play, changed, unsupported, unavailable] } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, remote_offline, remote_source_changed, remote_invalid_configuration, persistence_error]
  /v1/content:
    get:
      operationId: getGlobalContent
      tags: [content]
      summary: The server-composed home, watchlist, favourites or playlist directory
      description: >-
        Any authenticated viewer. `view=home` returns the home screen with fixed, server-defined
        sections — the server rejects any attempt to choose sections or a limit other than 12,
        because home composition is the server's decision, not the client's. `view=watchlist`,
        `view=favorites` and `view=playlists` return cursor-paged saved surfaces that additionally
        accept `sort`, `direction`, `cursor` and a `limit` of 1–100.
      parameters:
        - { name: view, in: query, required: true, schema: { type: string, enum: [home, watchlist, favorites, playlists] }, description: Which global surface to compose. }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: 'Must be exactly 12 for `view=home`; 1–100 for the saved views.' }
        - { name: sort, in: query, required: false, schema: { type: string }, description: Saved views only. }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] }, description: Saved views only. }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: The composed surface., content: { application/json: { schema: { $ref: '#/components/schemas/ContentEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, invalid_cursor, stale_continuation, persistence_error]
  /v1/libraries/{id}/content:
    get:
      operationId: getLibraryContent
      tags: [content]
      summary: The server-composed library screen
      description: >-
        Any authenticated viewer with access to the library. This is the one-request-per-screen
        endpoint: the response carries the heading, the navigation tabs, the available sorts and
        filters, and the composed sections with their rows, all chosen server-side. `view` and
        `entityId` select which sub-surface (grid, show, album, artist, …) to compose. The viewer
        fence is re-checked after composition, so a permission change mid-read fails rather than
        leaking.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: view, in: query, required: false, schema: { type: string }, description: Sub-surface to compose. }
        - { name: entityId, in: query, required: false, schema: { type: string }, description: Entity the sub-surface is about. }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string }, description: In-library filter text. }
        - { name: start, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 'Open a grid view (browse, collection, collections, artist, or a single-list listening view) at this index instead of the top, for random access and scrolling back after a jump; the section reports it as `start` and continues by its cursor. Refused with a cursor, and on views with several sections.' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: The composed library screen., content: { application/json: { schema: { $ref: '#/components/schemas/ContentEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, stale_continuation, persistence_error, source_unavailable]
  /v1/libraries/{id}/browse:
    get:
      operationId: browseLibrary
      tags: [content]
      summary: Cursor-paged rows for a library
      description: >-
        Any authenticated viewer with access to the library. The raw row feed behind the composed
        library screen, for clients that want to drive their own grid: server-side sorting,
        filtering and category selection with cursor paging. Use `GET /v1/libraries/{id}/content`
        when you want the server to choose the layout too.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of rows., content: { application/json: { schema: { $ref: '#/components/schemas/BrowsePage' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, stale_continuation, persistence_error]
  /v1/libraries/{id}/discover:
    get:
      operationId: discoverLibrary
      tags: [content]
      summary: Discovery rows for a library
      description: >-
        Any authenticated viewer with access to the library. Returns the server's discovery
        composition for the library — recently added, continue watching, genre spotlights and
        similar rows — already personalised to this viewer's history.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200': { description: The discovery rows., content: { application/json: { schema: { $ref: '#/components/schemas/ContentEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, persistence_error, source_unavailable]
  /v1/libraries/{id}/categories:
    get:
      operationId: listLibraryCategories
      tags: [content]
      summary: Categories available in a library
      description: >-
        Any authenticated viewer with access to the library. Returns the category facets — genres
        and equivalents — with their counts, for use as the `category` parameter of the browse and
        content endpoints.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200': { description: The categories., content: { application/json: { schema: { type: object, required: [categories], properties: { categories: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, persistence_error]
  /v1/libraries/{id}/collections:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: listLibraryCollections
      tags: [collections]
      summary: List a library's collections
      description: >-
        Any authenticated viewer with access to the library. Cursor-paged; each row carries the
        collection's item count so a client can render the shelf without a second request.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of collections., content: { application/json: { schema: { type: object, required: [collections, nextCursor], properties: { collections: { type: array, items: { $ref: '#/components/schemas/Collection' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, persistence_error]
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection in a library
      description: >-
        Server owner only. Creates an empty named collection; add items with
        `PUT /v1/collections/{id}/items/{itemId}`.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } }, additionalProperties: false } } } }
      responses:
        '201': { description: The created collection., content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, collection_conflict, persistence_error]
  /v1/collections/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Collection id. }
    get:
      operationId: getCollection
      tags: [collections]
      summary: Read a collection
      description: >-
        Any authenticated viewer with access to the collection's library — the server resolves the
        collection first and applies that library's permission. Returns the collection row and its
        item count.
      responses:
        '200': { description: The collection., content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, persistence_error]
    patch:
      operationId: renameCollection
      tags: [collections]
      summary: Rename a collection
      description: Server owner only. Changes the display name; membership is untouched.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: The renamed collection., content: { application/json: { schema: { $ref: '#/components/schemas/Collection' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, not_found, collection_conflict, persistence_error]
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      description: Server owner only. Removes the collection; its items are untouched. Responds 204.
      responses:
        '204': { description: The collection was deleted. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, collection_conflict, persistence_error]
  /v1/collections/{id}/items:
    get:
      operationId: listCollectionItems
      tags: [collections]
      summary: List the items in a collection
      description: >-
        Any authenticated viewer with access to the collection's library. Cursor-paged and
        server-sorted, using the same row shape and query grammar as
        `GET /v1/libraries/{id}/browse`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Collection id. }
        - { name: sort, in: query, required: false, schema: { type: string } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [asc, desc] } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of rows., content: { application/json: { schema: { $ref: '#/components/schemas/BrowsePage' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, invalid_cursor, persistence_error]
  /v1/collections/{id}/items/{itemId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Collection id. }
      - { name: itemId, in: path, required: true, schema: { type: string }, description: Item id. }
    put:
      operationId: addCollectionItem
      tags: [collections]
      summary: Add an item to a collection
      description: Server owner only. Idempotent — adding an item already in the collection succeeds. Responds 204.
      responses:
        '204': { description: The item is in the collection. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, collection_conflict, persistence_error]
    delete:
      operationId: removeCollectionItem
      tags: [collections]
      summary: Remove an item from a collection
      description: Server owner only. Idempotent — removing an absent item succeeds. Responds 204.
      responses:
        '204': { description: The item is not in the collection. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, collection_conflict, persistence_error]
  /v1/libraries/{id}/show-workspace:
    get:
      operationId: getShowWorkspace
      tags: [content]
      summary: The composed show/season/episode workspace
      description: >-
        Any authenticated viewer with access to the library. One request returns the show header,
        the season list and the episode page for the selected season, each independently
        cursor-paged (`cursor`/`limit` for episodes, `seasonCursor`/`seasonLimit` for seasons). Only
        the listed query keys are accepted, each at most 4096 bytes; anything else is rejected as an
        invalid show context. The show header carries `status` (provider series status, e.g.
        `Continuing`/`Ended`), `firstAired` (series premiere, YYYY-MM-DD), `lastAired` (latest air
        date among this library's episodes) and `rating` (provider community rating); each season
        carries its own `posterUrl` (absent when the season has none, never the show's poster); each
        episode entry carries its own `stillUrl` (absent when the episode has no still, never
        inherited art) and `airDate` (YYYY-MM-DD). `showCredits[]` are the show's cast then crew as
        `/v1/people` persons: `id` is the person id (absent only while that person has no people
        row), `portraitUrl` is the show's own portrait for the person else the person's portrait,
        and the list is shown to every viewer who may see the show, restricted profiles included.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: showId, in: query, required: false, schema: { type: string } }
        - { name: seasonId, in: query, required: false, schema: { type: string } }
        - { name: episodeId, in: query, required: false, schema: { type: string } }
        - { name: selectedSeasonId, in: query, required: false, schema: { type: string } }
        - { name: group, in: query, required: false, schema: { type: string }, description: Episode numbering group. }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: Episode page cursor. }
        - { name: seasonCursor, in: query, required: false, schema: { type: string }, description: Season page cursor. }
        - { name: limit, in: query, required: false, schema: { type: integer }, description: Episode page size. }
        - { name: seasonLimit, in: query, required: false, schema: { type: integer }, description: Season page size. }
      responses:
        '200': { description: The composed workspace., content: { application/json: { schema: { type: object, additionalProperties: true, description: 'Show workspace envelope: scope, revision, show (with status, firstAired, lastAired, rating), showCredits[] (/v1/people ids with portraitUrl), seasons[] (each with its own posterUrl), episodes page (each entry with its own stillUrl and airDate), episodeCredits, nextUp and navigation.' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, invalid_cursor, stale_continuation, persistence_error]
  /v1/libraries/{id}/shows:
    get:
      operationId: listLibraryShows
      tags: [content]
      summary: List the shows in a library
      description: Any authenticated viewer with access to the library. Cursor-paged show rows with poster, year and provider match status.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of shows., content: { application/json: { schema: { type: object, required: [shows, nextCursor], properties: { shows: { type: array, items: { $ref: '#/components/schemas/Show' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, persistence_error]
  /v1/shows/{id}/seasons:
    get:
      operationId: listShowSeasons
      tags: [content]
      summary: List a show's seasons
      description: Any authenticated viewer with access to the show's library, resolved from the show id. Not paged — a show's season list is bounded.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Show id. }
      responses:
        '200': { description: The seasons., content: { application/json: { schema: { type: object, required: [seasons], properties: { seasons: { type: array, items: { $ref: '#/components/schemas/Season' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, persistence_error]
  /v1/seasons/{id}/episodes:
    get:
      operationId: listSeasonEpisodes
      tags: [content]
      summary: List a season's episodes
      description: Any authenticated viewer with access to the season's library. Cursor-paged, and each episode carries this viewer's watched flag and resume position.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Season id. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of episodes., content: { application/json: { schema: { type: object, required: [episodes, nextCursor], properties: { episodes: { type: array, items: { $ref: '#/components/schemas/Item' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, invalid_cursor, persistence_error]
  /v1/shows/{id}/episodes:
    get:
      operationId: listShowEpisodes
      tags: [content]
      summary: List every episode of a show
      description: >-
        Any authenticated viewer with access to the show's library. Cursor-paged across all seasons.
        The response includes `group`, the numbering group the rows were produced in
        (`unassigned_absolute` when episodes have not been assigned to a season yet), so a client
        can label the list honestly.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Show id. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of episodes., content: { application/json: { schema: { type: object, required: [episodes, nextCursor, group], properties: { episodes: { type: array, items: { $ref: '#/components/schemas/Item' } }, nextCursor: { type: string }, group: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, invalid_cursor, persistence_error]
  /v1/libraries/{id}/episode-issues:
    get:
      operationId: listEpisodeIssues
      tags: [admin-libraries]
      summary: List unresolved episode numbering issues
      description: >-
        Server owner only. Cursor-paged list of files the scanner could not confidently place into a
        show, season and episode — the queue that `POST /v1/libraries/{id}/episode-assignments`
        drains.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of issues., content: { application/json: { schema: { type: object, required: [issues, nextCursor], properties: { issues: { type: array, items: { type: object, additionalProperties: true } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, persistence_error]
  /v1/libraries/{id}/episode-assignments:
    post:
      operationId: assignEpisodes
      tags: [admin-libraries]
      summary: Assign an unmatched asset to a show, season and episode numbers
      description: >-
        Server owner only. Resolves one scanner issue by naming the show title and year, the
        numbering scheme, the season number and the episode numbers the asset covers (a list, for
        multi-episode files).
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EpisodeAssignment' } } } }
      responses:
        '200': { description: The assignment was applied., content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, const: assigned } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, not_found, source_busy, conflict, persistence_error]
  /v1/libraries/{id}/artists:
    get:
      operationId: listLibraryArtists
      tags: [content]
      summary: List the artists in a music library
      description: Any authenticated viewer with access to the library. Cursor-paged artist rows.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of artists., content: { application/json: { schema: { type: object, required: [artists, nextCursor], properties: { artists: { type: array, items: { $ref: '#/components/schemas/Artist' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, persistence_error]
  /v1/libraries/{id}/books:
    get:
      operationId: listLibraryBooks
      tags: [content]
      summary: List the books in an audiobook library
      description: Any authenticated viewer with access to the library. Cursor-paged; each book carries this viewer's resume position when one exists.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of books., content: { application/json: { schema: { type: object, required: [books, nextCursor], properties: { books: { type: array, items: { $ref: '#/components/schemas/Book' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, persistence_error]
  /v1/artists/{id}/albums:
    get:
      operationId: listArtistAlbums
      tags: [content]
      summary: List an artist's albums
      description: Any authenticated viewer with access to the artist's library, resolved from the artist id. Cursor-paged.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Artist id. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of albums., content: { application/json: { schema: { type: object, required: [albums, nextCursor], properties: { albums: { type: array, items: { $ref: '#/components/schemas/Album' } }, nextCursor: { type: string } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found, invalid_cursor, persistence_error]
