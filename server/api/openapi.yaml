      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Operation id. }
      responses:
        '200': { description: The receipt., content: { application/json: { schema: { $ref: '#/components/schemas/MountReceiptEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, storage_config_invalid, storage_operation_expired, not_found, mount_unavailable]
  /v1/storage/sources:
    get:
      operationId: listRemoteSources
      tags: [storage]
