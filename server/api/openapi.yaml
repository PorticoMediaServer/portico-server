      summary: Read a remote source operation receipt
      description: Server owner only, keyed by the calling owner as well as the operation id. Reports whether the configuration change was accepted, and the resulting source.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Operation id. }
