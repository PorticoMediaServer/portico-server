      responses:
        '200': { description: The stored policy., content: { application/json: { schema: { type: object, required: [scope, policy], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, policy: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, remote_invalid_configuration, remote_source_changed, network_policy, remote_offline]
  /v1/guide:
    get:
      operationId: getGuide
      tags: [live]
      summary: Read the unified channel guide
      description: >-
        Any authenticated viewer with server membership. `start`, `end` (both RFC 3339) and `limit`
        are required; `timezone`, `kind`, `search`, `sourceId`, `cursor`, `favorites`,
        `includeHidden` and `group` are optional and nothing else is accepted. `kind` selects live
        sources or library channels — library channels are served by a different store but through
        this one route. Each channel is annotated with whether it can be tuned and recorded right
        now, and why not when it cannot. Sixty-second deadline, two concurrent channel requests.
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time }, description: Window start (RFC 3339). }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time }, description: Window end (RFC 3339). }
        - { name: limit, in: query, required: true, schema: { type: integer }, description: Channels per page. }
        - { name: timezone, in: query, required: false, schema: { type: string }, description: IANA timezone for day boundaries. }
        - { name: kind, in: query, required: false, schema: { type: string, description: 'Channel provenance, for example a live source or a library channel.' } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: sourceId, in: query, required: false, schema: { type: string } }
        - { name: favorites, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: includeHidden, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: group, in: query, required: false, schema: { type: string } }
        - { name: channels, in: query, required: false, schema: { type: string }, description: 'Comma-separated channel ids (at most 50): only these channels, for the programmes of the channels on screen. Live sources.' }
        - { name: programmes, in: query, required: false, schema: { type: string, enum: [none] }, description: '`none` answers channel rows without programmes (the channel list is the same for every window). Live sources.' }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: The guide window., content: { application/json: { schema: { $ref: '#/components/schemas/GuideEnvelope' } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, guide_refresh_required, channel_busy, source_unavailable, guide_unavailable]
  /v1/guide/images/{digest}:
    get:
      operationId: getGuideProgrammeImage
      tags: [live]
      summary: Read a guide programme's image
      description: >-
        Any authenticated viewer with server membership. The digest is the content digest of the
        stored bytes (64 lowercase hex characters); anything else, or a digest with no stored
        image, answers 404. Serves the stored bytes with their media type, a quoted `ETag` of the
        digest and an immutable year-long private cache header. A programme the viewer's profile
        may not see is published without its image path, so this read carries no programme
        identity of its own.
      parameters:
        - { name: digest, in: path, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: Content digest of the stored image bytes. }
      responses:
        '200': { description: The image bytes., content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } }, image/webp: { schema: { type: string, format: binary } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, not_found]
  /v1/channels/preferences:
    post:
      operationId: setChannelPreference
      tags: [live]
      summary: Favourite or hide a live channel
      description: >-
        Any authenticated viewer with server membership, for their own profile. `sourceId` and
        `channelId` name the channel; `favorite` and `hidden` are the per-viewer flags the guide's
        `favorites` and `includeHidden` filters act on. `expectedRevision` fences it and `requestId`
