      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRRuleConfig' } } } }
      responses:
        '200': { description: The matching programmes., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_predicate_unavailable, dvr_unavailable]
  /v1/dvr/rules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: Recording rule id. }
    put:
      operationId: saveRecordingRule
      tags: [dvr]
      summary: Create or update a series recording rule
      description: >-
        Any authenticated viewer with server membership, for their own rules. The body's `id` must
        equal the path id. `anchor` is required only on creation and is unchanged thereafter;
