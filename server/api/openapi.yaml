        needed to change it.
      responses:
        '200': { description: The policy., content: { application/json: { schema: { type: object, required: [scope, policy], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, policy: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, remote_invalid_configuration, not_found, remote_offline]
    put:
      operationId: setStrmAnalysisPolicy
