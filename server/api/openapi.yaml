  /v1/dvr:
    get:
      operationId: listRecordings
      tags: [dvr]
      summary: List recordings
      description: >-
        Any authenticated viewer with server membership, scoped to their own profile. `state`
        (default `upcoming`), `cursor` and `limit` (default 50) are the only accepted parameters.
        Every DVR response is wrapped as `{protocolVersion, serverId, result}`.
      parameters:
        - { name: state, in: query, required: false, schema: { type: string, default: upcoming }, description: 'Recording state, for example `upcoming`, `recording`, `completed`, `failed`.' }
        - $ref: '#/components/parameters/Cursor'
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: A page of recordings., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_unavailable]
  /v1/dvr/recordings:
    post:
      operationId: scheduleRecording
      tags: [dvr]
      summary: Schedule a recording
      description: >-
        Any authenticated viewer with server membership and access to the channel. `occurrence`
        names the programme (channel, start, end, series identity) and `options` carries the padding
        and retention choices. `requestId` makes the schedule replayable. Recording requires a
        configured recording root and confined FFmpeg — without them the server answers
