  /v1/libraries/{id}/listening/selection:
    get:
      operationId: getListeningSelection
      tags: [content]
      summary: Build a listening selection for a library entity
      description: >-
        Any authenticated viewer with access to the library. Produces the ordered set of tracks or
        book files to hand to a queue — for an album, artist, book or the whole library — honouring
        `mode` (for example shuffle), a stable `seed`, an optional `startItem`, and `resume=true` to
        continue where the viewer left off. Cursor-paged, and returned in the same `{scope, data}`
        envelope as the other listening reads. Counts are exact.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: kind, in: query, required: false, schema: { type: string, enum: [album, artist, book, library] }, description: Entity kind being played. }
        - { name: entityId, in: query, required: false, schema: { type: string } }
        - { name: mode, in: query, required: false, schema: { type: string }, description: Selection mode, for example shuffle. }
        - { name: seed, in: query, required: false, schema: { type: string }, description: Stable shuffle seed. }
        - { name: resume, in: query, required: false, schema: { type: string, enum: ['true', 'false'] } }
        - { name: startItem, in: query, required: false, schema: { type: string }, description: Item to begin at. }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: The selection., content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/ScopedEnvelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/ListeningSelection' } } } ] } } } }
        default: { $ref: '#/components/responses/Error' }
