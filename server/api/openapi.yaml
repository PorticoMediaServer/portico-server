      x-error-codes: [unauthorized, remote_invalid_configuration, remote_offline, remote_credentials, remote_source_changed, remote_rate_limited, storage_command_conflict, storage_operation_expired, storage_command_capacity]
  /v1/storage/sources/webdav/{id}:
    parameters:
