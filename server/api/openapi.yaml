        - { name: candidate, in: query, required: false, schema: { type: string }, description: 'Preview an unapplied provider candidate (owner only).' }
        - { name: subject, in: query, required: false, schema: { type: string }, description: Sub-entity or person the artwork is of. }
        - { name: size, in: query, required: false, schema: { type: string, enum: [thumbnail] } }
      responses:
        '200': { description: The image bytes., content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        '404': { description: Artwork is pending or unavailable., content: { text/plain: { schema: { type: string } } } }
