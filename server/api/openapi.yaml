  /v1/dvr/storage:
    get:
      operationId: getRecordingStorage
      tags: [dvr]
      summary: Read the recording storage status
      description: >-
        Server owner only. Reports the recording root, its capacity and usage, and the active
        retention policy. A platform without physical cleanup support is reported here rather than
