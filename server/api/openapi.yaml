      description: >-
        Server owner only; rate limited per profile. Writes the **library's** scan policy — tier,
        enabled operations and trickplay geometry — from the item screen the owner is looking at,
        fenced by `expectedRevision`, and then notifies ingestion that the policy changed so the
        next scan uses it.
