      description: >-
        Any authenticated viewer with access to the item's library — trickplay is published on the
        item path under the same authorization as item artwork, deliberately **not** under a
        playback grant, so a scrubber preview can be cached by the player, shown before a session
        exists and survives a session renewal. Each set describes its interval, tile geometry, frame
