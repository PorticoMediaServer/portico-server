        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { description: A page of items., content: { application/json: { schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: '#/components/schemas/Item' } }, nextCursor: { type: string, description: Empty when the listing is exhausted. } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_cursor, stale_continuation, persistence_error]
  /v1/items/{id}:
