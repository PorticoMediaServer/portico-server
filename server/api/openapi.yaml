    delete:
      operationId: deleteWebdavSource
      tags: [storage]
      summary: Remove a WebDAV source
      description: >-
        Server owner only; no query string. The body carries `operationId` and
        `expectedGeneration`. Libraries still pointing at the source will report their sources as
        offline afterwards, so remove or repoint them first.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [operationId, expectedGeneration], properties: { operationId: { type: string }, expectedGeneration: { type: integer, format: int64 } }, additionalProperties: false } } } }
      responses:
        '200': { description: The removal receipt., content: { application/json: { schema: { $ref: '#/components/schemas/RemoteSourceReceiptEnvelope' } } } }
