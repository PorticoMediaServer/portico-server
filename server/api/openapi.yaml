      tags: [storage]
      summary: Delete a managed mount
      description: >-
        Server owner only; no query parameters. The body's `action` is forced to `delete`;
        `expectedRevision` and `operationId` are the usual fence and idempotency key. Answers 202
        with a receipt — the mount is torn down asynchronously, and remote source adapters are
        refreshed afterwards.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Mount id. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/MountCommand' } } } }
      responses:
        '202': { description: The command receipt., content: { application/json: { schema: { $ref: '#/components/schemas/MountReceiptEnvelope' } } } }
