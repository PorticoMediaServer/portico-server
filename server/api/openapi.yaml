      operationId: getMetadataRepairState
      tags: [items]
      summary: Read the metadata repair state for an entity
      description: >-
        Server owner only (local owner, or a hosted owner with a live authority horizon). Accepts no
        query string and runs with a thirty-second deadline. Returns the current match, the
        candidates, the merge options and the confirmation the server will require, stamped with the
        server id and this owner's viewer fence.
      responses:
        '200': { description: The repair state., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_metadata_repair, metadata_conflict, not_found, persistence_error]
    post:
      operationId: repairMetadata
      tags: [items]
      summary: Apply a metadata repair command
      description: >-
        Server owner only; rate limited to 120 metadata changes per minute per profile. Commands
        cover re-matching, merging, splitting and confirming an entity's identity. A repair that
        races another owner's change answers 409 `metadata_conflict`, and the response is the
        repair state after the command so no second read is needed.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: 'metadata.RepairCommand: the repair action, its target and the required confirmation.' } } } }
      responses:
        '200': { description: The repair state after the command., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_metadata_repair, metadata_conflict, rate_limited, not_found, persistence_error]
