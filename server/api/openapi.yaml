      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRScheduleInput' } } } }
      responses:
        '200': { description: The scheduled recording., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_capture_unavailable, dvr_unavailable]
  /v1/dvr/recordings/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      operationId: getRecording
      tags: [dvr]
      summary: Read one recording
      description: >-
        The recording's owner. `after` is the only accepted query parameter and tails the
        recording's event log from a known point, so a client can follow a live capture without
        re-reading everything.
      parameters:
        - { name: after, in: query, required: false, schema: { type: string }, description: Event cursor to tail from. }
      responses:
        '200': { description: The recording., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_unavailable]
    patch:
      operationId: updateRecording
      tags: [dvr]
      summary: Change a recording's options
      description: >-
        The recording's owner. Changes padding, retention and similar options. `expectedRevision`
        fences it and `requestId` makes it replayable; a recording that has already started limits
        which options may still change.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRUpdateInput' } } } }
      responses:
        '200': { description: The updated recording., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_unavailable]
    delete:
      operationId: deleteRecording
      tags: [dvr]
      summary: Delete a completed recording
      description: >-
        The recording's owner. Carries `requestId` and `expectedRevision` in the body. Physical
        cleanup requires platform support; where it is unavailable the server answers
        `dvr_storage_unsupported` instead of silently leaving the file. Preview first with the
        delete-preview route.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRMutation' } } } }
      responses:
        '200': { description: The deletion result., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_storage_unsupported, dvr_unavailable]
  /v1/dvr/recordings/{id}/cancel:
    post:
      operationId: cancelRecording
      tags: [dvr]
      summary: Cancel an upcoming or running recording
      description: >-
        The recording's owner. `requestId` and `expectedRevision` fence and de-duplicate the
        cancellation. Cancelling a running capture keeps whatever was already written unless the
        recording is also deleted.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRMutation' } } } }
      responses:
        '200': { description: The cancelled recording., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_unavailable]
  /v1/dvr/recordings/{id}/keep:
    put:
      operationId: setRecordingKeep
      tags: [dvr]
      summary: Protect a recording from automatic deletion
      description: >-
        The recording's owner. `keep` exempts the recording from the retention policy, which is what
        stops a series rule's "keep 5 episodes" from removing something the viewer still wants.
        `requestId` and `expectedRevision` apply as usual.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRKeepInput' } } } }
      responses:
        '200': { description: The recording after the change., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_unavailable]
  /v1/dvr/recordings/{id}/delete-preview:
    get:
      operationId: previewRecordingDeletion
      tags: [dvr]
      summary: Preview what deleting a recording removes
      description: >-
        The recording's owner. Reports the files and bytes that would be freed and whether physical
        cleanup is possible on this platform, so the confirmation is specific rather than generic.
      parameters:
        - $ref: '#/components/parameters/RecordingId'
      responses:
        '200': { description: The deletion preview., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_storage_unsupported, dvr_unavailable]
  /v1/dvr/channels:
    get:
      operationId: listRecordableChannels
      tags: [dvr]
      summary: List channels that can be recorded
      description: >-
        Any authenticated viewer with server membership. `sourceId`, `search` and `cursor` are the
        only accepted parameters. Returns the channel choices for the recording form, already
        limited to channels this viewer may see and this server can capture.
