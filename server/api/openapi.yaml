      operationId: getManualMetadata
      tags: [items]
      summary: Read the owner-editable metadata for an item
      description: >-
        Local server owner only — this route deliberately admits only a live local owner session,
        checked with a bounded SQL predicate inside the read. Accepts no query string, runs with a
        ten-second deadline, and returns each editable field with its provider value, the owner
