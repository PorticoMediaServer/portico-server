        and the retention options. `expectedRevision` and `requestId` apply as usual.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DVRRuleInput' } } } }
      responses:
        '200': { description: The saved rule., content: { application/json: { schema: { $ref: '#/components/schemas/DVREnvelope' } } } }
        default: { $ref: '#/components/responses/DVRError' }
      x-error-codes: [unauthorized, dvr_denied, dvr_invalid, dvr_conflict, dvr_predicate_unavailable, dvr_unavailable]
    delete:
      operationId: deleteRecordingRule
      tags: [dvr]
      summary: Delete a series recording rule
      description: >-
        The rule's owner. `future` decides what happens to recordings the rule already scheduled but
        that have not started. `requestId` and `expectedRevision` fence the deletion. Answers
