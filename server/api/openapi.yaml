        '200': { description: The editable metadata., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, manual_metadata_conflict, metadata_edit_unavailable, metadata_edit_interrupted, not_found]
    patch:
      operationId: saveManualMetadata
      tags: [items]
      summary: Save owner metadata overrides for an item
      description: >-
        Local server owner only. The body is at most 256 KiB and carries `expectedRevision` (a
        string) plus the edited `title` and `description` values, each with its own set/clear/lock
