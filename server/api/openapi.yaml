  /v1/direct/members/{id}:
    patch:
      operationId: updateDirectMember
      tags: [direct]
      summary: Update a direct member account
      description: >-
        The holder of an owner direct account session. Changes a member's display name, password,
        library allow-list or disabled flag. `expectedRevision` must match the revision last read
        from `GET /v1/direct/members`. Responds 204; re-read the list to see the new revision.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Member account id. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DirectMemberInput' } } } }
      responses:
        '204': { description: The member was updated. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, conflict, not_found, persistence_error]
  /v1/direct/ownership/custody:
    post:
      operationId: acceptPorticoCustody
      tags: [direct]
      summary: Accept Hosted custody of this server's claim
      description: >-
        The owner's direct account session, for an owner that is a Portico Account. `porticoIdentity`
        is that account's own custody assertion for this server (`POST /v1/servers/{id}/identity
        {challenge, purpose: "custody"}` on Hosted, answering a challenge from
        `POST /v1/direct/portico-challenge`). The next membership push forwards it, and Hosted
        moves custody of the claim (retiring it, its certificates) to this owner; until then the
        snapshot says `custodyPending`. Responds 204.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [porticoIdentity], properties: { porticoIdentity: { $ref: '#/components/schemas/SignedEnvelope' } }, additionalProperties: false } } } }
      responses:
        '204': { description: Custody was accepted; Hosted hears of it with the next push. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, clock_skew, rate_limited, persistence_error]
  /v1/direct/ownership:
    post:
      operationId: transferDirectOwnership
      tags: [direct]
      summary: Transfer server ownership to another account
      description: >-
        The holder of the current owner's direct account session, who must re-enter their password
        in the body (or, for a Portico Account owner, send a fresh `porticoIdentity` for its own
        account) and pass the account revision they read. On success the named account becomes
        the owner and the caller is demoted; this is irreversible without the new owner's
        cooperation. Hosted moves the claim's custody to a Portico Account owner once it accepts
        custody (`POST /v1/direct/ownership/custody`); until then, and for a direct owner, custody
        is released. Responds 204.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [accountId, expectedRevision], properties: { accountId: { type: string }, currentPassword: { type: string, format: password }, expectedRevision: { type: integer, format: int64 }, porticoIdentity: { $ref: '#/components/schemas/SignedEnvelope' } }, additionalProperties: false } } } }
      responses:
        '204': { description: Ownership was transferred. }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, rate_limited, conflict, persistence_error]
  /v1/libraries:
    get:
      operationId: listLibraries
      tags: [libraries]
      summary: List the libraries this viewer may see
      description: >-
        Any authenticated viewer. The server enumerates every library and then filters it through
        the viewer's membership policy, so the list is already the viewer's own — a client must
        never filter libraries itself. Each row carries the library's kind (`movie`, `tv`,
        `anime`, `music`, `audiobook`) and its default view, which is the server-authored choice of what the
        library's first screen should show.
      responses:
        '200': { description: The visible libraries., content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Library' } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, persistence_error, source_unavailable]
    post:
      operationId: createLibrary
      tags: [libraries]
      summary: Create a library
      description: >-
        Server owner only, re-authorised inside the creating transaction. `kind` selects the
        library's media model and `path` is the first source root. `metadataAgent` chooses the
        metadata source (`online`, the default, or `local` for local metadata only; see
        `GET /v1/libraries/{id}/metadata/agent`). `metadataLanguage` chooses the metadata
        language: one of the chosen agent's `languages` for the kind (see
        `GET /v1/library-kinds/{kind}/metadata-agents`); omitted changes nothing. The first scan is queued in the same transaction,
        at background priority.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, kind, path], properties: { name: { type: string }, kind: { type: string, enum: [movie, tv, anime, music, audiobook] }, path: { type: string, description: Absolute source root on the server. }, metadataAgent: { type: string, enum: [online, local], default: online }, metadataLanguage: { type: string, description: 'One of the chosen metadata agent languages for the library kind.' } }, additionalProperties: false } } } }
      responses:
        '201': { description: The created library., content: { application/json: { schema: { $ref: '#/components/schemas/Library' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, invalid_metadata_language, source_already_configured, library_configuration_conflict, source_unavailable, persistence_error]
  /v1/libraries/{id}/network-roots:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: getLibraryNetworkRoots
      tags: [libraries]
      summary: Read the library's approved network origins
      description: >-
        Server owner only (storage authority). Returns the origins — scheme and host only, never a
        full locator — that this library's `.strm` and remote entries are allowed to reach, plus the
        policy revision to use as `expectedRevision` when changing them.
      responses:
        '200': { description: The approved origins., content: { application/json: { schema: { type: object, required: [scope, policy], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, policy: { type: object, required: [libraryId, revision, origins], properties: { libraryId: { type: string }, revision: { type: integer, format: int64 }, origins: { type: array, items: { type: string, format: uri } } } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, remote_invalid_configuration, not_found, persistence_error]
    post:
      operationId: approveLibraryNetworkRoots
      tags: [libraries]
      summary: Approve network roots for a library
      description: >-
        Server owner only. Replaces the library's approved root list with the exact roots supplied —
        this is an explicit owner confirmation, never discovery data. Pass `expectedRevision` to
        make the change optimistically concurrent; omit it to overwrite unconditionally.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [roots], properties: { roots: { type: array, items: { type: string, format: uri } }, expectedRevision: { type: [integer, 'null'], format: int64 } }, additionalProperties: false } } } }
      responses:
        '200': { description: The stored approvals., content: { application/json: { schema: { type: object, required: [approvals], properties: { approvals: { type: array, items: { type: object, additionalProperties: true } } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, network_policy, source_changed, conflict, persistence_error]
  /v1/libraries/{id}/scans:
    post:
      operationId: queueLibraryScan
      tags: [libraries]
      summary: Queue a scan of the whole library
      description: >-
        Server owner only. Enqueues an ingestion job over every source in the library and returns
        202 with the job. Poll `GET /v1/admin/ingestion/jobs/{id}` for progress, or watch the console job surface.
        The scan honours the library's current scan policy tier.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: mode, in: query, required: false, schema: { type: string, enum: [incremental, full, integrity] }, description: "incremental (default) re-reads changed files; full re-reads every file, including unchanged ones; integrity also re-verifies file contents. Other values are refused." }
      responses:
        '202': { description: The queued job., content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, source_busy, source_unavailable, conflict, persistence_error]
  /v1/admin/ingestion/jobs/{id}:
