      x-error-codes: [unauthorized, not_found, persistence_error]
  /v1/search:
    get:
      operationId: search
      tags: [search]
      summary: Search across the viewer's libraries
      description: >-
        Any authenticated viewer. Runs with a three-second server deadline over exactly the
        libraries this viewer may see; a timeout answers 503 `search_unavailable` rather than a
        partial page. Only `q`, `group`, `cursor`, `limit` (1–40) and `record` are accepted. Pass
        `record=1` on a committed search — a submit or a result open, never a typeahead keystroke or
        a continuation — to add it to the viewer's history. Each group ranks every match of its
        kind in the viewer's libraries; `totalCount` is exact.
      parameters:
        - { name: q, in: query, required: true, schema: { type: string }, description: Query text. }
        - { name: group, in: query, required: false, schema: { type: string }, description: Restrict to one result group. }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 40, default: 40 } }
        - $ref: '#/components/parameters/Cursor'
        - { name: record, in: query, required: false, schema: { type: string, enum: ['1'] }, description: Record this query in the viewer's search history. }
      responses:
        '200': { description: Grouped search results., content: { application/json: { schema: { $ref: '#/components/schemas/ContentEnvelope' } } } }
        '503': { description: Search timed out or was cancelled., content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_search_query, invalid_cursor, stale_continuation, search_unavailable, persistence_error]
  /v1/search/history:
    get:
      operationId: getSearchHistory
      tags: [search]
      summary: Read this viewer's recent searches
      description: >-
        Any authenticated viewer, for their own profile only. Accepts no query parameters at all and
        is always sent `Cache-Control: no-store`. Whether history is recorded is itself a viewer
        preference (`search.rememberHistory`).
      responses:
        '200': { description: The recent searches., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_search_query, persistence_error]
    delete:
      operationId: clearSearchHistory
      tags: [search]
      summary: Clear this viewer's search history
      description: Any authenticated viewer, for their own profile only. Returns the now-empty history document so the client can render the result without a second read.
      responses:
        '200': { description: The cleared history., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, persistence_error]
