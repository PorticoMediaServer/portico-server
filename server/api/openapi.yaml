        '200': { description: The remote sources., content: { application/json: { schema: { type: object, required: [scope, sources, mountSupported], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, sources: { type: array, items: { type: object, additionalProperties: true } }, mountSupported: { type: boolean } } } } } }
