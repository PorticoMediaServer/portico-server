        replayable. Disabling a source removes its channels from every viewer's guide.
      parameters:
        - $ref: '#/components/parameters/LiveSourceId'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedRevision, enabled], properties: { expectedRevision: { type: integer, format: int64 }, enabled: { type: boolean }, requestId: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: Whether the change was saved., content: { application/json: { schema: { type: object, required: [protocolVersion, serverId, saved], properties: { protocolVersion: { type: string }, serverId: { type: string }, saved: { type: boolean } } } } } }
        default: { $ref: '#/components/responses/LiveError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_channel_input, channel_revision_conflict, channel_busy, guide_unavailable]
  /v1/admin/live-sources/remote/preview:
    post:
      operationId: previewRemoteLiveSource
      tags: [live]
      summary: Fetch and preview a remote live source
      description: >-
        Server owner only; no query string. Fetches the playlist and guide from the submitted
        locator — including any credentials and the owner's explicitly confirmed LAN roots, which
        are a confirmation and never discovery data — and returns a preview with a preview id. Save
        it with `POST /v1/admin/live-sources/remote/save`.
        A source, guide or stream on the owner's own network (private, loopback, link-local or
        CGNAT addresses: an HDHomeRun, Threadfin, a NAS) is refused with 422
        `source_lan_confirmation_required` until confirmed; `error.confirmRoots` lists every root
        still needed (scheme://host:port/). Ask the owner, then preview again with those exact
        values in `confirmedLanRoots`. Nothing is fetched from an unconfirmed root. Other ports of a
        confirmed device (an HDHomeRun's :5004 streams) are approved with it. Addresses that can
        never be used (metadata services) stay `source_network_policy`.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteLiveDraft' } } } }
      responses:
