    get:
      operationId: listLibraryChannels
      tags: [library-channels]
      summary: List library channels
      description: >-
        Server owner only; no query string is accepted on any library-channel route. Library
        channels are continuous streams generated from library content. Returns each channel's
        configuration, schedule state and revision. Thirty-second deadline, two concurrent requests.
      responses:
        '200': { description: The channels., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channels_unavailable]
    post:
      operationId: saveLibraryChannel
      tags: [library-channels]
      summary: Create or update a library channel
      description: >-
        Server owner only. The body carries the channel's configuration — the libraries and filters
        it draws from, its ordering, its overlays and its timezone. A configuration that selects no
        libraries answers `library_channel_no_libraries`; an overlay this server cannot render
        answers `overlay_unavailable`. Preview first.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: 'librarychannels.SaveInput: the channel configuration plus its expected revision and request id.' } } } }
      responses:
        '200': { description: The saved channel., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_changed, library_channel_no_libraries, overlay_unavailable, library_channels_unavailable]
  /v1/admin/library-channels/defaults:
    post:
      operationId: getLibraryChannelDefaults
      tags: [library-channels]
      summary: Build a default channel configuration
      description: >-
        Server owner only. Given a `timezone`, returns a sensible starting configuration derived from
        what this server actually has in its libraries — the "new channel" form is populated by the
        server, not guessed by the client.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [timezone], properties: { timezone: { type: string } }, additionalProperties: false } } } }
      responses:
        '200': { description: The default configuration., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_no_libraries, library_channels_unavailable]
  /v1/admin/library-channels/preview:
    post:
      operationId: previewLibraryChannel
      tags: [library-channels]
      summary: Preview the schedule a configuration would generate
      description: >-
        Server owner only. Runs the generator over the submitted configuration without storing
        anything and returns the programme schedule it produces, so an owner sees the actual line-up
        before committing it.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: 'librarychannels.Config: the channel configuration to evaluate.' } } } }
      responses:
        '200': { description: The generated preview., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_no_libraries, overlay_unavailable, library_channels_unavailable]
  /v1/admin/library-channels/reorder:
    post:
      operationId: reorderLibraryChannels
      tags: [library-channels]
      summary: Reorder the library channels
      description: >-
        Server owner only. Submits the complete channel ordering; the order decides channel numbers
        in the guide. A stale ordering answers `library_channel_changed`.
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: true, description: 'librarychannels.ReorderInput: the ordered channel ids and the expected revision.' } } } }
      responses:
        '200': { description: Whether the order was saved., content: { application/json: { schema: { $ref: '#/components/schemas/LibraryChannelEnvelope' } } } }
        default: { $ref: '#/components/responses/LibraryChannelError' }
      x-error-codes: [authentication_required, channel_permission_denied, invalid_library_channel, library_channel_changed, library_channels_unavailable]
  /v1/admin/library-channels/{id}/regenerate:
    post:
      operationId: regenerateLibraryChannel
      tags: [library-channels]
      summary: Regenerate a channel's schedule
      description: >-
