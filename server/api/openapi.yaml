        Server owner only, and only when the scheduler is composed. Each kind names what it operates
        on, so a client can build the "run a job" form from the server's own list rather than a
        hard-coded enum — `library-lyrics-fetch` is one such kind.
      responses:
        '200': { description: The job kinds., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, console_capacity, console_unavailable]
  /v1/admin/console/jobs:
    get:
      operationId: listConsoleJobs
      tags: [admin-console]
      summary: List background jobs
      description: Server owner only. Cursor-paged through `cursor`, the only accepted query parameter. Covers every job kind, not just ingestion; retention is governed by `jobDays`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: A page of jobs., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, invalid_console_request, console_capacity, console_unavailable]
    post:
      operationId: enqueueConsoleJob
      tags: [admin-console]
      summary: Run a background job now
      description: >-
        Server owner only. `kind` must be one the server published, `resource` names what it runs
        over (usually a library id), and `idempotencyKey` stops a double-click from queueing two
        runs. Answers with the enqueued job.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RunJob' } } } }
      responses:
        '200': { description: The enqueued job., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, invalid_console_request, console_conflict, console_capacity, console_unavailable]
  /v1/admin/console/jobs/{id}/{action}:
    post:
      operationId: commandConsoleJob
      tags: [admin-console]
      summary: Act on a background job
      description: >-
        Server owner only. `action` is the scheduler verb — pause, resume, cancel or retry — and the
        body carries `expectedRevision` and `idempotencyKey` so the command is fenced and
        replayable. An action the job's current state does not allow answers `console_conflict`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Job id. }
        - { name: action, in: path, required: true, schema: { type: string }, description: Scheduler verb. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/JobCommand' } } } }
      responses:
        '200': { description: The job after the command., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, invalid_console_request, console_conflict, console_expired, not_found, console_capacity, console_unavailable]
  /v1/admin/console/schedules:
    get:
      operationId: listConsoleSchedules
      tags: [admin-console]
      summary: Read the recurring job schedules
      description: Server owner only. Each schedule names its kind, resource, timezone, start minute, window and catch-up behaviour, with the revision needed to change it.
      responses:
        '200': { description: The schedules., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, console_capacity, console_unavailable]
    put:
      operationId: saveConsoleSchedule
      tags: [admin-console]
      summary: Create or replace one schedule
      description: >-
        Server owner only. A complete document write: `id`, `kind`, `resource`, `enabled`,
        `timezone`, `startMinute`, `windowMinutes` and `catchUp` must all be present inside `value`,
        so an omitted boolean can never be defaulted silently. `expectedRevision` fences it and
        `idempotencyKey` makes it replayable.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleChange' } } } }
      responses:
        '200': { description: The saved schedule., content: { application/json: { schema: { $ref: '#/components/schemas/ScopedEnvelope' } } } }
        default: { $ref: '#/components/responses/ConsoleError' }
      x-error-codes: [unauthorized, invalid_console_request, console_conflict, console_expired, console_capacity, console_unavailable]
  /v1/admin/operations/{panel}:
    get:
      operationId: getOperationsPanel
      tags: [admin-console]
      summary: Read a server operations panel
      description: >-
        Server owner only, re-authorised before **and** after the observation; if the owner session
        changed in between the server answers 401 rather than returning the panel. `panel` must be
        `memory`, `database` or `build`, no query string is accepted, and at most four panel reads
        run at once (over that, 429 `operations_busy` with `Retry-After`). Three-second deadline.
      parameters:
        - { name: panel, in: path, required: true, schema: { type: string, enum: [memory, database, build] }, description: Panel name. }
      responses:
        '200': { description: The panel., content: { application/json: { schema: { type: object, required: [scope, panel], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, panel: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_operations_panel, operations_busy, operations_unavailable]
  /v1/admin/support-report:
    get:
      operationId: getSupportReport
      tags: [admin-console]
      summary: Build a support snapshot
      description: >-
        Server owner only, re-authorised after the snapshot is taken. Accepts no query parameters,
        runs with a five-second deadline, and allows only two concurrent reports (over that, 429
        `support_busy`). The `scope` wrapper is transport-only: the downloadable artifact is the
        `report` object alone. A report that exceeds the size bound answers 503 rather than a
        truncated document.
      responses:
        '200': { description: The support report., content: { application/json: { schema: { type: object, required: [scope, report], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, report: { type: object, additionalProperties: true } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_support_query, support_busy, support_unavailable]
  /v1/admin/playback/diagnostics:
    get:
      operationId: getPlaybackDiagnostics
      tags: [admin-console]
      summary: Read playback delivery diagnostics
      description: >-
        Server owner only, re-authorised after the read; a changed owner session answers 401.
        Reports whether direct play, HLS and finite HLS are configured, the lifecycle state, the
        active conversion count against its limit, where that limit came from and the output
        policy. Accepts no query string, allows four concurrent reads, and publishes `observedAt`
        and `freshUntil` (30 seconds) so a console can show the data's age honestly.
      responses:
        '200': { description: The diagnostics., content: { application/json: { schema: { $ref: '#/components/schemas/PlaybackDiagnosticsEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_playback_diagnostics, playback_diagnostics_busy, playback_diagnostics_unavailable]
  /v1/admin/playback-sessions:
    get:
      operationId: listPlaybackActivity
      tags: [admin-console]
      summary: List playback activity
      description: >-
        Server owner only, with a five-second deadline and the owner re-checked after the read. Only
        `status` (default `open`), `limit` (default 40) and `cursor` are accepted; anything else is
        an invalid activity request. This is the "who is watching what" view, and the source of the
        session ids the stop command takes.
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, default: open } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 40 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200': { description: The activity page., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_activity_request, activity_unavailable]
  /v1/admin/play-history:
    get:
      operationId: listPlayHistory
      tags: [admin-console]
      summary: List the server's play history
      description: >-
        Server owner or administrator only. Every play on this server, newest first: who played
        what, on which device, when, and how far they got. A play is recorded once it has really
        started (the same point at which it would resume) and is updated until it ends; the names
        of the person, the title and the device are copied in, so a row still reads correctly
        after any of them is gone. This is the owner's record: a viewer pausing or clearing their
        own History (`GET /v1/history`) does not change it. It is kept in full unless the owner
        sets `playHistoryDays` in the server settings.

        `accountId`, `libraryId` and `period` (`24h`, `7d`, `30d`, `90d` or `all`, the default)
        filter; `limit` is 1–200 (default 50). The first page carries `total`, the number of plays
        the filters match. `nextCursor` is empty on the last page.
      parameters:
        - { name: accountId, in: query, required: false, schema: { type: string } }
        - { name: libraryId, in: query, required: false, schema: { type: string } }
        - { name: period, in: query, required: false, schema: { type: string, enum: ['24h', '7d', '30d', '90d', all], default: all } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: One page of plays.
          content:
            application/json:
              schema:
                type: object
                required: [entries, nextCursor]
                properties:
                  total: { type: integer, format: int64, description: Plays matching the filters. First page only. }
                  nextCursor: { type: string }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [id, user, accountId, kind, title, libraryId, startedAt, positionSeconds, durationSeconds, completed]
                      properties:
                        id: { type: string }
                        user: { type: string, description: The account's name when the play was recorded. }
                        profile: { type: string, description: The profile's name, for any profile but the account's first. }
                        accountId: { type: string }
                        kind: { type: string, description: 'movie, episode, song, audiobook_file or extra.' }
                        title: { type: string }
                        parentTitle: { type: string, description: 'The show of an episode, the artist of a song, the book of an audiobook file.' }
                        season: { type: integer }
                        episode: { type: integer }
                        itemId: { type: string, description: The title's id while it is still in the catalogue. }
                        libraryId: { type: string }
                        device: { type: string }
                        platform: { type: string }
                        startedAt: { type: string, format: date-time }
                        positionSeconds: { type: number, description: The furthest point reached. }
                        durationSeconds: { type: number }
                        completed: { type: boolean }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, forbidden, invalid_cursor]
  /v1/admin/play-history/summary:
    get:
      operationId: summarizePlayHistory
      tags: [admin-console]
      summary: Viewing statistics from the play history
      description: >-
        Server owner or administrator only. Totals of the plays in a period, read from the play
        history itself, so they agree with `GET /v1/admin/play-history` and are kept for as long
        as it is (forever unless the owner sets `playHistoryDays`). `period` is `24h` (the
        default), `7d`, `30d`, `90d` or `all`. An episode counts for its show in `mostPlayed`.
      parameters:
        - { name: period, in: query, required: false, schema: { type: string, enum: ['24h', '7d', '30d', '90d', all], default: '24h' } }
      responses:
        '200':
          description: The period's totals.
          content:
            application/json:
              schema:
                type: object
                required: [period, plays, people, watchedSeconds, converted, mostPlayed, mostActive]
                properties:
                  period: { type: string }
                  plays: { type: integer, format: int64 }
                  people: { type: integer, format: int64, description: Distinct profiles that played something. }
                  watchedSeconds: { type: integer, format: int64 }
                  converted: { type: integer, format: int64, description: Plays the server converted (picture or sound). }
                  mostPlayed:
                    type: array
                    items: { type: object, required: [name, plays], properties: { name: { type: string }, plays: { type: integer, format: int64 } } }
                  mostActive:
                    type: array
                    items: { type: object, required: [name, plays], properties: { name: { type: string }, plays: { type: integer, format: int64 } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, forbidden, invalid_cursor]
  /v1/admin/playback-sessions/{id}/stop:
    post:
      operationId: stopPlaybackActivity
      tags: [admin-console]
      summary: Stop a viewer's playback session
      description: >-
        Server owner only; no query string is accepted. The body carries `operationId` — the
        idempotency key that also names the operation for later recovery — and
        `expectedGeneration`, which fences the command against the session generation the owner is
        looking at. Answers 202 with the operation; poll
        `GET /v1/admin/playback-operations/{operationId}` for its outcome.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Playback session id. }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ActivityStop' } } } }
      responses:
        '202': { description: The stop operation., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_activity_request, playback_command_conflict, playback_operation_expired, playback_command_capacity, activity_unavailable]
  /v1/admin/playback-operations/{operationId}:
    get:
      operationId: getPlaybackOperation
      tags: [admin-console]
      summary: Recover the outcome of a stop operation
      description: >-
        Server owner only; no query string is accepted. Recovery-only: it reports what happened to
        the operation named by `operationId` without issuing a new command, which is how a console
        that lost the 202 response learns the result. Expired operations answer 410
        `playback_operation_expired`.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string }, description: The `operationId` sent with the stop command. }
      responses:
        '200': { description: The operation state., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_activity_request, playback_operation_expired, activity_unavailable]
  /v1/admin/libraries:
    get:
      operationId: listAdminLibraries
      tags: [admin-libraries]
      summary: List libraries with administration detail
      description: >-
        Server owner only, with a five-second deadline and the owner re-checked after the read.
        Cursor-paged with `limit` 1–40. Each row carries the source configuration, the scan state
        and the revision needed for configuration writes.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200': { description: A page of libraries., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, persistence_error, timeout]
  /v1/admin/libraries/order:
    put:
      operationId: orderAdminLibraries
      tags: [admin-libraries]
      summary: Put the libraries in the owner's order
      description: >-
        Server owner only. The listed libraries come first, in the order given; a library that is
        not listed keeps its place after them. `GET /v1/libraries` returns libraries in this order
        (a server whose owner has never ordered them lists them by name).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [libraryIds]
              properties:
                libraryIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string, maxLength: 128 } }
      responses:
        '200': { description: The order as stored., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, not_found, persistence_error]
  /v1/admin/libraries/{id}/shows/{show}/settings:
    put:
      operationId: setAdminShowSettings
      tags: [admin-libraries]
      summary: Set how one show's episodes are presented
      description: >-
        Server owner only. Hide the season switcher (one list across seasons), number episodes
        across seasons ("Episode 1043"), split a long show into ranges of a hundred, and list the
        newest first. `revision` is the one the settings were read at (0 for a show that has
        none); the show workspace returns the stored settings and applies them.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, maxLength: 128 } }
        - { name: show, in: path, required: true, schema: { type: string, maxLength: 128 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [hideSeasons, absoluteNumbering, ranges, newestFirst, revision]
              properties:
                hideSeasons: { type: boolean }
                absoluteNumbering: { type: boolean }
                ranges: { type: boolean }
                newestFirst: { type: boolean }
                revision: { type: integer, minimum: 0 }
      responses:
        '200': { description: The settings as stored, with their new revision., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, not_found, show_settings_conflict, persistence_error]
  /v1/admin/jobs:
    get:
      operationId: listAdminJobs
      tags: [admin-libraries]
      summary: List ingestion jobs with administration detail
      description: >-
        Server owner only. Cursor-paged with `limit` 1–40, and additionally filterable by
        `libraryId` and `status` — the only two filters this surface accepts. Five-second deadline.
      parameters:
        - { name: libraryId, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200': { description: A page of jobs., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, persistence_error, timeout]
  /v1/admin/libraries/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      operationId: getAdminLibrary
      tags: [admin-libraries]
      summary: Read one library's administration detail
      description: >-
        Server owner only; this resource read accepts **no** `limit` or `cursor`. Returns the
        library with its sources, counts, scan state and revision, wrapped with the admin scope.
      responses:
        '200': { description: The library., content: { application/json: { schema: { $ref: '#/components/schemas/AdminLibraryEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, not_found, persistence_error, timeout]
    patch:
      operationId: renameAdminLibrary
      tags: [admin-libraries]
      summary: Rename a library
      description: >-
        Server owner only. `expectedRevision` must match the library's configuration revision; a
        mismatch answers 409 `library_configuration_conflict`. The response re-reads the library so
        the client sees the new revision without a second request.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, expectedRevision], properties: { name: { type: string }, expectedRevision: { type: integer, format: int64 } }, additionalProperties: false } } } }
      responses:
        '200': { description: The renamed library., content: { application/json: { schema: { $ref: '#/components/schemas/AdminLibraryEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, invalid_admin_query, library_configuration_conflict, persistence_error]
  /v1/admin/libraries/{id}/inventory-config:
    get:
      operationId: getLibraryInventoryConfig
      tags: [admin-libraries]
      summary: Read a library's sources and scan policy together
      description: >-
        Server owner only. Reads the library, its sources and its scan policy, then re-reads the
        library to detect a configuration change between the component reads — a mismatch answers
        `stale_continuation` rather than returning an inconsistent picture. Accepts no `limit` or
        `cursor`.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200': { description: The sources and policy., content: { application/json: { schema: { type: object, required: [scope, libraryId, revision, sources, policy], properties: { scope: { $ref: '#/components/schemas/AdminScope' }, libraryId: { type: string }, revision: { type: integer, format: int64 }, sources: { type: array, items: { type: object, additionalProperties: true } }, policy: { $ref: '#/components/schemas/ScanPolicy' } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, stale_continuation, not_found, persistence_error]
  /v1/admin/libraries/{id}/inventory:
    get:
      operationId: listLibraryInventory
      tags: [admin-libraries]
      summary: List the objects the scanner found
      description: >-
        Server owner only. Cursor-paged over the library's inventory objects, filterable by
        `sourceId` and `state`. This is the library-management surface an automation uses to see
        exactly which files are present, missing, unsupported or unassociated — `sourceId`, `state`,
        `cursor` and `limit` are the only accepted keys.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - { name: sourceId, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string, description: 'Inventory state, for example `available`, `missing`, `unsupported`.' } }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/ConsoleLimit'
      responses:
        '200': { description: A page of inventory objects., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, not_found, persistence_error]
  /v1/admin/libraries/{id}/sources/{source}/changes:
    get:
      operationId: listInventoryChanges
      tags: [admin-libraries]
      summary: Stream a source's inventory changes since a sequence
      description: >-
        Server owner only. `after` is an inventory sequence, the only accepted query parameter. Each
        page returns up to 128 changes with `nextSequence` and `hasMore`, which is how an external
        library manager tails what the scanner did without re-listing the whole inventory.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/SourceId'
        - { name: after, in: query, required: false, schema: { type: string }, description: Inventory sequence to resume from. }
      responses:
        '200': { description: A page of changes., content: { application/json: { schema: { type: object, required: [sourceId, items, nextSequence, hasMore], properties: { sourceId: { type: string }, items: { type: array, items: { type: object, additionalProperties: true } }, nextSequence: { type: string }, hasMore: { type: boolean } } } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_admin_query, not_found, persistence_error]
  /v1/admin/libraries/{id}/sources:
    post:
      operationId: addLibrarySource
      tags: [admin-libraries]
      summary: Add a source to a library
      description: >-
        Server owner only. Defines a root path with its classification, symlink policy, missing
        grace period and scan interval. `expectedRevision` fences the library's configuration, and
        `acceptReplacement` is the explicit confirmation required when the root has changed
        underneath an existing source.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceSettings' } } } }
      responses:
        '200': { description: The saved source., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, source_already_configured, source_changed, source_busy, library_configuration_conflict, source_unavailable, persistence_error]
  /v1/admin/libraries/{id}/sources/{source}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
      - $ref: '#/components/parameters/SourceId'
    patch:
      operationId: updateLibrarySource
      tags: [admin-libraries]
      summary: Change a source's settings
      description: >-
        Server owner only. Same body as adding a source; `expectedRevision` fences it. Changing the
        root of a source that already has inventory requires `acceptReplacement`, because it
        discards the association between the old root and its objects.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SourceSettings' } } } }
      responses:
        '200': { description: The saved source., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        default: { $ref: '#/components/responses/Error' }
      x-error-codes: [unauthorized, invalid_request, source_changed, source_busy, library_configuration_conflict, source_unavailable, persistence_error]
    delete:
      operationId: removeLibrarySource
      tags: [admin-libraries]
      summary: Remove a source from a library
      description: >-
        Server owner only. Requires `expectedRevision` in the body. Any scan currently running on
        the source is interrupted as part of the removal. Responds 204; the source's items remain in
        the catalogue until they are cleaned up.
