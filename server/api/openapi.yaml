      description: operations.SettingsChange — a complete document write; every field of `values` must be present.
      required: [expectedRevision, idempotencyKey, values]
      properties:
        expectedRevision: { type: integer, format: int64 }
        idempotencyKey: { type: string }
        values: { $ref: '#/components/schemas/Settings' }
      additionalProperties: false
    Settings:
      type: object
      description: operations.Settings
      required: [name, transcodingEnabled, perAccountCap, serverCap, diagnosticDays, notificationDays, jobDays]
      properties:
        name: { type: string }
        transcodingEnabled: { type: boolean }
        perAccountCap: { type: [integer, 'null'], description: Null means no per-account stream cap. }
        serverCap: { type: [integer, 'null'], description: Null means no server-wide stream cap. }
        diagnosticDays: { type: integer }
        notificationDays: { type: integer }
        jobDays: { type: integer }
        playHistoryDays: { type: integer, minimum: 0, maximum: 36500, description: "How long the play history is kept. 0, the default, keeps everything." }
      additionalProperties: false
    ScheduleChange:
      type: object
      description: operations.ScheduleChange — a complete document write; every field of `value` must be present.
      required: [expectedRevision, idempotencyKey, value]
      properties:
        expectedRevision: { type: integer, format: int64 }
        idempotencyKey: { type: string }
        value: { $ref: '#/components/schemas/Schedule' }
      additionalProperties: false
    Schedule:
      type: object
      description: operations.Schedule
      required: [id, kind, resource, enabled, timezone, startMinute, windowMinutes, catchUp]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64 }
        kind: { type: string }
        resource: { type: string }
        enabled: { type: boolean }
        timezone: { type: string }
        startMinute: { type: integer, description: Minutes past local midnight. }
        windowMinutes: { type: integer }
        catchUp: { type: boolean }
        lastSlot: { type: string }
        createdAt: { type: integer, format: int64 }
    SubmitReport:
      type: object
      description: operations.SubmitReport
      required: [idempotencyKey, category, message]
      properties:
        idempotencyKey: { type: string }
        category: { type: string }
        message: { type: string }
        itemId: { type: string }
        diagnostic: { type: [object, 'null'], additionalProperties: true, description: Client-captured context. }
      additionalProperties: false
    Triage:
      type: object
      description: operations.Triage
      required: [expectedRevision, idempotencyKey, status]
      properties:
        expectedRevision: { type: integer, format: int64 }
        idempotencyKey: { type: string }
        status: { type: string }
        reply: { type: string, description: Shown to the reporter. }
      additionalProperties: false
    JobCommand:
      type: object
      description: operations.JobCommand
      required: [expectedRevision, idempotencyKey]
      properties:
        expectedRevision: { type: integer, format: int64 }
        idempotencyKey: { type: string }
      additionalProperties: false
    RunJob:
      type: object
      description: operations.RunJob
      required: [kind, idempotencyKey]
      properties:
        kind: { type: string, description: A kind published by `GET /v1/admin/console/job-kinds`. }
        resource: { type: string, description: What the job runs over, usually a library id. }
        idempotencyKey: { type: string }
      additionalProperties: false
    Capture:
      type: object
      description: operations.Capture
      required: [component, expiresAt]
      properties:
        idempotencyKey: { type: string }
        component: { type: string, enum: [scheduler] }
        expiresAt: { type: integer, format: int64, description: Epoch milliseconds, at most one hour after server time; zero disables capture. }
      additionalProperties: false
    ExportRequest:
      type: object
      description: operations.ExportRequest
      required: [idempotencyKey, from, to, components]
      properties:
        idempotencyKey: { type: string }
        from: { type: integer, format: int64 }
        to: { type: integer, format: int64 }
        components: { type: array, items: { type: string } }
      additionalProperties: false
    ActivityStop:
      type: object
      description: playback.ActivityStop
      required: [operationId, expectedGeneration]
      properties:
        operationId: { type: string, description: Idempotency key, and the id used to recover the outcome later. }
        expectedGeneration: { type: integer, description: The session generation the owner is acting on. }
      additionalProperties: false
    PlaybackDiagnosticsEnvelope:
      type: object
      required: [scope, observedAt, freshUntil, diagnostics]
      properties:
        scope: { $ref: '#/components/schemas/AdminScope' }
        observedAt: { type: string, format: date-time }
        freshUntil: { type: string, format: date-time, description: 30 seconds after `observedAt`. }
        diagnostics: { $ref: '#/components/schemas/DeliveryDiagnostics' }
    DeliveryDiagnostics:
      type: object
      description: playback.DeliveryDiagnostics
      required: [directConfigured, hlsConfigured, finiteHlsConfigured, lifecycle, activeConversionSessions, conversionSessionLimit, conversionLimitSource, outputPolicy]
      properties:
        directConfigured: { type: boolean }
        hlsConfigured: { type: boolean }
        finiteHlsConfigured: { type: boolean }
        lifecycle: { type: string }
        activeConversionSessions: { type: [integer, 'null'] }
        conversionSessionLimit: { type: [integer, 'null'] }
        conversionLimitSource: { type: string }
        outputPolicy: { type: string }
    MountList:
      type: object
      required: [scope, revision, limits, mounts, mountSupported]
      properties:
        scope: { $ref: '#/components/schemas/AdminScope' }
        revision: { type: integer, format: int64 }
        limits: { type: object, required: [definitions, active], properties: { definitions: { type: integer, const: 8 }, active: { type: integer, const: 4 } } }
        mounts: { type: array, items: { type: object, additionalProperties: true } }
        mountSupported: { type: boolean, description: Whether this server platform can mount at all. }
    MountCommand:
      type: object
      description: mounts.Command
      required: [operationId]
      properties:
        operationId: { type: string, description: Idempotency key. }
        expectedRevision: { type: integer, format: int64 }
        action: { type: string, description: 'Forced to `create` on POST /v1/storage/mounts and `delete` on DELETE; free on the actions route.' }
        name: { type: string }
        executable: { type: string }
        remote: { type: string }
        config: { type: string }
        setup: { type: [object, 'null'], additionalProperties: true, description: 'mounts.S3Setup, for S3-backed mounts.' }
        cacheBytes: { type: [integer, 'null'], format: int64 }
        cacheFloor: { type: [integer, 'null'], format: int64 }
      additionalProperties: false
    MountReceipt:
      type: object
      description: mounts.Receipt
      required: [operationId, mountId, controlRevision, accepted, deleted]
      properties:
        operationId: { type: string }
        mountId: { type: string }
        controlRevision: { type: integer, format: int64 }
        accepted: { type: boolean }
        deleted: { type: boolean }
        mount: { type: [object, 'null'], additionalProperties: true }
    MountReceiptEnvelope:
      allOf:
        - type: object
          required: [scope]
          properties:
            scope: { $ref: '#/components/schemas/AdminScope' }
        - { $ref: '#/components/schemas/MountReceipt' }
    DAVInput:
      type: object
      description: remotesources.DAVInput
      required: [operationId, name, root]
      properties:
        operationId: { type: string, description: Idempotency key. }
        expectedGeneration: { type: integer, format: int64, description: Required on update and delete. }
        name: { type: string }
        root: { type: string, format: uri }
        username: { type: string }
        password: { type: string, format: password }
        keepConnection: { type: boolean }
        keepPassword: { type: boolean, description: Edit without re-sending the stored password. }
        insecureLocal: { type: boolean, description: Explicit opt-in for a plaintext local endpoint. }
      additionalProperties: false
    RemoteSourceReceipt:
      type: object
      description: remotesources.Receipt
      required: [operationId, accepted, removed, source]
      properties:
        operationId: { type: string }
        accepted: { type: boolean }
        removed: { type: boolean }
        source: { type: object, additionalProperties: true }
    RemoteSourceReceiptEnvelope:
      type: object
      required: [scope, receipt]
      properties:
        scope: { $ref: '#/components/schemas/AdminScope' }
        receipt: { $ref: '#/components/schemas/RemoteSourceReceipt' }
    GuideEnvelope:
      type: object
      required: [protocolVersion, serverId, guide]
      properties:
        protocolVersion: { type: string }
        serverId: { type: string }
        guide: { $ref: '#/components/schemas/Guide' }
    Guide:
      type: object
      description: livechannels.Guide
      required: [sources, state, viewerFence, start, end, timezone, channels, nextCursor, observedAt]
      properties:
        sources: { type: array, items: { type: object, additionalProperties: true } }
        state: { type: string }
        viewerFence: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        timezone: { type: string }
        channels: { type: array, items: { $ref: '#/components/schemas/GuideChannel' } }
        nextCursor: { type: string }
        observedAt: { type: string, format: date-time }
        days: { type: integer, minimum: 0, maximum: 31, description: 'How many calendar days from now (today counts as 1) the listed sources have guide data for, so a day picker offers exactly those days; 0 when none.' }
    GuideProgramme:
      type: object
      description: livechannels.Programme. The facts (subtitle, episode, categories, rating, year, starRating, flags) come from XMLTV for live sources and from the library item for Library Channel programmes (Channels spec §8.1). A programme the viewer's profile may not see (by its rating, with the same age, unrated and member-ladder rules as library items), live or Library Channel, keeps its slot and times but carries the title `Not available on this profile` and no other facts; a published recording inherits the programme's rating as its content rating.
      required: [id, channelId, title, start, end, lineage, categories, flags]
      properties:
        id: { type: string }
        channelId: { type: string }
        title: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        lineage: { type: string }
        seriesId: { type: string }
        episodeId: { type: string }
        newEvidence: { type: string, enum: [new, repeat, unknown] }
        description: { type: string }
        recordingId: { type: string }
        recordingState: { type: string }
        subtitle: { type: string, description: 'XMLTV `<sub-title>`; the episode title of a Library Channel episode.' }
        episode:
          type: object
          description: 'Season and number are 1-based (XMLTV `xmltv_ns` is 0-based and converted); `display` is `<episode-num system="onscreen">`, shown when there is no number.'
          properties: { season: { type: integer, minimum: 1 }, number: { type: integer, minimum: 1 }, display: { type: string } }
        categories: { type: array, maxItems: 16, items: { type: string }, description: 'XMLTV `<category>` in order (case-insensitive duplicates removed), or the item''s genres. The first drives the category filter.' }
        rating: { type: object, required: [system, value], properties: { system: { type: string }, value: { type: string } }, description: 'XMLTV `<rating system><value>` (e.g. VCHIP / TV-14), or the item''s content rating with an empty system.' }
        year: { type: integer, description: 'XMLTV `<date>` year, or the item''s year.' }
        starRating: { type: string, description: 'XMLTV `<star-rating><value>`, e.g. 7/10.' }
        flags:
          type: object
          required: [live, new, premiere, repeat]
          properties:
            live: { type: boolean }
            new: { type: boolean, description: Same as newEvidence = new. }
            premiere: { type: boolean }
            repeat: { type: boolean, description: Same as newEvidence = repeat. }
        image: { type: string, description: 'A path this server serves: the Library Channel item''s poster, or for a live-source programme `/v1/guide/images/{digest}` once the background import has stored the provider''s icon. A provider URL is never published.' }
    GuideChannel:
      type: object
      description: livechannels.Channel, annotated by the server with what this viewer can do right now.
      properties:
        id: { type: string }
        sourceId: { type: string }
        name: { type: string }
        number: { type: string }
        provenance: { type: string, description: Whether the channel comes from a live source or a library channel. }
        generation: { type: string, description: Empty while the schedule is still being prepared. }
        programmes: { type: array, items: { $ref: '#/components/schemas/GuideProgramme' } }
        tuneAvailable: { type: boolean }
        tuneUnavailableReason: { type: string, description: 'For example `channel_runtime_unavailable` or `schedule_preparing`.' }
        recordAvailable: { type: boolean }
        recordUnavailableReason: { type: string, description: 'For example `recording-unavailable`.' }
      additionalProperties: true
    ChannelPreferenceInput:
      type: object
      description: livechannels.PreferenceInput
      required: [sourceId, channelId, expectedRevision]
      properties:
        requestId: { type: string, description: Idempotency key. }
        sourceId: { type: string }
        channelId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        favorite: { type: boolean }
        hidden: { type: boolean }
      additionalProperties: false
    LiveSourceInput:
      type: object
      description: livechannels.SourceInput
      required: [name]
      properties:
        requestId: { type: string }
        id: { type: string, description: Present when updating. }
        expectedRevision: { type: integer, format: int64 }
        name: { type: string }
        playlist: { type: string, description: The M3U playlist document. }
        guide: { type: string, description: The XMLTV guide document. }
        tunerCount: { type: integer }
        mappings: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    RemoteLiveDraft:
      type: object
      description: livechannels.RemoteDraft
      required: [name, locator]
      properties:
        id: { type: string }
        expectedRevision: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        locator: { type: string }
        guideUrl: { type: string }
        username: { type: string }
        password: { type: string, format: password }
        confirmedLanRoots: { type: array, maxItems: 8, items: { type: string }, description: 'An explicit owner confirmation, never discovery data: exactly the roots a previous preview returned in error.confirmRoots, after the owner agreed.' }
        mappings: { type: array, items: { type: object, additionalProperties: true } }
        refreshSeconds: { type: integer }
        ownerLimit: { type: integer }
        useDiscoveredCapacity: { type: boolean }
        viewerAccess: { type: string, enum: [owner-only, server-members], description: Who may see this source's channels. }
      additionalProperties: false
    DVRRecording:
      type: object
      description: One recording, as `result.recordings[]` of `GET /v1/dvr` and `result.recording` of `GET /v1/dvr/recordings/{id}` carry it.
      required: [id, revision, occurrence, channel, programme, state, start, end]
      properties:
        id: { type: string }
        revision: { type: integer, format: int64 }
        occurrence: { type: object, properties: { sourceId: { type: string }, channelId: { type: string }, generation: { type: string }, programmeId: { type: string } } }
        channel:
          type: object
          description: The recorded channel as the owner knows it now — its current name and number, else the ones from the guide the recording was scheduled from; `name` is empty once the channel is gone from both.
          required: [id, name, number]
          properties: { id: { type: string }, name: { type: string }, number: { type: string } }
        watched: { type: [boolean, "null"], description: "The owner's watched state of the published recording (catalogue personal state); null until the recording is published." }
        programme: { type: object, additionalProperties: true }
        ruleId: { type: string }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        state: { type: string, enum: [scheduled, conflicted, waiting-source, waiting-guide, preparing, recording, finalizing, completed, incomplete-playable, failed, cancelled, pending-delete, deleted] }
        reason: { type: string }
        keep: { type: boolean }
        libraryId: { type: string }
        itemId: { type: string, description: The playable library item, set once the recording is published (completed or incomplete-playable). }
        coverageStart: { type: string }
        coverageEnd: { type: string }
        bytes: { type: integer, format: int64 }
    DVREnvelope:
      type: object
      description: Every DVR response is wrapped like this.
      required: [protocolVersion, serverId, result]
      properties:
        protocolVersion: { type: string }
        serverId: { type: string }
        result: {}
    DVRMutation:
      type: object
      description: dvr.Mutation
      required: [requestId, expectedRevision]
      properties:
        requestId: { type: string, description: Idempotency key. }
        expectedRevision: { type: integer, format: int64 }
      additionalProperties: false
    DVRScheduleInput:
      type: object
      description: dvr.ScheduleInput
      required: [requestId, occurrence]
      properties:
        requestId: { type: string }
        useDefaults: { type: boolean, description: Snapshot current server padding and retention defaults. Omitted options also use defaults. }
        occurrence: { type: object, additionalProperties: true, description: 'dvr.Occurrence: the channel, window and series identity.' }
        options: { type: object, additionalProperties: true, description: 'dvr.Options: padding and retention.' }
      additionalProperties: false
    DVRUpdateInput:
      type: object
      description: dvr.UpdateInput
      required: [requestId, expectedRevision, options]
      properties:
        requestId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        options: { type: object, additionalProperties: true }
      additionalProperties: false
    DVRKeepInput:
      type: object
      description: dvr.KeepInput
      required: [requestId, expectedRevision, keep]
      properties:
        requestId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        keep: { type: boolean, description: Exempt this recording from the retention policy. }
      additionalProperties: false
    DVRRuleConfig:
      type: object
      description: dvr.RuleConfig
      required: [name, sourceId, seriesId, enabled, episodes]
      properties:
        name: { type: string }
        sourceId: { type: string }
        seriesId: { type: string }
        enabled: { type: boolean }
        episodes: { type: string, enum: [all, new], description: '`new` never matches a programme whose new/repeat evidence is unknown.' }
        allowedChannels: { type: array, items: { type: string } }
        blockedChannels: { type: array, items: { type: string } }
        blockedKeywords: { type: array, items: { type: string } }
        keywords: { type: array, items: { type: string }, description: Matched case-insensitively; empty keywords are ignored. }
        options: { type: object, additionalProperties: true }
      additionalProperties: false
    DVRRuleInput:
      type: object
      description: dvr.RuleInput
      required: [requestId, expectedRevision, id, config]
      properties:
        requestId: { type: string }
        useDefaults: { type: boolean, description: Snapshot current server padding and retention defaults. }
        expectedRevision: { type: integer, format: int64 }
        id: { type: string, description: Must equal the path id. }
        anchor: { type: object, additionalProperties: true, description: Required only on create; unchanged thereafter. }
        config: { $ref: '#/components/schemas/DVRRuleConfig' }
      additionalProperties: false
    DVRDeleteRuleInput:
      type: object
      description: dvr.DeleteRuleInput
      required: [requestId, expectedRevision]
      properties:
        requestId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        future: { type: string, description: What to do with recordings the rule already scheduled but that have not started. }
      additionalProperties: false
    DVRStoragePolicyInput:
      type: object
      description: dvr.StoragePolicyInput
      required: [requestId, expectedRevision, policy]
      properties:
        requestId: { type: string }
        expectedRevision: { type: integer, format: int64 }
        policy: { type: object, additionalProperties: true, description: 'dvr.StoragePolicy: the recording root and retention rules.' }
      additionalProperties: false
    LibraryChannelConfig:
      type: object
      description: Collection fields are arrays, never null. Optional omitted query lists mean empty. Disabled overlay values remain bounded; enabled overlays additionally require a logo, supported corner/treatment, size 3–20 and inset 0–15.
      required: [rules, blocks, templateId, overlay]
      properties:
        templateId: {type: string, maxLength: 128}
        overlay:
          type: object
          required: [enabled, corner, treatment, sizePercent, insetPercent]
          properties:
            enabled: {type: boolean}
            corner: {type: string, maxLength: 40}
            treatment: {type: string, maxLength: 40}
            sizePercent: {type: integer, minimum: 0, maximum: 100}
            insetPercent: {type: integer, minimum: 0, maximum: 100}
        rules:
          type: array
          maxItems: 16
          items:
            type: object
            required: [weights, query]
            properties:
              weights: {type: array, maxItems: 1000, items: {type: object}}
              query:
                type: object
                required: [libraryIds, kinds, showIds]
                properties:
                  libraryIds: {type: array, maxItems: 64, items: {type: string}}
                  kinds: {type: array, maxItems: 2, items: {type: string}}
                  showIds: {type: array, maxItems: 128, items: {type: string}}
        blocks: {type: array, maxItems: 64, items: {type: object}}
    LibraryChannel:
      type: object
      required: [config]
      properties:
        config: {$ref: '#/components/schemas/LibraryChannelConfig'}
    LibraryChannelEnvelope:
      type: object
      description: >-
        Every library-channel response is `{protocolVersion, serverId, <key>}` where the key names
        what was returned — `channels`, `channel`, `config`, `preview`, `templates`, `saved`,
        `deleted` or `revision`. The key is the discriminator for the payload shape.
      required: [protocolVersion, serverId]
      properties:
        protocolVersion: { type: string }
        serverId: { type: string }
        channels: { type: array, items: { $ref: '#/components/schemas/LibraryChannel' } }
        channel: { $ref: '#/components/schemas/LibraryChannel' }
        config: { $ref: '#/components/schemas/LibraryChannelConfig' }
        preview: { type: object, additionalProperties: true }
        templates: { type: array, items: { type: object, additionalProperties: true } }
        saved: { type: boolean }
        deleted: { type: boolean }
        revision: { type: integer, format: int64 }
      additionalProperties: false
