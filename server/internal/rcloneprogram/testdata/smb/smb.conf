[global]
server role = standalone server
security = user
map to guest = Bad User
guest account = nobody
server min protocol = SMB2
disable netbios = yes
smb ports = 445
load printers = no
printing = bsd
printcap name = /dev/null
log level = 0

[media]
path = /media
read only = yes
guest ok = yes
browseable = yes
