log_format portico_status '$remote_addr [$time_local] "$request_method" $status $body_bytes_sent $request_time';
server {
    listen 80;
    listen [::]:80;
    server_name demo.getportico.tv;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 301 https://demo.getportico.tv$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.getportico.tv;
    ssl_certificate /etc/letsencrypt/live/demo.getportico.tv/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.getportico.tv/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    client_max_body_size 128k;
    location ^~ /fixtures/live/ {
        alias /srv/portico-demo/live/;
        autoindex off;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
    }
    # Media capability paths and pending enrollment receipts must never enter edge logs.
    # Metrics/structured application events provide operational evidence without request URLs.
    access_log /var/log/nginx/portico-astra-status.log portico_status;
    location ~ ^/v1/(media|enrollment-proof)/ {
        error_log /dev/null;
        proxy_pass http://127.0.0.1:32500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location / {
        proxy_pass http://127.0.0.1:32500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
