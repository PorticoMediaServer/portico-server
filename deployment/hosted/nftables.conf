#!/usr/sbin/nft -f
# portico-core-us-1 (Hosted). Inbound: SSH from anywhere; HTTP/HTTPS only from
# Cloudflare (every public name is proxied); WireGuard only from the two DNS
# nodes. Nothing listens on wg0 here: the ACME path is G12 -> DNS nodes.
flush ruleset

table inet portico {
	set cloudflare4 {
		type ipv4_addr; flags interval
		elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
	}
	set cloudflare6 {
		type ipv6_addr; flags interval
		elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
	}
	set dns_nodes {
		type ipv4_addr
		elements = { 174.138.183.45, 188.68.32.46 }
	}
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iifname "lo" accept
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport 22 accept
		ip saddr @cloudflare4 tcp dport { 80, 443 } accept
		ip6 saddr @cloudflare6 tcp dport { 80, 443 } accept
		ip saddr @dns_nodes udp dport 51820 accept
		counter drop
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
