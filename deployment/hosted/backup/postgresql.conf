# Continuous synchronous off-site WAL archiving. A 30 s switch leaves a 30 s
# transfer budget for the <=60 s RPO alert. Targets require measured drills.
wal_level = replica
archive_mode = on
archive_timeout = '30s'
archive_command = 'pgbackrest --stanza=hosted archive-push %p'
restore_command = 'pgbackrest --stanza=hosted archive-get %f %p'
