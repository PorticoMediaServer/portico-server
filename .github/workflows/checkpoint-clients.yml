name: Checkpoint corrective clients
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published corrective checkpoint source
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: checkpoint-corrective-clients
  cancel-in-progress: false
jobs:
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate frozen source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: '[[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify checkout and prepare quiet logs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/checkpoint-clients"
          cat > "$RUNNER_TEMP/checkpoint-command" <<'SH'
          #!/usr/bin/env bash
          label="$1"
          shift
          "$@" > "$RUNNER_TEMP/checkpoint-clients/$label.log" 2>&1
          result=$?
          printf 'exit=%s\n' "$result"
          tail -n 20 "$RUNNER_TEMP/checkpoint-clients/$label.log"
          exit "$result"
          SH
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Prepare fixture tools and Go licence inputs
        run: |
          bash "$RUNNER_TEMP/checkpoint-command" tools bash -c 'sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && cd server && go mod download'
      - id: deps
        name: Install exact client dependencies
        run: bash "$RUNNER_TEMP/checkpoint-command" deps npm ci --no-audit --no-fund
      - id: contract-tests
        name: contract-tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" contract-tests node --experimental-strip-types --test packages/contracts/test/*.test.ts
      - id: contract-build
        name: contract-build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" contract-build npm run build --prefix packages/contracts
      - id: core
        name: core
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" core npm run test:core
      - id: cast
        name: cast
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" cast npm run test:cast
      - id: player-checks
        name: player-checks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" player-checks bash -c 'cd packages/player-core; node scripts/check-boundary.mjs && npx --no-install tsc -p tsconfig.json'
      - id: player-units
        name: player-units
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" player-units npm run test:player
      - id: reader-checks
        name: reader-checks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" reader-checks npx --no-install tsc -p packages/reader-core/tsconfig.json
      - id: reader-units
        name: reader-units
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" reader-units npm run test:reader
      - id: web-checks
        name: web-checks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" web-checks bash -c 'cd web; status=0; npm run tokens || status=1; npm run lint:design || status=1; npm run lint:hooks || status=1; npm run lint:strings || status=1; npm run lint:boundary || status=1; node ../packages/client-core/scripts/check-preference-consumers.mjs || status=1; exit $status'
      - id: web-types
        name: web-types
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" web-types npx --no-install tsc --noEmit -p web/tsconfig.json
      - id: web-units
        name: web-units
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" web-units npm test --workspace portico-web
      - id: web-build
        name: web-build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bash "$RUNNER_TEMP/checkpoint-command" web-build npm run build --workspace portico-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: checkpoint-clients-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/checkpoint-clients/
          if-no-files-found: error
          retention-days: 14
