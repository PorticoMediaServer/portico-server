name: Security

on:
  workflow_dispatch:
  pull_request:
  workflow_call:
    inputs:
      nightly:
        type: boolean
        default: false
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # MAIN scans must finish even while small area commits continue to land.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secrets:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Scan Git history for secrets
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python3 scripts/check-gitleaks-config.py "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"
      - name: Report finding locations without secret values
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = Path(os.environ['RUNNER_TEMP']) / 'gitleaks-report.json'
          if report.exists():
              fields = ('RuleID', 'File', 'StartLine', 'EndLine', 'Commit', 'Fingerprint')
              print(json.dumps([{key: finding.get(key) for key in fields} for finding in json.loads(report.read_text())], indent=2))
          else:
              print('No finding report was produced; inspect the scanner setup failure.')
          PY

  codeql:
    if: inputs.nightly == true
    runs-on: ubuntu-24.04
    strategy: {matrix: {language: [go, javascript-typescript]}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: matrix.language == 'go'
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: github/codeql-action/init@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3
        with: {languages: '${{ matrix.language }}', build-mode: '${{ matrix.language == ''go'' && ''manual'' || ''none'' }}'}
      - name: Build the Go modules
        if: matrix.language == 'go'
        run: |
          (cd apikit && go build ./...)
          (cd server && go build ./...)
      - uses: github/codeql-action/analyze@d6317709a54fd87078d323eeb0e48ec331c8e621 # v3

  go-vulnerabilities:
    if: inputs.nightly == true
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: {module: [apikit, server]}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: '${{ matrix.module }}/go.mod', cache-dependency-path: '${{ matrix.module }}/go.sum'}
      - name: Check reachable Go vulnerabilities
        working-directory: ${{ matrix.module }}
        env: {GOFLAGS: '-p=2', GOTOOLCHAIN: local}
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  javascript-vulnerabilities:
    if: inputs.nightly == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version-file: .node-version, cache: npm}
      - name: Check JavaScript dependency advisories
        run: npm audit --audit-level=high
