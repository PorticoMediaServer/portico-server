name: Nightly
on:
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Finish the running MAIN checkpoint and retain only the newest pending one.
  # Source merges continue independently; pull-request supersessions can stop.
  cancel-in-progress: false
env:
  PORTICO_TEST_TIER: default
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No built binaries or large files in Git (A77)
        run: scripts/check-repo-binaries.sh
  go:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [apikit, server]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: ${{ matrix.module != 'apikit' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Build server playback helper
        if: matrix.module == 'server'
        run: |
          cd server
          go build -o ../.scratch/portico-server ./cmd/server
          echo "PORTICO_PLAYBACK_TEST_HELPER=$GITHUB_WORKSPACE/.scratch/portico-server" >> "$GITHUB_ENV"
      - name: Go test capacity
        run: |
          go version
          printf 'Available processors: '; getconf _NPROCESSORS_ONLN
          printf 'GOMAXPROCS: %s\n' "${GOMAXPROCS:-runtime default}"
          for path in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /proc/loadavg; do
            if [ -r "$path" ]; then printf '%s\n' "$path"; cat "$path"; fi
          done
      - name: Test module
        run: ../scripts/test-go-module.sh '${{ matrix.module }}'
        working-directory: ${{ matrix.module }}
      - name: Go test capacity after tests
        if: ${{ !cancelled() }}
        run: |
          for path in /sys/fs/cgroup/cpu.stat /proc/loadavg; do
            if [ -r "$path" ]; then printf '%s\n' "$path"; cat "$path"; fi
          done
      - name: Check generated contracts
        if: matrix.module == 'server'
        run: |
          cd server
          go run ./cmd/apigen
          git diff --exit-code -- api/portico.openapi.json ../packages/contracts/src
      - name: Vet application and maintained SQLite driver
        working-directory: ${{ matrix.module }}
        run: |
          ../scripts/vet-go.sh

  clients:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # One Node for CI, the release build and the container image: `.node-version` (the Dockerfile's
        # web stage names the same release; scripts/check-node-version.mjs keeps them together).
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Download Go dependencies for the offline licence inventory
        working-directory: server
        run: go mod download
      - name: Audio fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: node scripts/check-node-version.mjs
      - run: npm ci
      - run: node --experimental-strip-types --test packages/contracts/test/*.test.ts
      - run: npm run build --prefix packages/contracts
      - name: Core client tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: npm run test:core
      - if: ${{ !cancelled() }}
        run: npm run check:web
      - if: ${{ !cancelled() }}
        run: npm run build --workspace portico-web

      - if: ${{ !cancelled() }}
        run: npm run check:player
      - if: ${{ !cancelled() }}
        run: npm run check:reader
      - if: ${{ !cancelled() }}
        run: npm run check --workspace portico-web-next

  security:
    uses: ./.github/workflows/security.yml
    with: {nightly: true}

  summary:
    if: ${{ always() }}
    needs: [repository, go, clients, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Nightly result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
