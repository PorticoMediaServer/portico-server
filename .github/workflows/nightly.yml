name: Full checkpoint
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Full checkpoint, or a Go component continuation of that checkpoint
        type: choice
        options: [all, go, server, server-residual]
        default: all
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Finish the running MAIN checkpoint and retain only the newest pending one.
  # Source merges continue independently; pull-request supersessions can stop.
  cancel-in-progress: false
env:
  PORTICO_TEST_TIER: default
jobs:
  repository:
    if: ${{ inputs.scope == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: No built binaries or large files in Git (A77)
        run: scripts/check-repo-binaries.sh
  go:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON((inputs.scope == 'all' || inputs.scope == 'go') && '["apikit","server"]' || '["server"]') }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: go-tools
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: ${{ matrix.module != 'apikit' }}
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Build server playback helper
        if: matrix.module == 'server'
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-go"
          status=0
          (cd server && go build -o ../.scratch/portico-server ./cmd/server) > "$RUNNER_TEMP/checkpoint-go/build.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/checkpoint-go/build.log"
          test "$status" = 0
          echo "PORTICO_PLAYBACK_TEST_HELPER=$GITHUB_WORKSPACE/.scratch/portico-server" >> "$GITHUB_ENV"
      - name: Go test capacity
        run: |
          go version
          printf 'Available processors: '; getconf _NPROCESSORS_ONLN
          printf 'GOMAXPROCS: %s\n' "${GOMAXPROCS:-runtime default}"
          for path in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu.stat /proc/loadavg; do
            if [ -r "$path" ]; then printf '%s\n' "$path"; cat "$path"; fi
          done
      - name: Test module
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-go"
          status=0
          if [ '${{ inputs.scope }}' = server-residual ]; then
            # Only the three packages which failed the preceding full server checkpoint.
            go test ./internal/httpapi ./internal/metadata ./internal/operations > "$RUNNER_TEMP/checkpoint-go/tests.log" 2>&1 || status=$?
          else
            ../scripts/test-go-module.sh '${{ matrix.module }}' > "$RUNNER_TEMP/checkpoint-go/tests.log" 2>&1 || status=$?
          fi
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/checkpoint-go/tests.log"
          exit "$status"
        working-directory: ${{ matrix.module }}
      - name: Go test capacity after tests
        if: ${{ !cancelled() }}
        run: |
          for path in /sys/fs/cgroup/cpu.stat /proc/loadavg; do
            if [ -r "$path" ]; then printf '%s\n' "$path"; cat "$path"; fi
          done
      - name: Check generated contracts
        if: ${{ !cancelled() && matrix.module == 'server' && steps.go-tools.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-go"
          status=0
          (cd server && go run ./cmd/apigen && git diff --exit-code -- api/portico.openapi.json ../packages/contracts/src ../packages/player-core/src/quality-ladder.ts internal/httpapi/route_lanes.go) > "$RUNNER_TEMP/checkpoint-go/generation.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/checkpoint-go/generation.log"
          exit "$status"
      - name: Vet application and maintained SQLite driver
        if: ${{ !cancelled() && steps.go-tools.outcome == 'success' }}
        working-directory: ${{ matrix.module }}
        run: |
          mkdir -p "$RUNNER_TEMP/checkpoint-go"
          status=0
          ../scripts/vet-go.sh > "$RUNNER_TEMP/checkpoint-go/vet.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/checkpoint-go/vet.log"
          exit "$status"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: checkpoint-go-${{ matrix.module }}-${{ github.sha }}
          path: ${{ runner.temp }}/checkpoint-go/
          if-no-files-found: ignore
          retention-days: 14

  clients:
    if: ${{ inputs.scope == 'all' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # One Node for CI, the release build and the container image: `.node-version` (the Dockerfile's
        # web stage names the same release; scripts/check-node-version.mjs keeps them together).
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Download Go dependencies for the offline licence inventory
        working-directory: server
        run: go mod download
      - name: Audio fixture tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - run: node scripts/check-node-version.mjs
      - run: npm ci
      - run: node --experimental-strip-types --test packages/contracts/test/*.test.ts
      - run: npm run build --prefix packages/contracts
      - name: Core client tests
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        run: npm run test:core
      - if: ${{ !cancelled() }}
        run: npm run check:web
      - if: ${{ !cancelled() }}
        run: npm run build --workspace portico-web

      - if: ${{ !cancelled() }}
        run: npm run check:player
      - if: ${{ !cancelled() }}
        run: npm run check:reader
      - if: ${{ !cancelled() }}
        run: npm run check --workspace portico-web

  security:
    if: ${{ inputs.scope == 'all' }}
    uses: ./.github/workflows/security.yml
    with: {nightly: true}

  summary:
    if: ${{ always() }}
    needs: [repository, go, clients, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Nightly result
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS" >> "$GITHUB_STEP_SUMMARY"
