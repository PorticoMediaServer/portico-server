name: Sonic music analysis toolchain
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonic-toolchain
  cancel-in-progress: false
env:
  CI: '1'
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  OMP_NUM_THREADS: '1'
  TF_NUM_INTRAOP_THREADS: '1'
  TF_NUM_INTEROP_THREADS: '1'
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Export the verified original ISC model once
        shell: bash
        run: |
          set -euo pipefail
          export UV_CACHE_DIR="$RUNNER_TEMP/uv-cache" UV_PYTHON_INSTALL_DIR="$RUNNER_TEMP/python"
          python3 -m venv "$RUNNER_TEMP/bootstrap"
          "$RUNNER_TEMP/bootstrap/bin/pip" install --quiet --disable-pip-version-check uv==0.9.3
          "$RUNNER_TEMP/bootstrap/bin/uv" venv --quiet --python 3.11.11 "$RUNNER_TEMP/converter"
          "$RUNNER_TEMP/bootstrap/bin/uv" pip install --quiet --no-progress --python "$RUNNER_TEMP/converter/bin/python" -r third_party/musicnn/requirements-export.txt
          mkdir -p .sonic-model
          python3 - <<'PY'
          import json, pathlib, urllib.request
          lock = json.load(open('third_party/musicnn/model.lock.json'))
          with urllib.request.urlopen(lock['distribution']['url'], timeout=120) as response:
              data = response.read(lock['distribution']['bytes'] + 1)
          pathlib.Path('.sonic-model/original.whl').write_bytes(data)
          PY
          python3 scripts/prepare-musicnn-model.py .sonic-model/checkpoint --wheel .sonic-model/original.whl
          "$RUNNER_TEMP/converter/bin/python" scripts/export-musicnn-onnx.py .sonic-model/checkpoint .sonic-model/musicnn-mtt --conformance .sonic-model/conformance.json
          python3 - <<'PY'
          import json, pathlib
          lock = json.load(open('third_party/musicnn/model.lock.json'))
          model = json.load(open('.sonic-model/musicnn-mtt/model.json'))
          assert (model['sha256'], model['bytes']) == (lock['onnx']['sha256'], lock['onnx']['bytes'])
          pathlib.Path('.sonic-model/model.lock.json').write_text(json.dumps(lock, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonic-original-model
          path: |
            .sonic-model/musicnn-mtt/
            .sonic-model/conformance.json
            .sonic-model/model.lock.json
          if-no-files-found: error
          retention-days: 14
  build:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64, sdk: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64, sdk: linux-aarch64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: sonic-original-model, path: .sonic-model}
      - name: Build and package the native verified runtime
        env: {SDK_TARGET: '${{ matrix.sdk }}', BUNDLE_TARGET: '${{ matrix.target }}'}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sonic-build .sonic-output
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          lock = json.load(open('third_party/portico-sonic/runtime.lock.json'))
          package = lock['packages'][os.environ['SDK_TARGET']]
          with urllib.request.urlopen(package['url'], timeout=120) as response:
              data = response.read((100 << 20) + 1)
          pathlib.Path('.sonic-build/runtime.tgz').write_bytes(data)
          PY
          python3 scripts/prepare-sonic-runtime.py .sonic-build/sdk --archive .sonic-build/runtime.tgz --target "$SDK_TARGET"
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install --quiet --disable-pip-version-check -r third_party/portico-sonic/requirements-build.txt
          export PATH="$RUNNER_TEMP/build-tools/bin:$PATH"
          scripts/build-sonic-runtime.sh "$PWD/.sonic-build/sdk" "$PWD/.sonic-build/cmake" "$PWD/.sonic-build/portico-sonic"
          tag="$(python3 -c "import json;print(json.load(open('third_party/portico-sonic/runtime.lock.json'))['releaseTag'])")"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          archive=".sonic-output/portico-sonic-${tag}-${BUNDLE_TARGET}.tar.xz"
          python3 scripts/sonic-bundle.py package "$archive" --helper .sonic-build/portico-sonic --sdk .sonic-build/sdk --model .sonic-model/musicnn-mtt --target "$BUNDLE_TARGET" --source-revision "$GITHUB_SHA"
          python3 scripts/sonic-bundle.py extract .sonic-build/verified --archive "$archive" --target "$BUNDLE_TARGET"
          scripts/run-sonic-cpu-conformance.sh --bundle "$PWD/.sonic-build/verified" "$PWD/.sonic-model/conformance.json" "$BUNDLE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonic-${{ matrix.target }}
          path: .sonic-output/*.tar.xz
          if-no-files-found: error
  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {path: .sonic-release, pattern: 'sonic-linux-*', merge-multiple: true}
      - name: Publish the two conformant bundles without moving latest
        env: {GH_TOKEN: '${{ github.token }}'}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 -c "import json;print(json.load(open('third_party/portico-sonic/runtime.lock.json'))['releaseTag'])")"
          test -s ".sonic-release/portico-sonic-${tag}-linux-x64.tar.xz"
          test -s ".sonic-release/portico-sonic-${tag}-linux-arm64.tar.xz"
          (cd .sonic-release && sha256sum ./*.tar.xz | sort -k2 > checksums.sha256)
          if gh release view "$tag" >/dev/null 2>&1; then echo 'Bump Sonic releaseTag before publishing another build.' >&2; exit 1; fi
          gh release create "$tag" .sonic-release/* --target "$GITHUB_SHA" --latest=false --title "Sonic runtime $tag" \
            --notes 'Native Linux x64 and ARM64 musicnn/ONNX Runtime bundles. Both run the original-checkpoint CPU conformance and supervised server runtime checks. ISC model, original MIT runtime notices, GPLv3 helper and corresponding source are included.'
