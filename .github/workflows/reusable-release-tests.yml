name: Release tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/portico-media-server ./cmd/porticod
      - run: /tmp/portico-media-server build-identity

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24}
      - run: npm --prefix packages/portico-client-core ci --no-audit --no-fund
      - run: npm --prefix packages/portico-client-core test
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test -- --maxWorkers=1
      - run: npm --prefix web run build
      - run: npm --prefix web run verify:bundle
