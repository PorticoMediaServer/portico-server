name: Release tests

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact tag or ref whose source must be tested
        required: true
        type: string

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.source_ref }}'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - name: Install qualified FFmpeg test dependency
        env: {GH_TOKEN: '${{ github.token }}'}
        run: ./scripts/install-qualified-ffmpeg.sh linux-x64
      - run: go vet ./...
      - name: Run the full server suite
        run: go test ./... -count=1 -timeout=20m
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o /tmp/portico-media-server ./cmd/porticod
      - run: /tmp/portico-media-server build-identity

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.source_ref }}'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 24}
      - run: npm --prefix packages/portico-client-core ci --no-audit --no-fund
      - run: npm --prefix packages/portico-client-core test
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test -- --maxWorkers=1
      - run: npm --prefix web run build
      - run: npm --prefix web run verify:bundle
