name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Optional comparison commit (otherwise use origin/main)
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: merge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI_BASE: ${{ inputs.base || github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
  GOTOOLCHAIN: go1.26.10
  PORTICO_TEST_TIER: default
jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.ref }}', fetch-depth: 0}
      - run: scripts/check-repo-binaries.sh
      - run: python3 scripts/test-ci-affected.py
  go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {module: [apikit, server]}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: portico, POSTGRES_PASSWORD: disposable-ci-password, POSTGRES_DB: portico_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.ref }}', fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: '${{ matrix.module }}/go.mod', cache-dependency-path: '${{ matrix.module }}/go.sum'}
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Changed Go tests and vet (catalogue full suite is nightly)
        run: python3 scripts/ci-affected.py go --module '${{ matrix.module }}'
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: {area: [auth, media]}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: portico, POSTGRES_PASSWORD: disposable-ci-password, POSTGRES_DB: portico_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.ref }}', fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Disposable database and genuine subprocess helper
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
          (cd server && go build -o ../.scratch/portico-server ./cmd/server)
          echo "PORTICO_PLAYBACK_TEST_HELPER=$PWD/.scratch/portico-server" >> "$GITHUB_ENV"
      - name: Sign-in, sessions, account/profile privacy, restrictions, egress, sandbox and spawn allowlist
        run: python3 scripts/ci-affected.py go --group '${{ matrix.area }}'
  clients:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ inputs.ref }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - run: npm ci --no-audit --no-fund
      - name: Core and web types
        run: |
          npx --no-install tsc -p packages/client-core/tsconfig.json
          npx --no-install tsc -p packages/player-core/tsconfig.json
          npx --no-install tsc -p packages/reader-core/tsconfig.json
          npx --no-install tsc -p web-next/tsconfig.json --noEmit
          npx --no-install tsc -p web/tsconfig.json --noEmit
      - if: ${{ !cancelled() }}
        name: Affected tests plus mandatory account/session/privacy checks
        run: python3 scripts/ci-affected.py js
