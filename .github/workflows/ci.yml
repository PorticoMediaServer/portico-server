name: CI
on:
  schedule:
    - cron: '33 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: merge-${{ github.ref }}
  cancel-in-progress: false
env:
  CI_FULL_TREE: '1'
  GOTOOLCHAIN: go1.26.10
jobs:
  repository:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - name: Check out canonical API toolkit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: PorticoMediaServer/portico-server
          # Compare the published default branch, as the native copy check does.
          # Publish canonical toolkit fixes there before expecting this gate to pass.
          path: .scratch/portico-server
          sparse-checkout: apikit
          persist-credentials: false
      - name: Check shared API toolkit
        run: PORTICO_SERVER_REPO="$PWD/.scratch/portico-server" scripts/shared-apikit.sh
      - name: No built binaries or large files in Git
        run: scripts/check-repo-binaries.sh
      - run: python3 scripts/test-ci-affected.py
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  go:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [apikit, hosted, dns]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: hosted-services/${{ matrix.module }}/go.mod
          cache: ${{ matrix.module != 'apikit' }}
          cache-dependency-path: hosted-services/${{ matrix.module }}/go.sum
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Build every Go package
        working-directory: hosted-services/${{ matrix.module }}
        run: |
          status=0
          go build ./... > "$RUNNER_TEMP/go-build.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/go-build.log"
          exit "$status"
      - name: Full Go module tests and vet
        run: |
          status=0
          python3 scripts/ci-affected.py go --module 'hosted-services/${{ matrix.module }}' > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: hosted-services/hosted/go.mod
          cache: true
          cache-dependency-path: hosted-services/hosted/go.sum
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Full Go module tests and vet
        run: |
          status=0
          python3 scripts/ci-affected.py go --module hosted-services/hosted --group hosted > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

