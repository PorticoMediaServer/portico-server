name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Draft component releases require maintainer-level visibility. Return this
    # to contents: read after the first qualified FFmpeg release is public.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install qualified FFmpeg test dependency
        env: {GH_TOKEN: '${{ github.token }}'}
        run: ./scripts/install-qualified-ffmpeg.sh linux-x64
      - run: go vet ./...
      - run: go test ./... -count=1

  web:
    name: Web and client core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            packages/portico-client-core/package-lock.json
            web/package-lock.json
      - run: npm --prefix packages/portico-client-core ci --no-audit --no-fund
      - run: npm --prefix packages/portico-client-core test
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test -- --maxWorkers=1
      - run: npm --prefix web run build
      - run: npm --prefix web run verify:bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: ci-web-dist, path: web/dist, if-no-files-found: error}

  windows-package:
    name: Package Windows ${{ matrix.file_arch }}
    needs: web
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, file_arch: x64, toolchain_target: windows-x64}
          - {goarch: arm64, file_arch: arm64, toolchain_target: windows-arm64}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: ci-web-dist, path: web/dist}
      - name: Download qualified FFmpeg
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          toolchain_tag="$(node -p "require('./media-toolchain/sources.lock.json').releaseTag")"
          mkdir -p .toolchain/ffmpeg
          gh release download "$toolchain_tag" --pattern "portico-ffmpeg-${toolchain_tag}-${{ matrix.toolchain_target }}.tar.xz" --dir .toolchain
          tar -xJf .toolchain/*.tar.xz -C .toolchain/ffmpeg
      - run: choco install nsis --no-progress --yes
      - run: ./scripts/package-windows.sh '0.0.0' '${{ matrix.goarch }}' '${{ matrix.file_arch }}' .toolchain/ffmpeg '${{ github.run_number }}'
      - run: |
          test -s 'dist/Portico-Media-Server-Windows-${{ matrix.file_arch }}-Portable.zip'
          test -s 'dist/Portico-Media-Server-Windows-${{ matrix.file_arch }}-Setup.exe'

  compile:
    name: Compile ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-x64, goos: linux, goarch: amd64, output: portico-media-server}
          - {target: linux-arm64, goos: linux, goarch: arm64, output: portico-media-server}
          - {target: windows-x64, goos: windows, goarch: amd64, output: portico-media-server.exe}
          - {target: windows-arm64, goos: windows, goarch: arm64, output: portico-media-server.exe}
          - {target: macos-arm64, goos: darwin, goarch: arm64, output: portico-media-server}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - run: mkdir -p dist && GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -trimpath -o dist/${{ matrix.output }} ./cmd/porticod
      - run: test -s dist/${{ matrix.output }}

  container-build:
    name: Containerized server build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: docker build --target server-build --build-arg VERSION=0.0.0 --build-arg BUILD_NUMBER=${{ github.run_number }} --build-arg COMMIT=${{ github.sha }} --build-arg BUILT_AT=2026-01-01T00:00:00Z --build-arg TARGETARCH=amd64 -f Dockerfile .
