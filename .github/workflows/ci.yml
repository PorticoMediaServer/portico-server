name: CI
on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out and test
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'ci-main' || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false
env:
  CI_FULL_TREE: '1'
  GOTOOLCHAIN: go1.26.10
  PORTICO_TEST_TIER: default
jobs:
  repository:
    if: ${{ always() }}
    needs: [python-regressions]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - run: scripts/check-repo-binaries.sh
      - name: Require the Python regression inventory
        if: ${{ always() }}
        env:
          PYTHON_RESULT: ${{ needs.python-regressions.result }}
        run: test "$PYTHON_RESULT" = success
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  python-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Provision the pinned release-test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/python-regressions-venv"
          "$RUNNER_TEMP/python-regressions-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/requirements-release.txt
          echo "$RUNNER_TEMP/python-regressions-venv/bin" >> "$GITHUB_PATH"
          for tool in bash tar zip sed; do command -v "$tool"; done
      - name: Run the explicit offline regression inventory
        run: python3 scripts/run-python-regressions.py --report-dir "$RUNNER_TEMP/python-regressions"
      - name: Retain per-test receipts and complete suite logs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-python-regressions
          path: ${{ runner.temp }}/python-regressions/**
          if-no-files-found: error
          retention-days: 7

  go-shards:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - {module: server, shard: 0, shards: 4}
          - {module: server, shard: 1, shards: 4}
          - {module: server, shard: 2, shards: 4}
          - {module: server, shard: 3, shards: 4}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: portico, POSTGRES_PASSWORD: disposable-ci-password, POSTGRES_DB: portico_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: '${{ matrix.module }}/go.mod', cache-dependency-path: '${{ matrix.module }}/go.sum'}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - name: Official server build tags
        # One list, from scripts/release-build-tags.py: CI compiles the same
        # reader capability every official build ships, so tagged-only code
        # cannot rot between releases.
        run: echo "PORTICO_GO_TAGS=$(python3 scripts/release-build-tags.py --capability)" >> "$GITHUB_ENV"
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Build every Go package
        working-directory: ${{ matrix.module }}
        run: |
          status=0
          go build -tags "$PORTICO_GO_TAGS" ./... > "$RUNNER_TEMP/go-build.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/go-build.log"
          exit "$status"
      - if: ${{ !cancelled() }}
        name: Full Go module tests and vet
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: ${{ matrix.shards }}
          CI_GO_RESULTS: ${{ runner.temp }}/go-results-${{ matrix.module }}-${{ matrix.shard }}.jsonl
        run: |
          status=0
          test -n "$PORTICO_GO_TAGS" || { echo "PORTICO_GO_TAGS is unset; refusing to run tests without the official capability" >&2; exit 2; }
          python3 scripts/ci-affected.py go --module '${{ matrix.module }}' > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-go-${{ matrix.module }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/go-results-*.jsonl
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  go-apikit:
    name: go (apikit)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: portico, POSTGRES_PASSWORD: disposable-ci-password, POSTGRES_DB: portico_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: 'apikit/go.mod', cache-dependency-path: 'apikit/go.sum'}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - name: Disposable database
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - name: Build every Go package
        working-directory: apikit
        run: |
          status=0
          go build ./... > "$RUNNER_TEMP/go-build.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/go-build.log"
          exit "$status"
      - if: ${{ !cancelled() }}
        name: Full Go module tests and vet
        env:
          CI_SHARD_INDEX: '0'
          CI_SHARD_TOTAL: '1'
          CI_GO_RESULTS: ${{ runner.temp }}/go-results-apikit-0.jsonl
        run: |
          status=0
          python3 scripts/ci-affected.py go --module 'apikit' > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-go-apikit-0
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/go-results-*.jsonl
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: {area: [auth, media]}
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: portico, POSTGRES_PASSWORD: disposable-ci-password, POSTGRES_DB: portico_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - name: Disposable database and genuine subprocess helper
        run: |
          mkdir -p .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
          tags="$(python3 scripts/release-build-tags.py --capability)"
          echo "PORTICO_GO_TAGS=$tags" >> "$GITHUB_ENV"
          (cd server && go build -tags "$tags" -o ../.scratch/portico-server ./cmd/server)
          echo "PORTICO_PLAYBACK_TEST_HELPER=$PWD/.scratch/portico-server" >> "$GITHUB_ENV"
      - name: Sign-in, sessions, account/profile privacy, restrictions, egress, sandbox and spawn allowlist
        env:
          CI_TEST_REPORT_DIR: ${{ runner.temp }}/ci-security-report
        run: |
          status=0
          python3 scripts/ci-affected.py go --group '${{ matrix.area }}' > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=$?
          tail -n 20 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/ci-security-report/**
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7

  clients-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - run: npm ci --no-audit --no-fund
      - name: Core and web types
        run: |
          status=0
          for project in packages/client-core packages/player-core packages/reader-core web; do
            npx --no-install tsc -p "$project/tsconfig.json" --noEmit > "$RUNNER_TEMP/types-${project//\//-}.log" 2>&1 || status=1
            echo "Types: $project"
            tail -n 20 "$RUNNER_TEMP/types-${project//\//-}.log"
          done
          exit "$status"
      - if: ${{ !cancelled() }}
        name: Generated contracts and the Cast bundle are current
        run: |
          (cd server && go run ./cmd/apigen)
          node scripts/cast/generate.mjs
          git diff --exit-code -- server/api/portico.openapi.json packages/contracts/src server/receiver/cast/contracts.js
      - if: ${{ !cancelled() }}
        name: Web lint (required)
        run: |
          status=0
          npm run lint:design --workspace portico-web || status=1
          npm run lint:hooks --workspace portico-web || status=1
          npm run lint:strings --workspace portico-web || status=1
          npm run lint:boundary --workspace portico-web || status=1
          exit "$status"
      - name: Retain full diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-${{ github.job }}-${{ strategy.job-index || '0' }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/go-build.log
            ${{ runner.temp }}/types*.log
          if-no-files-found: ignore
          retention-days: 7


  clients-tests:
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: '${{ inputs.ref || github.sha }}', fetch-depth: 0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version-file: .node-version, cache: npm}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - run: npm ci --no-audit --no-fund
      - name: Use the runner temp directory for portable browser fixtures
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install media fixture tools when not already provisioned
        run: |
          if command -v ffmpeg >/dev/null; then
            ffmpeg -version
          else
            # The image's Azure HTTP mirror can stall on small downloads. Use
            # Ubuntu's signed HTTPS archives for this dependency transaction.
            media_sources="$RUNNER_TEMP/media-tools.sources"
            cat > "$media_sources" <<'SOURCES'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          SOURCES
            apt_options=(-o "Dir::Etc::sourcelist=$media_sources" -o 'Dir::Etc::sourceparts=-'
              -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
            timeout 180s sudo apt-get "${apt_options[@]}" update
            timeout 300s sudo apt-get "${apt_options[@]}" install --no-install-recommends -y ffmpeg
            ffmpeg -version
          fi
      - name: Check the provisioned browser for synthetic tooling regressions
        if: ${{ !cancelled() }}
        run: |
          test -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          "$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH" --version
      - name: Make the declared Go graph available to offline license generation
        if: ${{ !cancelled() }}
        working-directory: server
        run: timeout 180s go mod download
      - name: Complete test shard plus mandatory account/session/privacy checks
        if: ${{ !cancelled() }}
        env:
          CI_SHARD_INDEX: ${{ matrix.shard }}
          CI_SHARD_TOTAL: '4'
          CI_TEST_REPORT_DIR: ${{ runner.temp }}/ci-report
        run: |
          status=0
          # Cross-language contract vectors come from the actual current Go HTTP
          # producer, never hand-written successful responses. A producer failure
          # is retained while the remainder of the JS selection still runs.
          export PORTICO_CONCURRENCY_DIAGNOSTICS_FIXTURE_DIR="$RUNNER_TEMP/client-fixtures/concurrency"
          export PORTICO_CONSOLE_REGISTRY_FIXTURE_DIR="$RUNNER_TEMP/client-fixtures/registry"
          export PORTICO_READING_HOME_FIXTURE_DIR="$RUNNER_TEMP/client-fixtures/reading-home"
          mkdir -p "$PORTICO_CONCURRENCY_DIAGNOSTICS_FIXTURE_DIR" "$PORTICO_CONSOLE_REGISTRY_FIXTURE_DIR" "$PORTICO_READING_HOME_FIXTURE_DIR" "$CI_TEST_REPORT_DIR/producers"
          (cd server && go test -json -count=1 -timeout=180s ./internal/httpapi -run '^(TestConcurrencyDiagnosticsMemoryLimitWire|TestConsoleRegistryProducerRecordsNullableDefaults|TestHomeReadingSavedDeferredHTTP)$') > "$CI_TEST_REPORT_DIR/producers/httpapi.jsonl" 2>&1 || status=1
          python3 scripts/ci-affected.py js > "$RUNNER_TEMP/full-ci.log" 2>&1 || status=1
          tail -n 40 "$RUNNER_TEMP/full-ci.log"
          exit "$status"
      - name: Retain per-test results and file diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-clients-tests-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/full-ci.log
            ${{ runner.temp }}/ci-report/**
          if-no-files-found: error
          retention-days: 7

  # Preserve the branch's required contexts while requiring every complete shard.
  go:
    name: go (server)
    if: ${{ always() }}
    needs: [go-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - name: Require all Go shards
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = {name: row['result'] for name, row in json.loads(os.environ['RESULTS']).items()}
          print(results)
          raise SystemExit(any(result != 'success' for result in results.values()))
          PYCODE

  clients:
    if: ${{ always() }}
    needs: [clients-checks, clients-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Actual job toolchain
        run: |
          node --version || true
          go version || true
      - name: Require client checks and every test shard
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = {name: row['result'] for name, row in json.loads(os.environ['RESULTS']).items()}
          print(results)
          raise SystemExit(any(result != 'success' for result in results.values()))
          PYCODE
