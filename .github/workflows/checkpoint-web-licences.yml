name: Checkpoint web licence inventory
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published checkpoint source
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: checkpoint-web-licences
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/web-licences"
          git rev-parse HEAD > "$RUNNER_TEMP/web-licences/source-sha.log"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install exact generator inputs
        run: |
          status=0
          (npm ci --no-audit --no-fund && cd server && go mod download) > "$RUNNER_TEMP/web-licences/setup.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/web-licences/setup.log"
          exit "$status"
      - name: Run the existing licence generator
        run: |
          status=0
          node --experimental-strip-types web/scripts/licences.ts > "$RUNNER_TEMP/web-licences/generate.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/web-licences/generate.log"
          exit "$status"
      - name: Preserve the generated inventory only
        run: |
          git diff --name-only > "$RUNNER_TEMP/web-licences/changed-paths.log"
          if grep -vx 'web/src/generated/licences.json' "$RUNNER_TEMP/web-licences/changed-paths.log"; then exit 1; fi
          git diff --binary -- web/src/generated/licences.json > "$RUNNER_TEMP/web-licences/generation.patch"
          cp web/src/generated/licences.json "$RUNNER_TEMP/web-licences/licences.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: checkpoint-web-licences-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/web-licences/
          if-no-files-found: error
          retention-days: 14
