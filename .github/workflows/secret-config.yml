name: Secret scan configuration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .gitleaks.toml
      - .gitleaksignore
      - scripts/check-gitleaks-config.py
      - .github/workflows/secret-config.yml
permissions:
  contents: read
jobs:
  scope-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify narrow exceptions retain real-key detection
        run: |
          curl --fail --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          python3 scripts/check-gitleaks-config.py "$RUNNER_TEMP/gitleaks"
