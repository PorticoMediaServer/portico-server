name: Release Portico Media Server

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and publish
        required: true

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref_name }}${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      toolchain_tag: ${{ steps.identity.outputs.toolchain_tag }}
      commit: ${{ steps.identity.outputs.commit }}
      built_at: ${{ steps.identity.outputs.built_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.tag || github.ref }}', fetch-depth: 0}
      - id: identity
        env: {REQUESTED_TAG: '${{ inputs.tag || github.ref_name }}'}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          version="${REQUESTED_TAG#v}"
          toolchain_tag="$(node -p "require('./media-toolchain/sources.lock.json').releaseTag")"
          {
            echo "tag=$REQUESTED_TAG"
            echo "version=$version"
            echo "toolchain_tag=$toolchain_tag"
            echo "commit=$(git rev-parse HEAD)"
            echo "built_at=$(git show -s --format=%cI HEAD)"
          } >> "$GITHUB_OUTPUT"

  tests:
    needs: identity
    uses: ./.github/workflows/reusable-release-tests.yml
    with: {source_ref: '${{ needs.identity.outputs.tag }}'}

  web:
    needs: [identity, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24, cache: npm, cache-dependency-path: 'packages/portico-client-core/package-lock.json'}
      - run: ./scripts/build-web-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: web-dist, path: web/dist, if-no-files-found: error}

  linux:
    needs: [identity, tests, web]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, package_arch: amd64, file_arch: x64, toolchain_target: linux-x64}
          - {goarch: arm64, package_arch: arm64, file_arch: arm64, toolchain_target: linux-arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: web-dist, path: web/dist}
      - name: Download qualified FFmpeg
        env: {GH_TOKEN: '${{ github.token }}', TOOLCHAIN_TAG: '${{ needs.identity.outputs.toolchain_tag }}'}
        run: |
          mkdir -p .toolchain
          gh release download "$TOOLCHAIN_TAG" --pattern "portico-ffmpeg-${TOOLCHAIN_TAG}-${{ matrix.toolchain_target }}.tar.xz" --dir .toolchain
          mkdir -p .toolchain/ffmpeg
          tar -xJf .toolchain/*.tar.xz -C .toolchain/ffmpeg
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
      - run: ./scripts/package-linux.sh '${{ needs.identity.outputs.version }}' '${{ matrix.goarch }}' '${{ matrix.package_arch }}' '${{ matrix.file_arch }}' .toolchain/ffmpeg '${{ github.run_number }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: 'linux-${{ matrix.file_arch }}', path: 'dist/*linux-${{ matrix.file_arch }}.*', if-no-files-found: error}

  windows:
    needs: [identity, tests, web]
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goarch: amd64, file_arch: x64, toolchain_target: windows-x64}
          - {goarch: arm64, file_arch: arm64, toolchain_target: windows-arm64}
    defaults: {run: {shell: bash}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: web-dist, path: web/dist}
      - name: Download qualified FFmpeg
        env: {GH_TOKEN: '${{ github.token }}', TOOLCHAIN_TAG: '${{ needs.identity.outputs.toolchain_tag }}'}
        run: |
          mkdir -p .toolchain/ffmpeg
          gh release download "$TOOLCHAIN_TAG" --pattern "portico-ffmpeg-${TOOLCHAIN_TAG}-${{ matrix.toolchain_target }}.tar.xz" --dir .toolchain
          tar -xJf .toolchain/*.tar.xz -C .toolchain/ffmpeg
      - run: choco install nsis --no-progress --yes
      - run: ./scripts/package-windows.sh '${{ needs.identity.outputs.version }}' '${{ matrix.goarch }}' '${{ matrix.file_arch }}' .toolchain/ffmpeg '${{ github.run_number }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: 'windows-${{ matrix.file_arch }}', path: 'dist/Portico-Media-Server-Windows-${{ matrix.file_arch }}-*', if-no-files-found: error}

  macos:
    needs: [identity, tests, web]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: {go-version-file: go.mod, cache-dependency-path: go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: web-dist, path: web/dist}
      - name: Download qualified FFmpeg
        env: {GH_TOKEN: '${{ github.token }}', TOOLCHAIN_TAG: '${{ needs.identity.outputs.toolchain_tag }}'}
        run: |
          mkdir -p .toolchain/ffmpeg
          gh release download "$TOOLCHAIN_TAG" --pattern "portico-ffmpeg-${TOOLCHAIN_TAG}-macos-arm64.tar.xz" --dir .toolchain
          tar -xJf .toolchain/*.tar.xz -C .toolchain/ffmpeg
          ./scripts/verify-ffmpeg-bundle.sh .toolchain/ffmpeg full
      - run: ./scripts/package-macos.sh '${{ needs.identity.outputs.version }}' .toolchain/ffmpeg '${{ github.run_number }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: macos-arm64, path: dist/Portico-Media-Server-macOS-arm64.dmg, if-no-files-found: error}

  docker:
    needs: [identity, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - name: Download Linux media toolchains
        env: {GH_TOKEN: '${{ github.token }}', TOOLCHAIN_TAG: '${{ needs.identity.outputs.toolchain_tag }}'}
        run: |
          for pair in amd64:linux-x64 arm64:linux-arm64; do
            arch="${pair%%:*}"; target="${pair#*:}"
            mkdir -p ".release/ffmpeg/$arch" .toolchain
            gh release download "$TOOLCHAIN_TAG" --pattern "portico-ffmpeg-${TOOLCHAIN_TAG}-${target}.tar.xz" --dir .toolchain
            tar -xJf ".toolchain/portico-ffmpeg-${TOOLCHAIN_TAG}-${target}.tar.xz" -C ".release/ffmpeg/$arch"
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/porticomediaserver/portico-server:${{ needs.identity.outputs.version }}
            ghcr.io/porticomediaserver/portico-server:latest
          build-args: |
            VERSION=${{ needs.identity.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            COMMIT=${{ needs.identity.outputs.commit }}
            BUILT_AT=${{ needs.identity.outputs.built_at }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: {subject-name: 'ghcr.io/porticomediaserver/portico-server', subject-digest: '${{ steps.build.outputs.digest }}', push-to-registry: true}

  publish:
    needs: [identity, linux, windows, macos, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.tag }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: dist/artifacts, pattern: 'linux-*', merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: dist/artifacts, pattern: 'windows-*', merge-multiple: true}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: dist/artifacts, name: macos-arm64}
      - run: |
          cd dist/artifacts
          sha256sum ./* | sort -k2 > checksums.sha256
          cd ../..
          node scripts/write-public-update-manifest.mjs '${{ needs.identity.outputs.version }}'
          cp dist/portico-update-manifest.json dist/artifacts/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: {path: dist/artifacts, format: spdx-json, output-file: dist/artifacts/portico-release.spdx.json}
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: {subject-path: 'dist/artifacts/*'}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: '${{ needs.identity.outputs.tag }}'
          name: 'Portico Media Server ${{ needs.identity.outputs.version }} — Development Preview'
          prerelease: false
          generate_release_notes: true
          body: |
            Portico Media Server is still prerelease-quality software. This release is published as the current development preview so the permanent `/releases/latest` link remains useful.

            Linux downloads include distribution-neutral `.tar.gz` bundles for x64 and ARM64 as well as DEB and RPM packages.

            Packages are unsigned. Automatic installation is disabled; verify `checksums.sha256` and install manually.
          files: dist/artifacts/*
