name: Release Portico Media Server

# A numbered release starts from a reviewed vMAJOR.MINOR.PATCH tag. It reruns
# the CI suite, builds every server binary from an isolated, sealed source
# snapshot (scripts/build-server-release.py) with the approved FFmpeg toolchain
# release (third_party/ffmpeg/sources.lock.json releaseTag), packages them,
# pushes the container image and publishes the GitHub Release.
#
# Protected server-release environment secret: PORTICO_RELEASE_SIGNING_KEY, the base64 of the 32-byte raw
# Ed25519 private key that signs each build manifest (server/api/release-signing.md).
# Optional: PORTICO_MACOS_SIGNING_IDENTITY for a signed macOS app.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and publish
        required: true
      toolchain_run:
        description: Existing validation run with completed, exact pinned FFmpeg archives (never rebuilds)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: server-versioned-release
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.cache/go-build
  GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
  PORTICO_RELEASE_SIGNING_KEY_FILE: ${{ github.workspace }}/../.private/server-signing/20261018-github-actions/private-key
  PORTICO_RELEASE_PUBLIC_KEY_FILE: ${{ github.workspace }}/../.private/server-signing/20261018-github-actions/pinned-public-key

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      toolchain_tag: ${{ steps.identity.outputs.toolchain_tag }}
      built_at: ${{ steps.identity.outputs.built_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ inputs.tag || github.ref }}', fetch-depth: 0}
      - id: identity
        env: {REQUESTED_TAG: '${{ inputs.tag || github.ref_name }}'}
        run: |
          [[ "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          {
            echo "tag=$REQUESTED_TAG"
            echo "sha=$(git rev-parse HEAD)"
            echo "version=${REQUESTED_TAG#v}"
            echo "toolchain_tag=$(python3 -c "import json;print(json.load(open('third_party/ffmpeg/sources.lock.json'))['releaseTag'])")"
            echo "built_at=$(git show -s --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ HEAD)"
          } >> "$GITHUB_OUTPUT"
      - name: Require a new immutable version and an independent release public pin
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ inputs.tag || github.ref_name }}', PUBLIC_KEY: '${{ vars.PORTICO_RELEASE_PUBLIC_KEY }}'}
        run: |
          set -euo pipefail
          test -n "$PUBLIC_KEY"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace assets." >&2
            exit 1
          fi

  tests:
    needs: identity
    uses: ./.github/workflows/ci.yml
    # The suite must run on the tag being published, not on the ref a manual
    # dispatch happened to start from.
    with: {ref: '${{ needs.identity.outputs.sha }}'}

  toolchain:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: linux-x64}
          - {runner: ubuntu-24.04-arm, target: linux-arm64}
          - {runner: windows-2025, target: windows-x64}
          - {runner: windows-11-arm, target: windows-arm64}
          - {runner: macos-15, target: macos-arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env: {PORTICO_REQUIRE_QUALIFIED_FFMPEG: "1", PORTICO_TEST_TIER: all}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - name: Fetch and verify the exact recipe without rebuilding source
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}', TOOLCHAIN_RUN: '${{ inputs.toolchain_run || vars.PORTICO_FFMPEG_TOOLCHAIN_RUN }}'}
        run: scripts/fetch-release-ffmpeg.sh '${{ matrix.target }}' third_party/ffmpeg/bundle "$TOOLCHAIN_RUN"
      - name: Execute the actual media tools on their native architecture
        shell: bash
        run: scripts/verify-ffmpeg-bundle.sh third_party/ffmpeg/bundle full
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Qualify subtitle rendering and playback with the native bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch
          cd server
          export PORTICO_PLAYBACK_TEST_HELPER="$PWD/../.scratch/portico-server"
          if [[ "$RUNNER_OS" == Windows ]]; then export PORTICO_PLAYBACK_TEST_HELPER="$PORTICO_PLAYBACK_TEST_HELPER.exe"; fi
          go build -o "$PORTICO_PLAYBACK_TEST_HELPER" ./cmd/server
          go test -timeout=30m -v ./internal/decoder ./internal/playback -run 'Test(BurnGraphDrawsOnlyAtTheTitleClock|OrdinaryBurnSelectionReplansRotatesGrantAndReturnsToCopy)$'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: 'qualified-ffmpeg-${{ matrix.target }}', path: '.toolchain/${{ matrix.target }}/*.tar.xz', if-no-files-found: error, compression-level: 0}

  publish-toolchain:
    needs: [identity, toolchain]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {pattern: 'qualified-ffmpeg-*', path: .qualified}
      - name: Preserve the qualified recipe for future version tags
        env: {GH_TOKEN: '${{ github.token }}', TAG: '${{ needs.identity.outputs.toolchain_tag }}', SOURCE_SHA: '${{ needs.identity.outputs.sha }}'}
        run: |
          set -euo pipefail
          mkdir -p .toolchain-release
          for target in linux-x64 linux-arm64 windows-x64 windows-arm64 macos-arm64; do
            archive=(.qualified/qualified-ffmpeg-"$target"/*.tar.xz)
            test "${#archive[@]}" = 1
            cp "${archive[0]}" ".toolchain-release/portico-ffmpeg-${TAG}-${target}.tar.xz"
          done
          (cd .toolchain-release && sha256sum ./*.tar.xz | sort -k2 > checksums.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An existing immutable toolchain release must match; never replace it.
            gh release download "$TAG" --pattern checksums.sha256 --dir .qualified
            cmp .toolchain-release/checksums.sha256 .qualified/checksums.sha256
          else
            gh release create "$TAG" .toolchain-release/* --target "$SOURCE_SHA" --prerelease --latest=false --title "FFmpeg toolchain $TAG" --notes "Pinned recipe and file hashes verified; actual media capabilities and Portico subtitle/playback tests passed natively for Linux x64/ARM64, Windows x64/ARM64 and macOS ARM64. Archives include exact corresponding source, recipe provenance, patches and dependency license texts. GPL version 3; no nonfree components. No macOS Intel archive is claimed."
          fi

  qualification:
    needs: [identity, tests, toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PORTICO_TEST_TIER: all
      PORTICO_PERFORMANCE_TIER: release
      PORTICO_REQUIRE_QUALIFIED_FFMPEG: "1"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qualified-ffmpeg-linux-x64, path: .toolchain}
      - name: Test the application revision with its qualified media bundle
        run: |
          set -euo pipefail
          mkdir -p third_party/ffmpeg/bundle .scratch
          tar -xJf .toolchain/*.tar.xz -C third_party/ffmpeg/bundle
          scripts/verify-ffmpeg-bundle.sh third_party/ffmpeg/bundle full
          cd server
          go build -o ../.scratch/portico-server ./cmd/server
          export PORTICO_PLAYBACK_TEST_HELPER="$PWD/../.scratch/portico-server"
          go test -timeout=120m ./...

  web:
    needs: [identity, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version-file: .node-version, cache: npm}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Warm the offline Go licence inventory
        working-directory: server
        run: go mod download
      - run: npm ci --no-audit --no-fund
      - run: npm run build --workspace portico-web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: web-dist, path: web/dist, if-no-files-found: error}

  server:
    environment: server-release
    # Every target is cross-compiled on Linux (CGO off); the sealing script runs
    # the server suite before each build, so each job needs the test database.
    needs: [identity, tests, qualification, web, publish-toolchain]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: linux, arch: amd64, target: linux-x64}
          - {os: linux, arch: arm64, target: linux-arm64}
          - {os: windows, arch: amd64, target: windows-x64}
          - {os: windows, arch: arm64, target: windows-arm64}
          - {os: darwin, arch: arm64, target: macos-arm64}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: web-dist, path: .release/web}
      - name: Release tools
        run: |
          python3 -m venv .release/venv
          .release/venv/bin/pip install -r scripts/requirements-release.txt
          echo "$PWD/.release/venv/bin" >> "$GITHUB_PATH"
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.4
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip rpm libarchive-tools p7zip-full
          mkdir -p .cache/tmp .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: 'qualified-ffmpeg-${{ matrix.target }}', path: .toolchain}
      - name: Extract the qualified FFmpeg toolchain
        run: |
          mkdir -p .toolchain/ffmpeg
          tar -xJf .toolchain/*.tar.xz -C .toolchain/ffmpeg
          python3 scripts/verify-ffmpeg-manifest.py .toolchain/ffmpeg
      - name: Restore the release signing key
        env: {KEY: '${{ secrets.PORTICO_RELEASE_SIGNING_KEY }}', PUBLIC_KEY: '${{ vars.PORTICO_RELEASE_PUBLIC_KEY }}'}
        run: |
          install -d -m 700 "$(dirname "$PORTICO_RELEASE_SIGNING_KEY_FILE")"
          umask 077
          printf '%s' "$KEY" | base64 --decode > "$PORTICO_RELEASE_SIGNING_KEY_FILE"
          test "$(wc -c < "$PORTICO_RELEASE_SIGNING_KEY_FILE")" -eq 32
          test -n "$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | base64 --decode > "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
          test "$(wc -c < "$PORTICO_RELEASE_PUBLIC_KEY_FILE")" -eq 32
      - name: Build and seal the server
        id: build
        run: |
          set -euo pipefail
          python3 scripts/build-server-release.py --version '${{ needs.identity.outputs.version }}' --os '${{ matrix.os }}' --arch '${{ matrix.arch }}' --ffmpeg-bundle .toolchain/ffmpeg | tee .release/build.log
          result="$(tail -1 .release/build.log)"
          echo "stage=$(python3 -c "import json,sys;print(json.loads(sys.argv[1])['directory'])" "$result")" >> "$GITHUB_OUTPUT"
      - name: Package
        run: ./scripts/package-release.sh '${{ matrix.os }}' '${{ matrix.arch }}' '${{ needs.identity.outputs.version }}' '${{ steps.build.outputs.stage }}' .release/web dist '${{ github.run_number }}'
      - name: Inspect every native installer and portable archive
        if: matrix.os != 'darwin'
        run: python3 scripts/verify-packaged-server.py '${{ matrix.os }}' '${{ matrix.arch }}' '${{ needs.identity.outputs.version }}' dist
      - name: Forget the signing key
        if: always()
        run: rm -f "$PORTICO_RELEASE_SIGNING_KEY_FILE" "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os != 'darwin'
        with: {name: 'assets-${{ matrix.target }}', path: 'dist/*${{ matrix.os == ''windows'' && ''Windows'' || ''linux'' }}*${{ matrix.arch == ''amd64'' && ''x64'' || ''arm64'' }}*.*', if-no-files-found: error}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'darwin'
        with: {name: macos-payload, path: dist/payload-darwin-arm64, if-no-files-found: error}

  macos:
    environment: server-release
    needs: [identity, server]
    runs-on: macos-15
    env:
      PORTICO_MACOS_INSTALLER_IDENTITY: ${{ secrets.PORTICO_MACOS_INSTALLER_IDENTITY }}
      PORTICO_MACOS_SIGNING_IDENTITY: ${{ secrets.PORTICO_MACOS_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {name: macos-payload, path: .release/macos-payload}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        if: env.PORTICO_MACOS_SIGNING_IDENTITY != ''
        with: {go-version-file: server/go.mod, cache-dependency-path: server/go.sum}
      - name: Signed package tools
        if: env.PORTICO_MACOS_SIGNING_IDENTITY != ''
        run: |
          python3 -m venv .release/signing-venv
          .release/signing-venv/bin/python -m pip install -r scripts/requirements-release.txt
          echo "$PWD/.release/signing-venv/bin" >> "$GITHUB_PATH"
      - name: Restore the release signing key
        if: env.PORTICO_MACOS_SIGNING_IDENTITY != ''
        env: {KEY: '${{ secrets.PORTICO_RELEASE_SIGNING_KEY }}', PUBLIC_KEY: '${{ vars.PORTICO_RELEASE_PUBLIC_KEY }}'}
        run: |
          install -d -m 700 "$(dirname "$PORTICO_RELEASE_SIGNING_KEY_FILE")"
          umask 077
          python3 -c "import base64,os,pathlib; pathlib.Path(os.environ['PORTICO_RELEASE_SIGNING_KEY_FILE']).write_bytes(base64.b64decode(os.environ['KEY'], validate=True))"
          test "$(wc -c < "$PORTICO_RELEASE_SIGNING_KEY_FILE")" -eq 32
          test -n "$PUBLIC_KEY"
          printf '%s' "$PUBLIC_KEY" | base64 --decode > "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
      - name: Execute the actual macOS server and media bundle
        run: |
          chmod +x .release/macos-payload/portico-server .release/macos-payload/third_party/ffmpeg/bin/*
          .release/macos-payload/portico-server --version | grep -F '${{ needs.identity.outputs.version }}'
          scripts/verify-ffmpeg-bundle.sh .release/macos-payload/third_party/ffmpeg full
      - run: ./scripts/package-macos.sh '${{ needs.identity.outputs.version }}' .release/macos-payload dist '${{ github.run_number }}'
      - name: Verify the expanded installer payload and disk image
        run: |
          set -euo pipefail
          hdiutil verify dist/Portico-Media-Server-macOS-arm64.dmg
          pkgutil --expand-full dist/Portico-Media-Server-macOS-arm64.pkg .release/expanded-package
          python3 - '${{ needs.identity.outputs.version }}' <<'VERIFY'
          import hashlib, json, pathlib, subprocess, sys
          binaries=list(pathlib.Path('.release/expanded-package').rglob('portico-server'))
          assert len(binaries)==1, binaries
          binary=binaries[0]
          manifest=json.loads((binary.parent/'manifest.json').read_text())
          assert manifest['version']==sys.argv[1]
          assert manifest['target']=='darwin-arm64'
          assert hashlib.sha256(binary.read_bytes()).hexdigest()==manifest['artifact']['sha256']
          assert (binary.parent/'web/index.html').is_file()
          subprocess.run([str(binary.resolve()),'--version'],check=True)
          VERIFY
      - name: Forget the signing key
        if: always()
        run: rm -f "$PORTICO_RELEASE_SIGNING_KEY_FILE" "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: assets-macos-arm64, path: dist/Portico-Media-Server-macOS-arm64.*, if-no-files-found: error}

  docker:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    # Do not move the public container tags until every native package exists.
    needs: [identity, server, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qualified-ffmpeg-linux-x64, path: .toolchain/linux-x64}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qualified-ffmpeg-linux-arm64, path: .toolchain/linux-arm64}
      - name: Extract both verified image media bundles
        run: |
          set -euo pipefail
          for pair in x64:amd64 arm64:arm64; do
            target="linux-${pair%%:*}"
            bundle="third_party/ffmpeg/bundle/linux-${pair##*:}"
            mkdir -p "$bundle"
            tar -xJf ".toolchain/$target"/*.tar.xz -C "$bundle"
            python3 scripts/verify-ffmpeg-manifest.py "$bundle"
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/porticomediaserver/portico-server:${{ needs.identity.outputs.version }}
          build-args: |
            PORTICO_VERSION=${{ needs.identity.outputs.version }}
            PORTICO_BUILT_AT=${{ needs.identity.outputs.built_at }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: {subject-name: 'ghcr.io/porticomediaserver/portico-server', subject-digest: '${{ steps.build.outputs.digest }}', push-to-registry: true}

  docker-verify:
    needs: [identity, docker]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - name: Pull and execute both published architectures without registry credentials
        env: {VERSION: '${{ needs.identity.outputs.version }}', DIGEST: '${{ needs.docker.outputs.digest }}'}
        run: |
          set -euo pipefail
          image="ghcr.io/porticomediaserver/portico-server"
          install -d -m 700 "$RUNNER_TEMP/anonymous-ghcr"
          for arch in amd64 arm64; do
            docker --config "$RUNNER_TEMP/anonymous-ghcr" pull --platform "linux/$arch" "$image@$DIGEST" || {
              echo "Public container access is required. Set package visibility to public: https://github.com/orgs/PorticoMediaServer/packages/container/portico-server/settings" >&2
              exit 1
            }
            docker --config "$RUNNER_TEMP/anonymous-ghcr" run --rm --platform "linux/$arch" --entrypoint /usr/local/bin/portico-server "$image@$DIGEST" --version | grep -F "$VERSION"
            docker --config "$RUNNER_TEMP/anonymous-ghcr" run --rm --platform "linux/$arch" --entrypoint /opt/portico/third_party/ffmpeg/bin/ffmpeg "$image@$DIGEST" -version
          done

  publish:
    environment: server-release
    needs: [identity, server, macos, docker, docker-verify]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: '${{ needs.identity.outputs.sha }}'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: {path: dist/artifacts, pattern: 'assets-*', merge-multiple: true}
      - name: Verify the complete platform payload
        run: |
          set -euo pipefail
          expected=(
            Portico-Media-Server-Windows-x64-Setup.exe
            Portico-Media-Server-Windows-x64-Portable.zip
            Portico-Media-Server-Windows-arm64-Setup.exe
            Portico-Media-Server-Windows-arm64-Portable.zip
            Portico-Media-Server-macOS-arm64.dmg
            Portico-Media-Server-macOS-arm64.pkg
            portico-media-server-linux-x64.tar.gz
            portico-media-server-linux-x64.deb
            portico-media-server-linux-x64.rpm
            portico-media-server-linux-arm64.tar.gz
            portico-media-server-linux-arm64.deb
            portico-media-server-linux-arm64.rpm
          )
          for asset in "${expected[@]}"; do
            [[ -s "dist/artifacts/$asset" ]] || { echo "Missing or empty release asset: $asset" >&2; exit 1; }
          done
          actual="$(find dist/artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')"
          [[ "$actual" == "${#expected[@]}" ]] || { echo "Expected ${#expected[@]} assets, found $actual." >&2; find dist/artifacts -maxdepth 1 -type f | sort >&2; exit 1; }
      - name: Include the public manifest verification key
        env: {PUBLIC_KEY: '${{ vars.PORTICO_RELEASE_PUBLIC_KEY }}'}
        run: printf '%s' "$PUBLIC_KEY" | base64 --decode > dist/artifacts/portico-release-public-key.bin
      - run: |
          (cd dist/artifacts && sha256sum ./* | sort -k2 > checksums.sha256)
          node scripts/write-public-update-manifest.mjs '${{ needs.identity.outputs.version }}'
          cp dist/portico-update-manifest.json dist/artifacts/
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: {path: dist/artifacts, format: spdx-json, output-file: dist/artifacts/portico-release.spdx.json}
      - name: Authenticate the complete release
        env: {KEY: '${{ secrets.PORTICO_RELEASE_SIGNING_KEY }}', PUBLIC_KEY: '${{ vars.PORTICO_RELEASE_PUBLIC_KEY }}'}
        run: |
          set -euo pipefail
          python3 -m venv .release/sealing-venv
          .release/sealing-venv/bin/pip install -r scripts/requirements-release.txt
          install -d -m 700 "$(dirname "$PORTICO_RELEASE_SIGNING_KEY_FILE")"
          umask 077
          printf '%s' "$KEY" | base64 --decode > "$PORTICO_RELEASE_SIGNING_KEY_FILE"
          printf '%s' "$PUBLIC_KEY" | base64 --decode > "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
          .release/sealing-venv/bin/python scripts/seal-release-artifacts.py dist/artifacts --key "$PORTICO_RELEASE_SIGNING_KEY_FILE" --public-key "$PORTICO_RELEASE_PUBLIC_KEY_FILE" --source '${{ needs.identity.outputs.sha }}'
      - name: Forget final release signing material
        if: always()
        run: rm -f "$PORTICO_RELEASE_SIGNING_KEY_FILE" "$PORTICO_RELEASE_PUBLIC_KEY_FILE"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with: {subject-path: 'dist/artifacts/*'}
      - name: The release tag still names the tested revision
        env: {TAG: '${{ needs.identity.outputs.tag }}', SOURCE_SHA: '${{ needs.identity.outputs.sha }}'}
        run: |
          set -euo pipefail
          remote_sha=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" | awk 'NR==1 { direct=$1 } $2 ~ /\^\{\}$/ { peeled=$1 } END { print peeled ? peeled : direct }')
          test "$remote_sha" = "$SOURCE_SHA"
      - name: Publish and reconcile the complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_SHA: ${{ needs.identity.outputs.sha }}
          VERSION: ${{ needs.identity.outputs.version }}
          IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
        run: .release/sealing-venv/bin/python scripts/publish-server-release.py dist/artifacts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}
      - name: Promote Docker latest only after complete verified app publication
        env: {DIGEST: '${{ needs.docker.outputs.digest }}'}
        run: |
          set -euo pipefail
          image="ghcr.io/porticomediaserver/portico-server"
          docker buildx imagetools create --prefer-index=false --tag "$image:latest" "$image@$DIGEST"
          test "$(docker buildx imagetools inspect "$image:latest" --format '{{.Manifest.Digest}}')" = "$DIGEST"
          install -d -m 700 "$RUNNER_TEMP/anonymous-ghcr"
          docker --config "$RUNNER_TEMP/anonymous-ghcr" manifest inspect "$image:latest" >/dev/null
