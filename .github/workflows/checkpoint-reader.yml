name: Checkpoint Reader guest
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact canonical checkpoint commit including official artifacts
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checkpoint-reader
  cancel-in-progress: false
jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Verify immutable source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the immutable native guest
        working-directory: web
        run: npx --no-install vite build --config reader-native/vite.config.ts
      - name: Record source and exact guest tree
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root = Path('dist/PorticoReader.bundle')
          assert (root / 'index.html').is_file()
          assert (root / 'licences.json').is_file()
          assert list((root / 'assets').glob('pdf.worker-*.mjs'))
          files = []
          for path in sorted(root.rglob('*'), key=lambda p: p.relative_to(root).as_posix().encode()):
              assert not path.is_symlink()
              if path.is_file():
                  raw = path.read_bytes()
                  files.append({'path': path.relative_to(root).as_posix(), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
          digest = hashlib.sha256(''.join(f"{f['sha256']}  ./{f['path']}\n" for f in files).encode()).hexdigest()
          Path('reader-build.json').write_text(json.dumps({'source': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'treeDigest': digest, 'files': files}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-reader-${{ inputs.source_sha }}
          path: dist/PorticoReader.bundle/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-reader-identity-${{ inputs.source_sha }}
          path: reader-build.json
          if-no-files-found: error
          retention-days: 14
