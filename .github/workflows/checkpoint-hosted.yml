name: Corrective Hosted checkpoint
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact published corrective Hosted source
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: checkpoint-hosted-corrective
  cancel-in-progress: false
jobs:
  hosted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portico
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: portico_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: source
        name: Verify immutable source and prepare database
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/hosted-checkpoint" .scratch
          printf '%s' 'postgres://portico:disposable-ci-password@localhost:5432/portico_test?sslmode=disable' > .scratch/postgres.url
          echo "PORTICO_TEST_DATABASE_URL_FILE=$PWD/.scratch/postgres.url" >> "$GITHUB_ENV"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: hosted-services/hosted/go.mod
          cache-dependency-path: hosted-services/hosted/go.sum
      - name: Complete Hosted unit and PostgreSQL suites
        working-directory: hosted-services/hosted
        run: |
          status=0
          go test ./... > "$RUNNER_TEMP/hosted-checkpoint/tests.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/hosted-checkpoint/tests.log"
          exit "$status"
      - name: Check official Hosted generation convergence
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: hosted-services/hosted
        run: |
          status=0
          (go run ./cmd/apigen -root ../.. && git diff --exit-code -- api/hosted.openapi.json contracts/src/hosted) > "$RUNNER_TEMP/hosted-checkpoint/generation.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/hosted-checkpoint/generation.log"
          exit "$status"
      - name: Vet Hosted
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        working-directory: hosted-services/hosted
        run: |
          status=0
          go vet ./... > "$RUNNER_TEMP/hosted-checkpoint/vet.log" 2>&1 || status=$?
          echo "exit=$status"
          tail -n 20 "$RUNNER_TEMP/hosted-checkpoint/vet.log"
          exit "$status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: checkpoint-hosted-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/hosted-checkpoint/
          if-no-files-found: error
          retention-days: 14
